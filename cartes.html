<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartes des Joueurs - PPC Estapunta</title>
    
    <!-- Polices -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Fichier de styles global -->
    <link rel="stylesheet" href="style.css">

    <style>
        /* Conteneur principal étroit */
        .mobile-container {
            max-width: 520px !important;
            width: 100%;
            margin: 0 auto;
            padding: 12px;
            box-sizing: border-box;
        }

        .section-title { font-size: 0.85rem; color: var(--accent-color); text-transform: uppercase; font-weight: 700; margin-bottom: 10px; letter-spacing: 0.5px; }

        /* Écran de restriction d'accès */
        .access-guard-card {
            background: var(--card-bg);
            border: 2px solid var(--card-border);
            border-radius: 16px;
            padding: 28px 18px;
            text-align: center;
            margin-top: 24px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        .access-guard-icon {
            font-size: 2rem;
            color: var(--accent-color);
        }
        .access-guard-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--container-text);
        }
        .access-guard-desc {
            font-size: 0.78rem;
            color: var(--text-muted);
            line-height: 1.4;
            max-width: 320px;
        }
        .access-guard-btn {
            margin-top: 6px;
            display: inline-block;
            padding: 9px 16px;
            border-radius: 10px;
            background: var(--accent-color);
            color: #000;
            font-weight: 700;
            font-size: 0.78rem;
            text-decoration: none;
        }

        /* Conteneur de filtres sur 2 lignes */
        .filters-wrapper {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-width: 440px;
            margin-left: auto;
            margin-right: auto;
            margin-bottom: 14px;
        }
        .filter-container { display: flex; gap: 6px; background: var(--card-bg); padding: 5px; border-radius: 14px; border: 2px solid var(--card-border); box-shadow: 0 4px 12px rgba(23, 184, 144, 0.2); }
        .filter-btn { flex: 1; padding: 6px 4px; text-align: center; font-size: 0.72rem; font-weight: 600; border-radius: 9px; border: none; background: transparent; color: var(--container-text); cursor: pointer; transition: all 0.3s; }
        .filter-btn.active { background: var(--accent-color); color: #000; box-shadow: 0 2px 8px rgba(23, 184, 144, 0.4); }

        /* Grille en 2 colonnes étroites avec espacement accru */
        .players-list { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 12px; 
            align-items: stretch; 
        }
        
        @media (max-width: 768px) {
            .players-list { grid-template-columns: 1fr; }
        }

        /* Cartes très aérées en hauteur transformées en liens propres */
        .player-card { 
            background: var(--card-bg); 
            border: 2px solid var(--card-border); 
            border-radius: 14px; 
            padding: 20px 13px; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            height: 100%; 
            width: 100%;
            box-sizing: border-box;
            color: var(--container-text); 
            box-shadow: 0 4px 10px rgba(23, 184, 144, 0.15); 
            transition: all 0.25s ease; 
            text-decoration: none;
            cursor: pointer; 
        }
        .player-card:hover { border-color: var(--accent-color); background: var(--card-hover-bg); transform: translateY(-2px); text-decoration: none; color: var(--container-text); }
        
        .player-card-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 14px; gap: 8px; }
        .player-info-left { display: flex; align-items: flex-start; gap: 10px; overflow: hidden; flex: 1; }
        
        /* Photo agrandie à 64x64px et carrée */
        .player-photo { 
            width: 64px; 
            height: 64px; 
            border-radius: 0px; 
            object-fit: cover; 
            border: 2px solid var(--accent-color); 
            background: rgba(0,0,0,0.2); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            color: var(--accent-color); 
            font-weight: bold; 
            flex-shrink: 0; 
            font-size: 0.9rem; 
        }

        .player-details-vertical { 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
            width: 100%;
            gap: 4px;
        }
        .player-name-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 4px;
        }
        .player-name { font-weight: bold; font-size: 0.82rem; color: var(--container-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .player-source-tag {
            font-size: 0.52rem;
            font-weight: 700;
            text-transform: uppercase;
            padding: 1px 5px;
            border-radius: 4px;
            flex-shrink: 0;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            background: rgba(23, 184, 144, 0.14);
        }
        .player-source-tag.autre {
            border-color: var(--text-muted);
            color: var(--text-muted);
            background: rgba(148, 163, 184, 0.12);
        }
        .player-club { font-size: 0.58rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .player-bottom-row {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 6px;
            margin-top: 6px;
        }
        .player-poste { font-size: 0.68rem; color: var(--accent-color); font-weight: 600; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .note-badge { font-size: 1.6rem; font-weight: 800; color: var(--accent-color); line-height: 1; flex-shrink: 0; text-align: right; }
        .note-badge span { font-size: 0.58rem; color: var(--text-muted); font-weight: normal; }

        .stats-grid-mini { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; text-align: center; background: rgba(0, 0, 0, 0.2); padding: 10px 6px; border-radius: 8px; border: 1px solid var(--card-border); margin-bottom: 12px; font-size: 0.72rem; }
        .stats-grid-mini span { display: block; }
        .stats-label { color: var(--text-muted); font-size: 0.58rem; margin-bottom: 3px; text-transform: uppercase; }

        .metrics-details { font-size: 0.72rem; color: var(--container-text); display: flex; flex-direction: column; gap: 2px; }
        .metric-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 4px; border-bottom: 1px solid rgba(255, 255, 255, 0.07); gap: 8px; }
        .metric-row:last-child { border-bottom: none; }
        .metric-label { color: var(--text-muted); flex-shrink: 0; font-weight: 600; }
        .metric-values { text-align: right; line-height: 1.45; display: inline-flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: 5px; }
        .stat-pill {
            display: inline-block;
            padding: 1px 6px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.68rem;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .stat-pill-pos {
            color: #34d399;
            background: rgba(52, 211, 153, 0.12);
            border-color: rgba(52, 211, 153, 0.28);
        }
        .stat-pill-neg {
            color: #f87171;
            background: rgba(248, 113, 113, 0.12);
            border-color: rgba(248, 113, 113, 0.28);
        }
        .stat-sep {
            color: var(--text-muted);
            font-weight: 500;
        }

        .metric-row-stacked {
            flex-direction: column;
            align-items: flex-start;
            padding: 8px 4px;
        }
        .metric-row-stacked .metric-values {
            width: 100%;
            justify-content: flex-end;
            margin-top: 3px;
        }
    </style>
</head>
<body>

<div class="mobile-container">
    <!-- En-tête -->
    <div class="top-header">
        <img src="logoce.png" alt="Logo Cesta Punta" class="logo-img">
        <div class="header-actions">
            <a href="accueil.html" class="home-btn" title="Retour Accueil">🏠</a>
            <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()" title="Changer de thème">🌙</button>
            <a href="parametres.html" class="profile-btn" title="Mon Compte">👤</a>
        </div>
    </div>

    <!-- Trait de séparation -->
    <hr class="separator">

    <!-- Message affiché si l'utilisateur n'a pas le rôle requis -->
    <section id="accessGuardSection" class="access-guard-card">
        <div class="access-guard-icon"><i class="fa-solid fa-lock"></i></div>
        <div id="accessGuardTitle" class="access-guard-title">Vérification des droits d'accès...</div>
        <div id="accessGuardDesc" class="access-guard-desc">Cette page est réservée aux comptes ayant le rôle entraîneur+ ou administrateur.</div>
        <a href="accueil.html" id="accessGuardBackBtn" class="access-guard-btn" style="display: none;">Retour à l'accueil</a>
    </section>

    <!-- Contenu réservé aux rôles admin et entraineurplus -->
    <div id="protectedPageContent" style="display: none;">
        <div class="section-title" style="text-align: center;">Cartes des Joueurs — Moyennes / 1 Partie</div>

        <!-- Filtres d'affichage sur 2 lignes -->
        <div class="filters-wrapper">
            <div class="filter-container">
                <button id="btn-all" onclick="filterPlayers('all')" class="filter-btn active">Tous</button>
                <button id="btn-avants" onclick="filterPlayers('avants')" class="filter-btn">Avants</button>
                <button id="btn-arrieres" onclick="filterPlayers('arrieres')" class="filter-btn">Arrières</button>
            </div>
            <div class="filter-container">
                <button id="btn-pole" onclick="filterPlayers('pole')" class="filter-btn">Joueurs Pôle</button>
                <button id="btn-autres" onclick="filterPlayers('autres')" class="filter-btn">Autres Joueurs</button>
            </div>
        </div>

        <main class="space-y-6">
            <section id="section-avants">
                <div class="section-title" style="margin-top: 5px;"><i class="fa-solid fa-bolt mr-1"></i> Avants</div>
                <div id="grid-avants" class="players-list"></div>
            </section>

            <section id="section-arrieres">
                <div class="section-title" style="margin-top: 15px;"><i class="fa-solid fa-shield mr-1"></i> Arrières</div>
                <div id="grid-arrieres" class="players-list"></div>
            </section>
        </main>
    </div>
</div>

<!-- Scripts de données -->
<script src="joueurs-data.js?v=7"></script>
<script src="staffe-data.js"></script>
<script src="statsdata.js"></script>
<script src="matchs-data.js"></script>

<!-- Script Principal Firebase et Logique -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBTujsGZneEGx1_V27zgRNf9-qM9zFFHQA",
        authDomain: "ppcestapunta64500.firebaseapp.com",
        projectId: "ppcestapunta64500",
        storageBucket: "ppcestapunta64500.firebasestorage.app",
        messagingSenderId: "80945272911",
        appId: "1:80945272911:web:154437e054b190e7ebb23a",
        measurementId: "G-SCYGWMW7VF"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    window.matchsCloudCharges = [];
    window.joueursFirebaseCharges = [];
    window.tousLesJoueursFusionnes = [];
    window.filtreActif = 'all';
    let donneesDejaChargees = false;

    const savedTheme = localStorage.getItem('cesta_theme') || 'dark';
    const htmlElement = document.documentElement;
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    htmlElement.setAttribute('data-theme', savedTheme);
    updateButtonIcon(savedTheme);

    window.toggleTheme = function() {
        const currentTheme = htmlElement.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        htmlElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('cesta_theme', newTheme);
        updateButtonIcon(newTheme);
    }

    function updateButtonIcon(theme) {
        if (theme === 'light') {
            themeToggleBtn.innerHTML = '☀';
        } else {
            themeToggleBtn.innerHTML = '🌙';
        }
    }

    function normaliserRole(role) {
        return String(role || '')
            .toLowerCase()
            .normalize("NFD")
            .replace(/[̀-ͯ]/g, "")
            .replace(/[\s_-]+/g, '')
            .trim();
    }

    function estRoleAutorise(role) {
        const r = normaliserRole(role);
        return r === 'admin' || r === 'administrateur' || r === 'entraineurplus';
    }

    function afficherEtatAcces(autorise, messageTitre = '', messageDesc = '') {
        const guardSection = document.getElementById('accessGuardSection');
        const guardTitle = document.getElementById('accessGuardTitle');
        const guardDesc = document.getElementById('accessGuardDesc');
        const guardBackBtn = document.getElementById('accessGuardBackBtn');
        const protectedContent = document.getElementById('protectedPageContent');

        if (autorise) {
            if (guardSection) guardSection.style.display = 'none';
            if (protectedContent) protectedContent.style.display = 'block';
            if (!donneesDejaChargees) {
                donneesDejaChargees = true;
                chargerDonneesEtCalculer();
            }
        } else {
            if (protectedContent) protectedContent.style.display = 'none';
            if (guardSection) guardSection.style.display = 'flex';
            if (guardTitle) guardTitle.textContent = messageTitre || 'Accès réservé';
            if (guardDesc) guardDesc.textContent = messageDesc || 'Cette page est réservée aux comptes ayant le rôle entraîneur+ ou administrateur.';
            if (guardBackBtn) guardBackBtn.style.display = 'inline-block';
        }
    }

    const roleLocalInitial = localStorage.getItem('cesta_user_role') || '';
    if (estRoleAutorise(roleLocalInitial)) {
        afficherEtatAcces(true);
    }

    onAuthStateChanged(auth, async (user) => {
        if (!user) {
            const roleCourant = localStorage.getItem('cesta_user_role') || '';
            if (!estRoleAutorise(roleCourant)) {
                afficherEtatAcces(
                    false,
                    'Accès réservé',
                    'Veuillez vous connecter avec un compte entraîneur+ ou administrateur pour consulter les cartes.'
                );
            }
            return;
        }

        let roleFirestore = '';
        try {
            const userSnap = await getDoc(doc(db, "users", user.uid));
            if (userSnap.exists() && userSnap.data().role) {
                roleFirestore = userSnap.data().role;
                localStorage.setItem('cesta_user_role', roleFirestore);
            }
        } catch (err) {
            console.error("Erreur lecture rôle utilisateur :", err);
        }

        const roleEffectif = roleFirestore || localStorage.getItem('cesta_user_role') || '';
        if (estRoleAutorise(roleEffectif)) {
            afficherEtatAcces(true);
        } else {
            afficherEtatAcces(
                false,
                'Accès non autorisé',
                'Seuls les comptes ayant le rôle entraîneur+ ou administrateur peuvent accéder aux cartes des joueurs.'
            );
        }
    });

    function normaliserNom(str) {
        return String(str || '')
            .toLowerCase()
            .normalize("NFD")
            .replace(/[̀-ͯ]/g, "")
            .replace(/\s+/g, '')
            .trim();
    }

    function construireListeJoueurs() {
        const fusion = [];
        const nomsVus = new Set();

        const joueursLocauxRaw = localStorage.getItem('joueurs_locaux') || localStorage.getItem('joueurs') || '[]';
        let idsLocaux = [];
        try {
            const parsed = JSON.parse(joueursLocauxRaw);
            idsLocaux = Array.isArray(parsed)
                ? parsed.map(item => String(typeof item === 'object' ? (item.id || item.firebaseId || item.docId) : item))
                : [];
        } catch (e) {
            idsLocaux = [];
        }

        if (typeof joueursData !== 'undefined' && Array.isArray(joueursData)) {
            joueursData.forEach((joueur, index) => {
                if (joueur.statut === "retraite" || joueur.retraite === true) return;

                const joueurId = joueur.id || joueur.firebaseId || joueur.docId || `pole_${index}`;
                const nomComplet = `${joueur.prenom || ''} ${joueur.nom || ''}`.trim();
                const cleNorm = normaliserNom(nomComplet);

                const estPoleExplicite = joueur.estPole === true || joueur.pole === true || String(joueur.groupe || '').toLowerCase().includes('pole');
                const estEnLocal = idsLocaux.includes(String(joueurId)) || localStorage.getItem(`joueur_${joueurId}`) !== null;
                const estDuPole = estPoleExplicite || estEnLocal || idsLocaux.length === 0 || (joueur.club && String(joueur.club).toLowerCase().includes('pôle'));

                fusion.push({
                    ...joueur,
                    id: joueurId,
                    estDuPole: Boolean(estDuPole)
                });

                if (cleNorm) nomsVus.add(cleNorm);
            });
        }

        (window.joueursFirebaseCharges || []).forEach((jFb, index) => {
            if (jFb.statut === "retraite" || jFb.retraite === true) return;

            const nomComplet = `${jFb.prenom || ''} ${jFb.nom || ''}`.trim();
            const cleNorm = normaliserNom(nomComplet);

            const doublonExact = cleNorm && nomsVus.has(cleNorm);
            const doublonId = fusion.some(item => String(item.id) === String(jFb.id));

            if (!doublonExact && !doublonId) {
                const estPoleFb = jFb.estPole === true || jFb.pole === true || String(jFb.groupe || '').toLowerCase().includes('pole');
                fusion.push({
                    ...jFb,
                    id: jFb.id || `fb_${index}`,
                    club: jFb.club || (estPoleFb ? 'Pôle Performance' : 'Autre Club'),
                    estDuPole: Boolean(estPoleFb)
                });
                if (cleNorm) nomsVus.add(cleNorm);
            }
        });

        window.tousLesJoueursFusionnes = fusion;
        return fusion;
    }

    function genererCartesJoueurs() {
        const listeJoueurs = construireListeJoueurs();
        const gridAvants = document.getElementById('grid-avants');
        const gridArrieres = document.getElementById('grid-arrieres');
        
        if (!gridAvants || !gridArrieres) return;

        gridAvants.innerHTML = '';
        gridArrieres.innerHTML = '';

        listeJoueurs.forEach(joueur => {
            const joueurId = joueur.id || joueur.firebaseId || joueur.docId;
            const posteLower = (joueur.poste || joueur.specialite || "").toLowerCase();
            const estAvant = posteLower.includes('avant');
            const initiales = `${joueur.prenom ? joueur.prenom.charAt(0) : ''}${joueur.nom ? joueur.nom.charAt(0) : ''}`;
            const posteTexte = joueur.poste || joueur.specialite || 'Joueur';
            const clubTexte = joueur.club || (joueur.estDuPole ? 'Pôle Performance' : 'Autre');
            const badgeSource = joueur.estDuPole
                ? `<span class="player-source-tag">Pôle</span>`
                : `<span class="player-source-tag autre">Autre</span>`;

            const carteHTML = `
            <a href="detail-joueur.html?id=${joueurId}" class="player-card" data-id="${joueurId}" data-est-avant="${estAvant}" data-est-pole="${joueur.estDuPole}">
                <div class="player-card-header">
                    <div class="player-info-left">
                        ${joueur.photo ? `<img src="${joueur.photo}" alt="${joueur.nom}" class="player-photo" onerror="this.onerror=null; this.src='logoce.png';">` : `<div class="player-photo">${initiales}</div>`}
                        <div class="player-details-vertical">
                            <div class="player-name-row">
                                <div class="player-name">${joueur.prenom || ''} ${joueur.nom || ''}</div>
                                ${badgeSource}
                            </div>
                            <div class="player-club">${clubTexte}</div>
                            <div class="player-bottom-row">
                                <div class="player-poste">${posteTexte}</div>
                                <span class="note-badge note-100">0<span>/100</span></span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="stats-grid-mini">
                    <div>
                        <span class="stats-label">Parties</span>
                        <span class="nb-matchs font-bold text-white" style="font-size: 0.8rem;">0</span>
                    </div>
                    <div>
                        <span class="stats-label">Victoires</span>
                        <span class="nb-victoires font-bold" style="color: #34d399; font-size: 0.8rem;">0</span>
                    </div>
                    <div>
                        <span class="stats-label">Défaites</span>
                        <span class="nb-defaites font-bold" style="color: #f87171; font-size: 0.8rem;">0</span>
                    </div>
                </div>

                <div class="metrics-details">
                    <div class="metric-row">
                        <span class="metric-label">Pelotes / match:</span>
                        <span class="metric-values"><strong class="pelotes-moy">0</strong> <span class="stat-pill stat-pill-pos pelotes-pct">0%</span></span>
                    </div>
                    <div class="metric-row">
                        <span class="metric-label">Pts gagnés / match:</span>
                        <span class="metric-values"><strong class="gagnes-moy">0</strong> <span class="stat-pill stat-pill-pos gagnes-pct">0%</span></span>
                    </div>
                    <div class="metric-row">
                        <span class="metric-label">Pts perdus / match:</span>
                        <span class="metric-values"><strong class="perdus-moy">0</strong> <span class="stat-pill stat-pill-neg perdus-pct">0%</span></span>
                    </div>
                    <div class="metric-row metric-row-stacked">
                        <span class="metric-label">Buts / match (Avant / Arrière):</span>
                        <span class="metric-values">
                            <strong class="buts-moy">0</strong>
                            <span class="stat-sep">•</span>
                            <span>Av: <strong class="buts-av-moy">0</strong> <span class="buts-av-pct">(0%)</span></span>
                            <span class="stat-sep">/</span>
                            <span>Arr: <strong class="buts-arr-moy">0</strong> <span class="buts-arr-pct">(0%)</span></span>
                        </span>
                    </div>
                    <div class="metric-row metric-row-stacked">
                        <span class="metric-label">Réceptions / match (+ / - / %):</span>
                        <span class="metric-values">
                            <strong class="rec-moy">0</strong>
                            <span class="stat-sep">(</span>
                            <span class="stat-pill stat-pill-pos"><span class="rec-pos-moy">0</span>+</span>
                            <span class="stat-sep">/</span>

                    </div>

                            <span class="stat-pill stat-pill-pos"><span class="cla-pos-moy">0</span>+</span>
                            <span class="stat-pill stat-pill-neg"><span class="cla-neg-moy">0</span>-</span>
                            <span class="stat-sep">)</span>
                        </span>
                    </div>
                    <div class="metric-row metric-row-stacked">
                        <span class="metric-label">Attaque / match (Moy / Neutre / + / -):</span>
                        <span class="metric-values">
                            <strong class="att-moy" style="color: var(--accent-color);">0</strong>
                            <span class="stat-sep">(</span>
                            <span class="stat-pill"><span class="att-neu-moy">0</span> neutre</span>
                            <span class="stat-pill stat-pill-pos"><span class="att-pos-moy">0</span>+</span>
                            <span class="stat-pill stat-pill-neg"><span class="att-neg-moy">0</span>-</span>
                            <span class="stat-sep">)</span>
                        </span>
                    </div>
                    <div class="metric-row">
                        <span class="metric-label">Pts amenés, réc. adv. nég. / match:</span>
                        <span class="metric-values">
                            <strong class="pts-amenes-rec-adv-neg-moy" style="color: var(--accent-color);">0</strong>
                            <span class="stat-pill stat-pill-pos pts-amenes-rec-adv-neg-pct">0%</span>
                        </span>
                    </div>
                </div>
            </a>
            `;

            if (estAvant) {
                gridAvants.insertAdjacentHTML('beforeend', carteHTML);
            } else {
                gridArrieres.insertAdjacentHTML('beforeend', carteHTML);
            }
        });
    }

    async function chargerDonneesEtCalculer() {
        genererCartesJoueurs();
        try {
            const querySnapshot = await getDocs(collection(db, "matchs"));
            window.matchsCloudCharges = [];
            querySnapshot.forEach((docSnap) => {
                const data = docSnap.data();
                window.matchsCloudCharges.push({
                    id: docSnap.id,
                    isCloud: true,
                    competition: data.competition || data.titre || "Match Cloud",
                    date: data.date || "",
                    lieu: data.lieu || "",
                    equipe1: data.equipe1 || "",
                    equipe2: data.equipe2 || "",
                    scoreEquipe1: data.scoreEquipe1 !== undefined ? data.scoreEquipe1 : data.equipe1Score,
                    scoreEquipe2: data.scoreEquipe2 !== undefined ? data.scoreEquipe2 : data.equipe2Score,
                    joueurId: data.joueurId || null,
                    statsParJoueur: data.statsParJoueur || null,
                    stats: data.stats || data
                });
            });

            const joueursSnap = await getDocs(collection(db, "joueurs"));
            window.joueursFirebaseCharges = [];
            joueursSnap.forEach((docSnap) => {
                const jData = docSnap.data();
                window.joueursFirebaseCharges.push({
                    id: docSnap.id,
                    prenom: jData.prenom || "",
                    nom: jData.nom || "",
                    club: jData.club || "",
                    poste: jData.poste || jData.specialite || "Joueur",
                    ...jData
                });
            });

            genererCartesJoueurs();
        } catch (error) {
            console.error("Erreur chargement Firebase :", error);
        }

        calculerToutesLesStatsJoueurs();
        appliquerFiltreCartes(window.filtreActif || 'all');
    }

    function determinerVainqueur(s1, s2) {
        if (s1 === undefined || s2 === undefined) return 0;
        let str1 = String(s1).trim();
        let str2 = String(s2).trim();

        let sets1 = str1.split(/[\/\s-]+/).map(Number).filter(n => !isNaN(n));
        let sets2 = str2.split(/[\/\s-]+/).map(Number).filter(n => !isNaN(n));

        if (sets1.length > 0 && sets2.length > 0) {
            let wins1 = 0, wins2 = 0;
            for (let i = 0; i < Math.min(sets1.length, sets2.length); i++) {
                if (sets1[i] > sets2[i]) wins1++;
                else if (sets2[i] > sets1[i]) wins2++;
            }
            if (wins1 > wins2) return 1;
            if (wins2 > wins1) return 2;
            let sum1 = sets1.reduce((a, b) => a + b, 0);
            let sum2 = sets2.reduce((a, b) => a + b, 0);
            if (sum1 > sum2) return 1;
            if (sum2 > sum1) return 2;
        }

        let num1 = parseFloat(str1);
        let num2 = parseFloat(str2);
        if (!isNaN(num1) && !isNaN(num2)) {
            if (num1 > num2) return 1;
            if (num2 > num1) return 2;
        }
        return 0;
    }

    function obtenirMatchsEnrichisPourJoueur(jId, jObj) {
        const listeMatchs = window.matchsCloudCharges || [];
        const currentIdStr = String(jId).trim().toLowerCase();
        const nomJoueur = (jObj.nom || "").trim().toLowerCase();
        const prenomJoueur = (jObj.prenom || "").trim().toLowerCase();

        return listeMatchs.map(match => {
            let sourceBrute = {};
            if (match.statsParJoueur) {
                let foundKey = Object.keys(match.statsParJoueur).find(k => {
                    const keyLower = String(k).trim().toLowerCase();
                    return keyLower === currentIdStr || keyLower === nomJoueur || keyLower === prenomJoueur;
                });
                if (foundKey) sourceBrute = match.statsParJoueur[foundKey];
            }
            if (!Object.keys(sourceBrute).length) {
                sourceBrute = { ...(match.stats || {}), ...match };
            }

            const e1 = (match.equipe1 || "").toLowerCase();
            const e2 = (match.equipe2 || "").toLowerCase();
            const estConcerne = (match.statsParJoueur && Object.keys(match.statsParJoueur).some(k => String(k).toLowerCase() === currentIdStr || String(k).toLowerCase() === nomJoueur)) ||
                                (match.joueurId && String(match.joueurId).toLowerCase() === currentIdStr) ||
                                (nomJoueur && (e1.includes(nomJoueur) || e2.includes(nomJoueur))) ||
                                (prenomJoueur && (e1.includes(prenomJoueur) || e2.includes(prenomJoueur)));

            if (!estConcerne) return null;

            let eqJoueur = 1;
            if ((nomJoueur && e2.includes(nomJoueur)) || (prenomJoueur && e2.includes(prenomJoueur))) {
                eqJoueur = 2;
            }

            const s1 = match.scoreEquipe1 !== undefined ? match.scoreEquipe1 : match.equipe1Score;
            const s2 = match.scoreEquipe2 !== undefined ? match.scoreEquipe2 : match.equipe2Score;
            const vainqueur = determinerVainqueur(s1, s2);
            let resultat = 'N'; 
            if (vainqueur !== 0) {
                resultat = (vainqueur === eqJoueur) ? 'V' : 'D';
            }

            const aireTot = Number(sourceBrute.aireTotal || 0);
            const airePos = Number(sourceBrute.airePositif || 0);
            const aireNeg = Number(sourceBrute.aireNegatif || 0);
            const boteTot = Number(sourceBrute.boteTotal || 0);
            const botePos = Number(sourceBrute.botePositif || 0);
            const boteNeg = Number(sourceBrute.boteNegatif || 0);
            const boteCorridoTot = Number(sourceBrute.boteCorridoTotal || 0);
            const boteCorridoPos = Number(sourceBrute.boteCorridoPositif || 0);
            const boteCorridoNeg = Number(sourceBrute.boteCorridoNegatif || 0);
            const boteProntoTot = Number(sourceBrute.boteProntoTotal || 0);
            const boteProntoPos = Number(sourceBrute.boteProntoPositif || 0);
            const boteProntoNeg = Number(sourceBrute.boteProntoNegatif || 0);
            const ereboteTot = Number(sourceBrute.ereboteTotal || 0);
            const erebotePos = Number(sourceBrute.erebotePositif || 0);
            const ereboteNeg = Number(sourceBrute.ereboteNegatif || 0);
            const pumpaTot = Number(sourceBrute.pumpa || sourceBrute.pumpaTotal || 0);
            const pumpaPos = Number(sourceBrute.pumpaPositif || 0);
            const pumpaNeg = Number(sourceBrute.pumpaNegatif || 0);

            const recTot = aireTot + boteTot + boteCorridoTot + boteProntoTot + ereboteTot + pumpaTot;
            const recPos = airePos + botePos + boteCorridoPos + boteProntoPos + erebotePos + pumpaPos;
            const recNeg = aireNeg + boteNeg + boteCorridoNeg + boteProntoNeg + ereboteNeg + pumpaNeg;

            const typesFrappesKeys = [
                ['frappesClassiquesTotal', 'frappesClassiquesPos', 'frappesClassiquesNeg'],
                ['frappesAttaqueTotal', 'frappesAttaquePos', 'frappesAttaqueNeg'],
                ['picadaTotal', 'picadaPos', 'picadaNeg'],
                ['dejadaTotal', 'dejadaPos', 'dejadaNeg'],
                ['txikTxakTotal', 'txikTxakPos', 'txikTxakNeg'],
                ['txulaTotal', 'txulaPos', 'txulaNeg'],
                ['cortadaTotal', 'cortadaPos', 'cortadaNeg'],
                ['gaucheGaucheTotal', 'gaucheGauchePos', 'gaucheGaucheNeg'],
                ['gaucheDroiteTotal', 'gaucheDroitePos', 'gaucheDroiteNeg'],
                ['deuxMursTotal', 'deuxMursPos', 'deuxMursNeg']
            ];

            let fTot = 0, fPos = 0, fNeg = 0;
            typesFrappesKeys.forEach(([tKey, pKey, nKey]) => {
                fTot += Number(sourceBrute[tKey] || 0);
                fPos += Number(sourceBrute[pKey] || 0);
                fNeg += Number(sourceBrute[nKey] || 0);
            });

            const attaquesTot = Number(sourceBrute.frappesAttaqueTotal || sourceBrute.attaquesTotal || 0);
            const attaquesPos = Number(sourceBrute.frappesAttaquePos || sourceBrute.attaquesPositif || 0);
            const attaquesNeg = Number(sourceBrute.frappesAttaqueNeg || sourceBrute.attaquesNegatif || 0);
            const attaquesNeuRaw = sourceBrute.frappesAttaqueNeutre ?? sourceBrute.attaquesNeutre;
            const attaquesNeu = attaquesNeuRaw !== undefined ? Number(attaquesNeuRaw) : Math.max(0, attaquesTot - attaquesPos - attaquesNeg);

            const classiquesTot = Number(sourceBrute.frappesClassiquesTotal || sourceBrute.classiquesTotal || 0);
            const classiquesPos = Number(sourceBrute.frappesClassiquesPos || sourceBrute.classiquesPositif || 0);
            const classiquesNeg = Number(sourceBrute.frappesClassiquesNeg || sourceBrute.classiquesNegatif || 0);
            const classiquesNeuRaw = sourceBrute.frappesClassiquesNeutre ?? sourceBrute.classiquesNeutre;
            const classiquesNeu = classiquesNeuRaw !== undefined ? Number(classiquesNeuRaw) : Math.max(0, classiquesTot - classiquesPos - classiquesNeg);

            return {
                resultat,
                stats: {
                    pelotesJouees: Number(sourceBrute.pelotesJouees || sourceBrute.pelotes || 0),
                    pelotesTotales: Number(sourceBrute.pelotesTotales || 100),
                    ptsGagnes: Number(sourceBrute.ptsGagnes || sourceBrute.pointsGagnes || 0),
                    ptsGagnesTotaux: Number(sourceBrute.ptsGagnesTotaux || 50),
                    ptsPerdus: Number(sourceBrute.ptsPerdus || sourceBrute.pointsPerdus || 0),
                    ptsPerdusTotaux: Number(sourceBrute.ptsPerdusTotaux || 50),
                    butsTotal: Number(sourceBrute.butsTotal || sourceBrute.buts || 0),
                    butsSurArriere: Number(sourceBrute.butsSurArriere || 0),
                    butsSurAvant: Number(sourceBrute.butsSurAvant || 0),
                    recTotal: recTot,
                    recPositif: recPos,
                    recNegatif: recNeg,
                    frappesTotal: fTot,
                    frappesPositif: fPos,
                    frappesNegatif: fNeg,
                    attaquesTotal: attaquesTot,
                    attaquesNeutre: attaquesNeu,
                    attaquesPositif: attaquesPos,
                    attaquesNegatif: attaquesNeg,
                    classiquesTotal: classiquesTot,
                    classiquesNeutre: classiquesNeu,
                    classiquesPositif: classiquesPos,
                    classiquesNegatif: classiquesNeg,
                    ptsAmenesRecAdvNeg: Number(
                        sourceBrute.ptsAmenesRecAdvNeg ??
                        sourceBrute.pointsAmenesRecAdversesNegatives ??
                        sourceBrute.ptsAmenesRecNeg ??
                        sourceBrute.recAdversesNegatives ??
                        sourceBrute.receptionsAdversesNegatives ??
                        sourceBrute.ptsAmenes ??
                        0
                    ),
                    ptsAmenesRecAdvNegTotal: Number(
                        sourceBrute.ptsAmenesRecAdvNegTotal ??
                        sourceBrute.ptsAmenesTotal ??
                        0
                    )
                }
            };
        }).filter(Boolean);
    }

    function moyParPartie(valeur, nbMatchs) {
        return nbMatchs > 0 ? String(Math.round(valeur / nbMatchs)) : "0";
    }

    function calculerToutesLesStatsJoueurs() {
        const listeJoueurs = window.tousLesJoueursFusionnes || [];
        if (!listeJoueurs.length) return;

        const listAvants = [];
        const listArrieres = [];

        listeJoueurs.forEach(joueur => {
            const joueurId = joueur.id || joueur.firebaseId || joueur.docId;
            const card = document.querySelector(`[data-id="${joueurId}"]`);
            if (!card) return;

            const posteLower = (joueur.poste || joueur.specialite || "").toLowerCase();
            const estAvant = posteLower.includes('avant');

            const matchsJoueur = obtenirMatchsEnrichisPourJoueur(joueurId, joueur);
            const nbMatchs = matchsJoueur.length;
            
            const nbVictoires = matchsJoueur.filter(m => m.resultat === 'V').length;
            const nbDefaites = matchsJoueur.filter(m => m.resultat === 'D').length;

            let totalPelotesJouees = 0, totalPelotesMax = 0;
            let totalPtsGagnes = 0, totalPtsGagnesMax = 0;
            let totalPtsPerdus = 0, totalPtsPerdusMax = 0;
            let totalButs = 0, butsArriere = 0, butsAvant = 0;
            let sumRecTot = 0, sumRecPos = 0, sumRecNeg = 0;
            let sumFrappesTot = 0, sumFrappesPos = 0, sumFrappesNeg = 0;
            let sumAttaquesTot = 0, sumAttaquesNeu = 0, sumAttaquesPos = 0, sumAttaquesNeg = 0;
            let sumClassiquesTot = 0, sumClassiquesNeu = 0, sumClassiquesPos = 0, sumClassiquesNeg = 0;
            let sumPtsAmenesRecAdvNeg = 0, sumPtsAmenesRecAdvNegTotal = 0;

            matchsJoueur.forEach(m => {
                const s = m.stats;
                totalPelotesJouees += s.pelotesJouees;
                totalPelotesMax += s.pelotesTotales;
                totalPtsGagnes += s.ptsGagnes;
                totalPtsGagnesMax += s.ptsGagnesTotaux;
                totalPtsPerdus += s.ptsPerdus;
                totalPtsPerdusMax += s.ptsPerdusTotaux;
                
                totalButs += s.butsTotal;
                butsArriere += s.butsSurArriere;
                butsAvant += s.butsSurAvant;

                sumRecTot += s.recTotal;
                sumRecPos += s.recPositif;
                sumRecNeg += s.recNegatif;

                sumFrappesTot += s.frappesTotal;
                sumFrappesPos += s.frappesPositif;
                sumFrappesNeg += s.frappesNegatif;

                sumAttaquesTot += s.attaquesTotal;
                sumAttaquesNeu += s.attaquesNeutre;
                sumAttaquesPos += s.attaquesPositif;
                sumAttaquesNeg += s.attaquesNegatif;

                sumClassiquesTot += s.classiquesTotal;
                sumClassiquesNeu += s.classiquesNeutre;
                sumClassiquesPos += s.classiquesPositif;
                sumClassiquesNeg += s.classiquesNegatif;

                sumPtsAmenesRecAdvNeg += s.ptsAmenesRecAdvNeg;
                sumPtsAmenesRecAdvNegTotal += s.ptsAmenesRecAdvNegTotal;
            });

            const pctPelotes = totalPelotesMax > 0 ? Math.round((totalPelotesJouees / totalPelotesMax) * 100) : 0;
            const pctGagnes = totalPtsGagnesMax > 0 ? Math.round((totalPtsGagnes / totalPtsGagnesMax) * 100) : 0;
            const pctPerdus = totalPtsPerdusMax > 0 ? Math.round((totalPtsPerdus / totalPtsPerdusMax) * 100) : 0;

            const butsTotCalcule = totalButs > 0 ? totalButs : (butsAvant + butsArriere);
            const pctArriere = butsTotCalcule > 0 ? Math.round((butsArriere / butsTotCalcule) * 100) : 0;
            const pctAvant = butsTotCalcule > 0 ? Math.round((butsAvant / butsTotCalcule) * 100) : 0;

            const pctRecPos = sumRecTot > 0 ? Math.round((sumRecPos / sumRecTot) * 100) : 0;
            const pctFrappesPos = sumFrappesTot > 0 ? Math.round((sumFrappesPos / sumFrappesTot) * 100) : 0;

            let noteBrute = nbMatchs > 0 ? Math.round((nbVictoires / nbMatchs) * 60 + pctGagnes * 0.4 + 15) : 0;
            const bonusArriere = !estAvant ? 8 : 0;
            let note100 = nbMatchs > 0 ? Math.min(100, Math.max(40, noteBrute + bonusArriere)) : 0;

            card.querySelector('.note-100').innerHTML = `${note100}<span>/100</span>`;
            card.querySelector('.nb-matchs').textContent = nbMatchs;
            card.querySelector('.nb-victoires').textContent = nbVictoires;
            card.querySelector('.nb-defaites').textContent = nbDefaites;

            card.querySelector('.pelotes-moy').textContent = moyParPartie(totalPelotesJouees, nbMatchs);
            card.querySelector('.pelotes-pct').textContent = `${pctPelotes}%`;

            card.querySelector('.gagnes-moy').textContent = moyParPartie(totalPtsGagnes, nbMatchs);
            card.querySelector('.gagnes-pct').textContent = `${pctGagnes}%`;

            card.querySelector('.perdus-moy').textContent = moyParPartie(totalPtsPerdus, nbMatchs);
            card.querySelector('.perdus-pct').textContent = `${pctPerdus}%`;

            card.querySelector('.buts-moy').textContent = moyParPartie(butsTotCalcule, nbMatchs);
            card.querySelector('.buts-av-moy').textContent = moyParPartie(butsAvant, nbMatchs);
            card.querySelector('.buts-av-pct').textContent = `(${pctAvant}%)`;
            card.querySelector('.buts-arr-moy').textContent = moyParPartie(butsArriere, nbMatchs);
            card.querySelector('.buts-arr-pct').textContent = `(${pctArriere}%)`;

            card.querySelector('.rec-moy').textContent = moyParPartie(sumRecTot, nbMatchs);
            card.querySelector('.rec-pos-moy').textContent = moyParPartie(sumRecPos, nbMatchs);
            card.querySelector('.rec-neg-moy').textContent = moyParPartie(sumRecNeg, nbMatchs);
            card.querySelector('.rec-pct').textContent = `${pctRecPos}%`;

            card.querySelector('.frappes-moy').textContent = moyParPartie(sumFrappesTot, nbMatchs);
            card.querySelector('.frappes-pos-moy').textContent = moyParPartie(sumFrappesPos, nbMatchs);
            card.querySelector('.frappes-neg-moy').textContent = moyParPartie(sumFrappesNeg, nbMatchs);
            card.querySelector('.frappes-pct').textContent = `${pctFrappesPos}%`;

            card.querySelector('.cla-moy').textContent = moyParPartie(sumClassiquesTot, nbMatchs);
            card.querySelector('.cla-neu-moy').textContent = moyParPartie(sumClassiquesNeu, nbMatchs);
            card.querySelector('.cla-pos-moy').textContent = moyParPartie(sumClassiquesPos, nbMatchs);
            card.querySelector('.cla-neg-moy').textContent = moyParPartie(sumClassiquesNeg, nbMatchs);

            card.querySelector('.att-moy').textContent = moyParPartie(sumAttaquesTot, nbMatchs);
            card.querySelector('.att-neu-moy').textContent = moyParPartie(sumAttaquesNeu, nbMatchs);
            card.querySelector('.att-pos-moy').textContent = moyParPartie(sumAttaquesPos, nbMatchs);
            card.querySelector('.att-neg-moy').textContent = moyParPartie(sumAttaquesNeg, nbMatchs);

            const denomAmenes = sumPtsAmenesRecAdvNegTotal > 0 ? sumPtsAmenesRecAdvNegTotal : totalPtsGagnes;
            const pctPtsAmenesRecAdvNeg = denomAmenes > 0 ? Math.round((sumPtsAmenesRecAdvNeg / denomAmenes) * 100) : 0;
            card.querySelector('.pts-amenes-rec-adv-neg-moy').textContent = moyParPartie(sumPtsAmenesRecAdvNeg, nbMatchs);
            card.querySelector('.pts-amenes-rec-adv-neg-pct').textContent = `${pctPtsAmenesRecAdvNeg}%`;

            if (estAvant) {
                listAvants.push({ card, note: note100 });
            } else {
                listArrieres.push({ card, note: note100 });
            }
        });

        listAvants.sort((a, b) => b.note - a.note);
        listArrieres.sort((a, b) => b.note - a.note);

        const gridAvants = document.getElementById('grid-avants');
        const gridArrieres = document.getElementById('grid-arrieres');

        if (gridAvants) {
            listAvants.forEach(item => gridAvants.appendChild(item.card));
        }
        if (gridArrieres) {
            listArrieres.forEach(item => gridArrieres.appendChild(item.card));
        }
    }

    function appliquerFiltreCartes(type) {
        window.filtreActif = type;
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        const activeBtn = document.getElementById(`btn-${type}`);
        if (activeBtn) activeBtn.classList.add('active');

        const sectionAvants = document.getElementById('section-avants');
        const sectionArrieres = document.getElementById('section-arrieres');
        const allCards = document.querySelectorAll('.player-card');

        if (sectionAvants) sectionAvants.style.display = (type === 'arrieres') ? 'none' : 'block';
        if (sectionArrieres) sectionArrieres.style.display = (type === 'avants') ? 'none' : 'block';

        allCards.forEach(card => {
            const estPole = card.getAttribute('data-est-pole') === 'true';
            if (type === 'pole') {
                card.style.display = estPole ? 'flex' : 'none';
            } else if (type === 'autres') {
                card.style.display = !estPole ? 'flex' : 'none';
            } else {
                card.style.display = 'flex';
            }
        });
    }

    window.filterPlayers = appliquerFiltreCartes;
</script>
