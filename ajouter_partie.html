<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pôle Performance - Ajouter une partie</title>

    <!-- Configuration PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f4c5c">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Pôle Performance">
    <link rel="apple-touch-icon" href="pole.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0a192f 0%, #0f4c5c 50%, #17b890 100%);
            --container-text: #f8fafc;
            --card-bg: linear-gradient(135deg, #0d1b2a 0%, #0f4c5c 100%);
            --card-border: #17b890;
            --card-hover-bg: linear-gradient(135deg, #132238 0%, #125c6e 100%);
            --accent-color: #00f2fe;
            --text-muted: #94a3b8;
            --btn-gradient: linear-gradient(135deg, #0f4c5c 0%, #125c6e 100%);
            --btn-hover-gradient: linear-gradient(135deg, #125c6e 0%, #17b890 100%);
            --input-bg: rgba(13, 27, 42, 0.6);
        }

        [data-theme="light"] {
            --bg-gradient: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
            --container-text: #0f172a;
            --card-bg: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
            --card-border: #cbd5e1;
            --card-hover-bg: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
            --accent-color: #0284c7;
            --text-muted: #64748b;
            --btn-gradient: linear-gradient(135deg, #ffffff 0%, #f1f5f9 100%);
            --btn-hover-gradient: linear-gradient(135deg, #e2e8f0 0%, #cbd5e1 100%);
            --input-bg: rgba(255, 255, 255, 0.9);
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            box-sizing: border-box;
        }

        body { 
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; 
            background: var(--bg-gradient); 
            background-attachment: fixed;
            color: var(--container-text); 
            padding: 10px; 
            display: flex; 
            justify-content: center; 
            min-height: 100vh;
            transition: background 0.3s, color 0.3s; 
        }

        .mobile-container { 
            max-width: 420px; 
            width: 100%; 
            box-sizing: border-box; 
            padding-bottom: 30px; 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
        } 
        
        .top-header { 
            display: grid; 
            grid-template-columns: auto 1fr auto; 
            align-items: center; 
            gap: 10px;
        }
        .logo-img { height: 45px; object-fit: contain; justify-self: start; }
        .header-actions { display: flex; gap: 8px; align-items: center; justify-self: end; }

        .home-btn, .theme-toggle-btn, .profile-btn { 
            background: var(--btn-gradient); 
            border: 1px solid var(--card-border); 
            width: 36px; 
            height: 36px; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer; 
            text-decoration: none; 
            color: var(--container-text); 
            font-size: 0.95rem; 
            transition: all 0.25s ease;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
        }
        .home-btn:hover, .theme-toggle-btn:hover, .profile-btn:hover { 
            border-color: var(--accent-color); 
            background: var(--btn-hover-gradient);
            transform: translateY(-2px);
        }

        .profile-img-avatar {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .separator { border: none; height: 1px; background-color: var(--card-border); margin: 2px 0; width: 100%; }

        .form-card {
            background: var(--card-bg);
            border: 2px solid #17b890;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 4px 12px rgba(23, 184, 144, 0.2);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .page-title {
            font-size: 1rem;
            color: var(--accent-color);
            font-weight: 700;
            margin: 0 0 4px 0;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, select, textarea {
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 10px 12px;
            color: var(--container-text);
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.9rem;
            width: 100%;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--accent-color);
        }

        .submit-btn {
            background: var(--btn-gradient);
            border: 2px solid var(--accent-color);
            border-radius: 12px;
            padding: 12px;
            color: var(--container-text);
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.25s ease;
            box-shadow: 0 4px 12px rgba(0, 242, 254, 0.2);
            margin-top: 6px;
        }

        .submit-btn:hover {
            background: var(--btn-hover-gradient);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0, 242, 254, 0.3);
        }
    </style>
</head>
<body>

<div class="mobile-container">
    <!-- En-tête -->
    <header class="top-header">
        <img src="logoce.png" alt="Logo Pôle Performance" class="logo-img">
        <div style="flex: 1;"></div>
        <div class="header-actions">
            <a href="accueil.html" class="home-btn" aria-label="Retour à l'accueil" title="Retour Accueil">🏠</a>
            <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()" aria-label="Changer le thème" title="Changer de thème">🌙</button>
            <a href="parametres.html" class="profile-btn" id="profileBtnContainer" aria-label="Mon compte" title="Mon Compte">
                <span id="profileIconDefault">👤</span>
            </a>
        </div>
    </header>

    <hr class="separator">

    <!-- Formulaire d'ajout de partie -->
    <main class="form-card">
        <h1 class="page-title">Ajouter une partie</h1>

        <form id="formAjoutPartie" onsubmit="enregistrerPartie(event)">
            <div class="form-group">
                <label for="datePartie">Date de la partie</label>
                <input type="datetime-local" id="datePartie" required>
            </div>

            <div class="form-group">
                <label for="competitionPartie">Compétition / Tournoi</label>
                <input type="text" id="competitionPartie" placeholder="Ex: Winter Series, Gant d'Or..." required>
            </div>

            <div class="form-group">
                <label for="lieuPartie">Lieu / Fronton</label>
                <input type="text" id="lieuPartie" value="Fronton Jai Alai, Saint-Jean-de-Luz" required>
            </div>

            <div class="form-group">
                <label for="equipe1">Équipe A (Joueurs)</label>
                <input type="text" id="equipe1" placeholder="Ex: Laduche / Lopez" required>
            </div>

            <div class="form-group">
                <label for="equipe2">Équipe B (Joueurs)</label>
                <input type="text" id="equipe2" placeholder="Ex: Garat / Laborde" required>
            </div>

            <div class="form-group">
                <label for="commentairePartie">Commentaires / Observations</label>
                <textarea id="commentairePartie" rows="3" placeholder="Détails optionnels..."></textarea>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">Enregistrer et notifier</button>
        </form>
    </main>
</div>

<!-- Fichiers de données locales -->
<script src="joueurs-data.js"></script>
<script src="staffe-data.js"></script>

<!-- Firebase SDK Compat -->
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-messaging-compat.js"></script>

<script>
    // Configuration Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyBTujsGZneEGx1_V27zgRNf9-qM9zFFHQA",
        authDomain: "ppcestapunta64500.firebaseapp.com",
        projectId: "ppcestapunta64500",
        storageBucket: "ppcestapunta64500.firebasestorage.app",
        messagingSenderId: "80945272911",
        appId: "1:80945272911:web:154437e054b190e7ebb23a",
        measurementId: "G-SCYGWMW7VF"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    // Gestion du thème clair / sombre
    const htmlElement = document.documentElement;
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    const savedTheme = localStorage.getItem('cesta_theme');
    if (savedTheme) {
        htmlElement.setAttribute('data-theme', savedTheme);
        updateButtonIcon(savedTheme);
    }

    function toggleTheme() {
        const currentTheme = htmlElement.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        htmlElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('cesta_theme', newTheme);
        updateButtonIcon(newTheme);
    }

    function updateButtonIcon(theme) {
        themeToggleBtn.innerHTML = theme === 'light' ? '☀️' : '🌙';
    }

    // Chargement de l'avatar du profil
    function chargerPhotoProfilLocale() {
        const profileBtnContainer = document.getElementById('profileBtnContainer');
        const userEmail = localStorage.getItem('cesta_user_email');
        if (!userEmail) return;

        let avatarUrl = null;
        if (typeof joueursData !== 'undefined') {
            const j = joueursData.find(item => item.email && item.email.toLowerCase() === userEmail.toLowerCase());
            if (j && j.photo) avatarUrl = j.photo;
        }
        if (!avatarUrl && typeof staffData !== 'undefined') {
            const s = staffData.find(item => item.email && item.email.toLowerCase() === userEmail.toLowerCase());
            if (s && s.photo) avatarUrl = s.photo;
        }
        if (avatarUrl) {
            profileBtnContainer.innerHTML = `<img src="${avatarUrl}" alt="Profil" class="profile-img-avatar">`;
        }
    }

    // Contrôle d'accès admin et initialisation de la page
    document.addEventListener("DOMContentLoaded", () => {
        const userRole = localStorage.getItem('cesta_user_role');
        if (userRole !== 'admin') {
            alert("Accès réservé aux administrateurs.");
            window.location.href = 'accueil.html';
            return;
        }
        chargerPhotoProfilLocale();
    });

    // Enregistrement de la partie et déclenchement des notifications
    async function enregistrerPartie(event) {
        event.preventDefault();
        
        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.textContent = "Enregistrement en cours...";

        const dateVal = document.getElementById('datePartie').value;
        const competitionVal = document.getElementById('competitionPartie').value;
        const lieuVal = document.getElementById('lieuPartie').value;
        const equipe1Val = document.getElementById('equipe1').value;
        const equipe2Val = document.getElementById('equipe2').value;
        const commentaireVal = document.getElementById('commentairePartie').value;
        const currentUserUid = localStorage.getItem('cesta_user_uid');

        try {
            // 1. Enregistrement dans Firestore[cite: 5]
            await db.collection("matches").add({
                date: dateVal,
                competition: competitionVal,
                lieu: lieuVal,
                equipe1: equipe1Val,
                equipe2: equipe2Val,
                commentaire: commentaireVal,
                createdBy: currentUserUid,
                createdAt: new Date().toISOString()
            });

            // 2. Récupération des tokens FCM de tous les utilisateurs (y compris l'auteur) pour l'envoi push
            const usersSnapshot = await db.collection("users").get();
            let tokens = [];

            usersSnapshot.forEach((doc) => {
                const data = doc.data();
                if (data.fcmToken) {
                    tokens.push(data.fcmToken);
                }
            });

            // 3. Déclenchement de l'API FCM pour envoyer les notifications et activer le badge rouge
            const titreNotif = "🎯 Nouvelle partie enregistrée";
            const corpsNotif = `${competitionVal} : ${equipe1Val} vs ${equipe2Val}`;

            for (const token of tokens) {
                fetch('https://fcm.googleapis.com/fcm/send', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'key=BNKyUB9icw5qaIypqEMcrJ4ME_zk5tkFaLZnPZO97Y-H7rx7qBzpKNyeSJYuvLJRBk-FetO3bvsV3qVeWl9SuqY'
                    },
                    body: JSON.stringify({
                        to: token,
                        notification: {
                            title: titreNotif,
                            body: corpsNotif,
                            icon: '/PPCPLUZ/pole.png',
                            badge: '/PPCPLUZ/pole.png'
                        },
                        data: {
                            url: '/PPCPLUZ/match.html'
                        }
                    })
                }).catch(err => console.log("Erreur push individuelle :", err));
            }

            alert("Partie enregistrée avec succès et notifications envoyées !");
            window.location.href = 'match.html';

        } catch (error) {
            console.error("Erreur lors de l'enregistrement :", error);
            alert("Erreur lors de l'enregistrement de la partie.");
            submitBtn.disabled = false;
            submitBtn.textContent = "Enregistrer et notifier";
        }
    }
</script>

</body>
</html>
