<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pôle Performance - Accueil</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f4c5c">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Pôle Performance">
    <link rel="apple-touch-icon" href="pole.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0a192f 0%, #0f4c5c 50%, #17b890 100%);
            --container-text: #f8fafc;
            --card-bg: linear-gradient(135deg, #0d1b2a 0%, #0f4c5c 100%);
            --card-border: #17b890;
            --card-hover-bg: linear-gradient(135deg, #132238 0%, #125c6e 100%);
            --accent-color: #00f2fe;
            --text-muted: #94a3b8;
            --btn-gradient: linear-gradient(135deg, #0f4c5c 0%, #125c6e 100%);
            --btn-hover-gradient: linear-gradient(135deg, #125c6e 0%, #17b890 100%);
        }

        [data-theme="light"] {
            --bg-gradient: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
            --container-text: #0f172a;
            --card-bg: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
            --card-border: #cbd5e1;
            --card-hover-bg: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
            --accent-color: #0284c7;
            --text-muted: #64748b;
            --btn-gradient: linear-gradient(135deg, #ffffff 0%, #f1f5f9 100%);
            --btn-hover-gradient: linear-gradient(135deg, #e2e8f0 0%, #cbd5e1 100%);
        }

        html, body { margin: 0; padding: 0; width: 100%; box-sizing: border-box; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg-gradient); background-attachment: fixed; color: var(--container-text); padding: 10px; display: flex; justify-content: center; min-height: 100vh; }
        .mobile-container { max-width: 420px; width: 100%; box-sizing: border-box; padding-bottom: 20px; display: flex; flex-direction: column; gap: 10px; } 
        .top-header { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; }
        .logo-img { height: 50px; object-fit: contain; justify-self: start; }
        .header-actions { display: flex; gap: 8px; align-items: center; justify-self: end; }
        .home-btn, .theme-toggle-btn, .profile-btn, .notif-trigger-btn { background: var(--btn-gradient); border: 1px solid var(--card-border); width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; text-decoration: none; color: var(--container-text); font-size: 0.95rem; box-shadow: 0 2px 6px rgba(0,0,0,0.15); }
        .profile-img-avatar { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
        .separator { border: none; height: 1px; background-color: var(--card-border); margin: 2px 0; width: 100%; }
        .full-width-block { width: 100%; box-sizing: border-box; background: var(--card-bg); border: 2px solid #17b890; border-radius: 16px; box-shadow: 0 4px 12px rgba(23, 184, 144, 0.2); }
        .header-banner-card { padding: 10px 14px; }
        .section-title { font-size: 0.9rem; color: var(--accent-color); font-weight: 700; margin: 0; }
        .hero-banner img { width: 100%; display: block; object-fit: contain; }
        .top-widgets-grid { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; width: 100%; }
        .mini-chat-card, .mini-event-card { padding: 10px; text-decoration: none; color: var(--container-text); display: flex; flex-direction: column; justify-content: center; position: relative; }
        .admin-actions-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; width: 100%; }
        .admin-action-card { background: var(--card-bg); border: 2px solid #17b890; border-radius: 16px; padding: 12px 10px; text-decoration: none; color: var(--container-text); display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; }
        .menu-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .menu-card { background: var(--card-bg); border: 2px solid #17b890; border-radius: 16px; padding: 16px 10px; text-decoration: none; color: var(--container-text); display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; position: relative; }
        .menu-card.active-primary { background: linear-gradient(135deg, #0f4c5c 0%, #17b890 100%); border: 2px solid #00f2fe; color: #ffffff; }
        .notification-badge { position: absolute; top: -6px; right: -8px; background-color: #ef4444; color: white; font-size: 0.6rem; font-weight: 700; padding: 1px 5px; border-radius: 10px; border: 2px solid #0d1b2a; display: none; z-index: 5; }
        .notification-badge.active { display: block; }
    </style>
</head>
<body>

<div class="mobile-container">
    <header class="top-header">
        <img src="logoce.png" alt="Logo" class="logo-img">
        <div id="notifButtonContainer">
            <button class="notif-trigger-btn" onclick="demanderPermissionNotification()" title="Activer les notifications">🔔</button>
        </div>
        <div class="header-actions">
            <a href="accueil.html" class="home-btn">🏠</a>
            <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()">🌙</button>
            <a href="parametres.html" class="profile-btn" id="profileBtnContainer"><span>👤</span></a>
        </div>
    </header>

    <hr class="separator">
    <div id="birthdayAlertContainer"></div>

    <section class="header-banner-card full-width-block">
        <h1 class="section-title">Pôle performance de cesta punta, Saint-Jean-de-Luz</h1>
    </section>

    <div class="hero-banner full-width-block">
        <img src="titre.png" alt="Illustration">
    </div>

    <div class="top-widgets-grid">
        <a href="echanges.html" class="mini-chat-card full-width-block">
            <div style="font-size: 1.3rem; position: relative; text-align: center;">💬<span class="notification-badge" id="badgeEchanges">0</span></div>
            <div style="font-size: 0.68rem; text-transform: uppercase; color: var(--accent-color); font-weight: 700; text-align: center;">Échanges</div>
        </a>
        <a href="entrainements.html" class="mini-event-card full-width-block">
            <div style="font-size: 0.68rem; text-transform: uppercase; color: var(--accent-color); font-weight: 700;">Prochain entraînement</div>
            <div style="font-size: 0.75rem; font-weight: 600;" id="nextTrainingDetails">Chargement...</div>
        </a>
    </div>

    <nav class="admin-actions-grid admin-only" style="display: none;">
        <a href="ajouter_partie.html" class="admin-action-card">➕ Ajouter une partie</a>
        <a href="ajouter_joueur.html" class="admin-action-card">👤 Ajouter un joueur</a>
    </nav>

    <nav class="menu-grid">
        <a href="entrainements.html" class="menu-card active-primary">
            <div style="position: relative;">🏋️<span class="notification-badge" id="badgeEntrainements">0</span></div>
            <div style="font-weight: bold; font-size: 0.85rem;">Entraînements</div>
        </a>
        <a href="joueurs.html" class="menu-card">👥<div style="font-weight: bold; font-size: 0.85rem;">Joueurs</div></a>
        <a href="match.html" class="menu-card">
            <div style="position: relative;">🎯<span class="notification-badge" id="badgeParties">0</span></div>
            <div style="font-weight: bold; font-size: 0.85rem;">Parties</div>
        </a>
        <a href="entraineurs.html" class="menu-card">👨‍🏫<div style="font-weight: bold; font-size: 0.85rem;">Entraîneurs</div></a>
        <a href="comparaison.html" class="menu-card">🏆<div style="font-weight: bold; font-size: 0.85rem;">Classement</div></a>
        <a href="staff.html" class="menu-card">📞✉️<div style="font-weight: bold; font-size: 0.85rem;">Staff / Joueurs</div></a>
    </nav>
</div>

<script src="joueurs-data.js"></script>
<script src="staffe-data.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-messaging-compat.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBTujsGZneEGx1_V27zgRNf9-qM9zFFHQA",
        authDomain: "ppcestapunta64500.firebaseapp.com",
        projectId: "ppcestapunta64500",
        storageBucket: "ppcestapunta64500.firebasestorage.app",
        messagingSenderId: "80945272911",
        appId: "1:80945272911:web:154437e054b190e7ebb23a",
        measurementId: "G-SCYGWMW7VF"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    // Synchronisation FCM sécurisée et indépendante des badges
    async function synchroniserJetonFCM(silencieux = false) {
        if (!('Notification' in window) || !('serviceWorker' in navigator)) return;

        try {
            const swRegistration = await navigator.serviceWorker.register('./firebase-messaging-sw.js');
            await navigator.serviceWorker.ready;

            const messaging = firebase.messaging();

            messaging.onMessage((payload) => {
                const data = payload.notification || payload.data || {};
                swRegistration.showNotification(data.title || data.titre || "Pôle Performance", {
                    body: data.body || data.corps || "Nouvelle notification",
                    icon: 'pole.png'
                });
            });
            
            const currentToken = await messaging.getToken({
                vapidKey: 'BNKyUB9icw5qaIypqEMcrJ4ME_zk5tkFaLZnPZO97Y-H7rx7qBzpKNyeSJYuvLJRBk-FetO3bvsV3qVeWl9SuqY',
                serviceWorkerRegistration: swRegistration
            });

            if (currentToken) {
                const userObj = firebase.auth().currentUser;
                const userUid = userObj ? userObj.uid : (localStorage.getItem('cesta_user_uid') || localStorage.getItem('cesta_user_id'));

                if (userUid) {
                    await db.collection("users").doc(userUid).set({
                        fcmToken: currentToken,
                        email: localStorage.getItem('cesta_user_email') || "",
                        lastNotificationUpdate: new Date().toISOString()
                    }, { merge: true });

                    const notifContainer = document.getElementById('notifButtonContainer');
                    if (notifContainer) notifContainer.style.display = 'none';

                    if (!silencieux) alert('Notifications activées avec succès !');
                }
            }
        } catch (err) {
            console.error('Erreur FCM :', err);
        }
    }

    async function demanderPermissionNotification() {
        if (await Notification.requestPermission() === 'granted') {
            await synchroniserJetonFCM(false);
        } else {
            alert("Permission refusée.");
        }
    }

    // Gestion du thème
    const htmlElement = document.documentElement;
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    const savedTheme = localStorage.getItem('cesta_theme') || 'dark';
    htmlElement.setAttribute('data-theme', savedTheme);
    themeToggleBtn.innerHTML = savedTheme === 'light' ? '☀️' : '🌙';

    function toggleTheme() {
        const newTheme = htmlElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        htmlElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('cesta_theme', newTheme);
        themeToggleBtn.innerHTML = newTheme === 'light' ? '☀️' : '🌙';
    }

    document.addEventListener("DOMContentLoaded", () => {
        if ("Notification" in window && Notification.permission === "granted") {
            synchroniserJetonFCM(true);
        }

        if (localStorage.getItem('cesta_user_role') === 'admin') {
            document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'grid');
        }

        initialiserBadgesTempsReel();
    });

    // Badges en temps réel isolés
    function initialiserBadgesTempsReel() {
        const currentUser = localStorage.getItem('cesta_user_email') || "";

        try {
            db.collection("echanges_messages").orderBy("timestamp", "desc").onSnapshot((snapshot) => {
                let nonLus = 0;
                const dernierVisite = Number(localStorage.getItem('dernier_clic_echanges') || 0);
                snapshot.forEach(doc => {
                    const data = doc.data();
                    if (data.timestamp && new Date(data.timestamp).getTime() > dernierVisite && data.author !== currentUser) {
                        nonLus++;
                    }
                });
                const badge = document.getElementById('badgeEchanges');
                if (badge) badge.className = nonLus > 0 ? 'notification-badge active' : 'notification-badge';
                if (badge) badge.textContent = nonLus;
            });
        } catch(e) {}

        try {
            db.collection("entrainements").onSnapshot((snapshot) => {
                const maintenant = new Date();
                let countFuturs = 0;
                snapshot.forEach(doc => {
                    const data = doc.data();
                    if (new Date(data.dateIso || data.date || data.start) >= maintenant) countFuturs++;
                });
                const badge = document.getElementById('badgeEntrainements');
                if (badge) badge.className = countFuturs > 0 ? 'notification-badge active' : 'notification-badge';
                if (badge) badge.textContent = countFuturs;
            });
        } catch(e) {}

        try {
            db.collection("matchs").onSnapshot((snapshot) => {
                const dernierVisiteMatchs = Number(localStorage.getItem('dernier_clic_matchs') || 0);
                let nouveauxMatchs = 0;
                snapshot.forEach(doc => {
                    const data = doc.data();
                    if (data.createdAt && new Type(data.createdAt).getTime() > dernierVisiteMatchs) nouveauxMatchs++;
                });
                const badge = document.getElementById('badgeParties');
                if (badge) badge.className = nouveauxMatchs > 0 ? 'notification-badge active' : 'notification-badge';
                if (badge) badge.textContent = nouveauxMatchs;
            });
        } catch(e) {}
    }
</script>

</body>
</html>
