<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>

    <style>

        .back-photo { 
            width: 65px; 
            height: 65px; 
            border-radius: 50%; 
            object-fit: cover; 
            object-position: center; 
            border: 2px solid var(--accent-color); 
            background: rgba(0,0,0,0.2); 
            cursor: pointer; 
            transition: transform 0.2s, box-shadow 0.2s;

        }

        .subtab-content { display: none; }
        .subtab-content.active { display: block; }

            width: 100%;
            background: var(--card-bg);
            border: 2px solid var(--card-border);
            color: var(--container-text);
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 0.8rem;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        .match-search-input:focus { border-color: var(--accent-color); }

        .match-select-container { margin-bottom: 12px; }
        .match-select { 
            width: 100%; 
            background: var(--card-bg); 
            border: 2px solid var(--card-border); 
            color: var(--container-text); 
            padding: 10px 12px; 
            border-radius: 10px; 
            font-size: 0.8rem; 
            font-weight: 600; 
            outline: none; 
            cursor: pointer; 
            appearance: auto;
        }
        .match-select option { 
            background: #111827; 
            color: #ffffff; 
            padding: 10px;
            white-space: normal;
        }

        .full-match-title-box {
            background: var(--card-bg);
            border: 1px solid var(--accent-color);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 8px;
            font-size: 0.85rem;
            font-weight: bold;
            color: var(--accent-color);
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .match-actions-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }
        .btn-action-edit, .btn-action-delete {
            flex: 1;
            padding: 8px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: opacity 0.2s;
        }
        .btn-action-edit { background-color: #f59e0b; color: #fff; }
        .btn-action-delete { background-color: #ef4444; color: #fff; }
        .btn-action-edit:hover, .btn-action-delete:hover { opacity: 0.9; }

        .edit-form-card {
            background: var(--card-bg);
            border: 2px solid var(--accent-color);
            border-radius: 12px;

            margin-bottom: 12px;

        .edit-form-card label { display: block; font-size: 0.72rem; color: var(--text-muted); margin-bottom: 3px; }
        .edit-form-card input {
            width: 100%;
            background: var(--card-hover-bg);
            border: 1px solid var(--card-border);
            color: var(--container-text);
            padding: 7px 10px;
            border-radius: 6px;
            font-size: 0.8rem;

        .btn-cancel { background: #6b7280; color: white; border: none; padding: 10px; border-radius: 6px; font-size: 0.8rem; font-weight: 600; cursor: pointer; }

        .card-item { background: var(--card-bg); border: 2px solid var(--card-border); border-radius: 16px; padding: 14px; margin-bottom: 10px; box-shadow: 0 4px 12px rgba(23, 184, 144, 0.2); transition: all 0.25s ease; }

        .item-title { font-weight: bold; font-size: 0.85rem; color: var(--container-text); margin-bottom: 6px; }

        authDomain: "ppcestapunta64500.firebaseapp.com",
        projectId: "ppcestapunta64500",
        storageBucket: "ppcestapunta64500.firebasestorage.app",
        messagingSenderId: "80945272911",
        appId: "1:80945272911:web:154437e054b190e7ebb23a",
        measurementId: "G-SCYGWMW7VF"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.db = db;
    window.matchsCloudCharges = [];

    const urlParams = new URLSearchParams(window.location.search);
    const playerId = urlParams.get('id') || "basque";

    window.joueurActuel = { id: playerId, prenom: "Thibault", nom: "BASQUE", photo: "basque.png" };

    async function initialiserDonneesEtApp() {
        try {
            const joueurDocRef = doc(db, "joueurs", playerId);
            const joueurSnap = await getDoc(joueurDocRef);
            if (joueurSnap.exists()) {
                window.joueurActuel = { id: joueurSnap.id, ...joueurSnap.data() };
            } else if (typeof joueursData !== 'undefined') {
                const jLocal = joueursData.find(j => j.id === playerId);
                if (jLocal) window.joueurActuel = jLocal;
            }

            document.getElementById('backPlayerNav').innerHTML = `
                <a href="joueur.html?id=${playerId}" title="Retour au profil">
                    <img src="${window.joueurActuel.photo}" alt="Profil" class="back-photo" onerror="this.src='logoce.png'">
                </a>
            `;

            const querySnapshot = await getDocs(collection(db, "matchs"));
            querySnapshot.forEach((docSnap) => {
                const data = docSnap.data();
                window.matchsCloudCharges.push({
                    id: docSnap.id,
                    isCloud: true,
                    competition: data.competition || data.titre || "Match Cloud",
                    date: data.date || "",
                    lieu: data.lieu || "",
                    equipe1: data.equipe1 || "",
                    equipe2: data.equipe2 || "",
                    scoreEquipe1: data.scoreEquipe1 !== undefined ? data.scoreEquipe1 : data.equipe1Score,
                    scoreEquipe2: data.scoreEquipe2 !== undefined ? data.scoreEquipe2 : data.equipe2Score,
                    joueurId: data.joueurId || null,
                    statsParJoueur: data.statsParJoueur || null,
                    stats: data.stats || data
                });
            });
        } catch (error) {
            console.error("Erreur lors de la récupération des données sur Firebase :", error);
        }

        if (typeof window.initialiserPageStats === 'function') {
            window.initialiserPageStats();
        }
    }

    initialiserDonneesEtApp();

    window.supprimerPartieActive = async function() {
        const role = localStorage.getItem('cesta_user_role');
        if (role !== 'admin') {
            alert("Accès refusé. Seul l'administrateur peut supprimer une partie.");
            return;
        }

        const selectElement = document.getElementById('matchSelect');
        const idUnique = selectElement ? selectElement.value : null;
        if (!idUnique) return;

        const matchsEnrichis = window.obtenirMatchsEnrichis();
        const match = matchsEnrichis.find(m => m.idUnique == idUnique);

        if (!match || !match.isCloud) {
            alert("Cette partie ne peut pas être supprimée.");
            return;
        }

        if (confirm(`Voulez-vous vraiment supprimer la partie "${match.competition} : ${match.equipe1} vs ${match.equipe2}" ?`)) {
            try {
                await deleteDoc(doc(db, "matchs", match.id));
                alert("Partie supprimée avec succès !");
                window.matchsCloudCharges = window.matchsCloudCharges.filter(m => m.id !== match.id);
                window.initialiserPageStats();
            } catch (error) {
                console.error("Erreur lors de la suppression sur Firestore :", error);
                alert("Erreur lors de la suppression.");
            }
        }
    };

            ptsPerdusTotaux: Number(document.getElementById('editPtsPerdusTotaux').value || 50),
            receptionsCoupDroitPct: Number(document.getElementById('editReceptionsCoupDroitPct').value || 50),
            
            butsTotal: Number(document.getElementById('editButsTotal').value || 0),
            butsSurArriere: Number(document.getElementById('editButsSurArriere').value || 0),
            butsSurAvant: Number(document.getElementById('editButsSurAvant').value || 0),
            butsAce: Number(document.getElementById('editButsAce').value || 0),
            butsPasa: Number(document.getElementById('editButsPasa').value || 0),

            aireNegatif: Number(document.getElementById('editAireNeg').value || 0),
            
            boteTotal: Number(document.getElementById('editBoteTotal').value || 0),
            botePositif: Number(document.getElementById('editBotePos').value || 0),
            boteNegatif: Number(document.getElementById('editBoteNeg').value || 0),
            
            boteCorridoTotal: Number(document.getElementById('editBoteCorridoTotal').value || 0),

</script>

<script>
    function determinerVainqueur(s1, s2) {
        if (s1 === undefined || s2 === undefined) return 0;
        let str1 = String(s1).trim();
        let str2 = String(s2).trim();

        let sets1 = str1.split(/[\/\s-]+/).map(Number).filter(n => !isNaN(n));
        let sets2 = str2.split(/[\/\s-]+/).map(Number).filter(n => !isNaN(n));

        if (sets1.length > 0 && sets2.length > 0) {
            let wins1 = 0;
            let wins2 = 0;
            for (let i = 0; i < Math.min(sets1.length, sets2.length); i++) {
                if (sets1[i] > sets2[i]) wins1++;
                else if (sets2[i] > sets1[i]) wins2++;
            }
            if (wins1 > wins2) return 1;
            if (wins2 > wins1) return 2;

            let sum1 = sets1.reduce((a, b) => a + b, 0);
            let sum2 = sets2.reduce((a, b) => a + b, 0);
            if (sum1 > sum2) return 1;
            if (sum2 > sum1) return 2;
        }

        let num1 = parseFloat(str1);
        let num2 = parseFloat(str2);
        if (!isNaN(num1) && !isNaN(num2)) {
            if (num1 > num2) return 1;
            if (num2 > num1) return 2;
        }

        return 0;
    }

    window.obtenirMatchsEnrichis = function() {
        const listeMatchs = window.matchsCloudCharges || [];
        const joueur = window.joueurActuel || {};
        const currentIdStr = String(window.currentJoueurId || "").trim().toLowerCase();

        return listeMatchs.map((match, index) => {
            let sourceBrute = {};
            
            if (match.statsParJoueur) {
                const nomJoueur = (joueur.nom || "").trim().toLowerCase();
                const prenomJoueur = (joueur.prenom || "").trim().toLowerCase();

                let foundKey = Object.keys(match.statsParJoueur).find(k => {
                    const keyLower = String(k).trim().toLowerCase();
                    return keyLower === currentIdStr || keyLower === nomJoueur || keyLower === prenomJoueur;
                });

                if (foundKey) {
                    sourceBrute = match.statsParJoueur[foundKey];
                }
            }
            
            if (!Object.keys(sourceBrute).length) {
                sourceBrute = { ...(match.stats || {}), ...match };
            }

            return {
                ...match,
                scoreEquipe1: match.scoreEquipe1 !== undefined ? match.scoreEquipe1 : match.equipe1Score,
                scoreEquipe2: match.scoreEquipe2 !== undefined ? match.scoreEquipe2 : match.equipe2Score,
                idUnique: match.id || ('cloud_' + index),
                stats: {
                    pelotesJouees: Number(sourceBrute.pelotesJouees || sourceBrute.pelotes || 0),
                    pelotesTotales: Number(sourceBrute.pelotesTotales || 100),
                    ptsGagnes: Number(sourceBrute.ptsGagnes || sourceBrute.pointsGagnes || 0),
                    ptsGagnesTotaux: Number(sourceBrute.ptsGagnesTotaux || 50),
                    ptsPerdus: Number(sourceBrute.ptsPerdus || sourceBrute.pointsPerdus || 0),
                    ptsPerdusTotaux: Number(sourceBrute.ptsPerdusTotaux || 50),

    function estMatchDuJoueur(m) {
        const currentIdStr = String(window.currentJoueurId || "").trim().toLowerCase();
        const joueur = window.joueurActuel || {};
        
        if (m.statsParJoueur) {
            for (let key in m.statsParJoueur) {
                if (String(key).trim().toLowerCase() === currentIdStr) {
                    return true;
                }
            }
        }
        
        if (m.joueurId !== undefined && m.joueurId !== null) {
            if (String(m.joueurId).trim().toLowerCase() === currentIdStr) return true;
        }

        const nomRecherche = (joueur.nom || "").toLowerCase().trim(); 
        const prenomRecherche = (joueur.prenom || "").toLowerCase().trim();
        const e1 = (m.equipe1 || "").toLowerCase();
        const e2 = (m.equipe2 || "").toLowerCase();
        
        return (nomRecherche && (e1.includes(nomRecherche) || e2.includes(nomRecherche))) ||
               (prenomRecherche && (e1.includes(prenomRecherche) || e2.includes(prenomRecherche)));
    }

    function getEquipeJoueur(m) {
        const joueur = window.joueurActuel || {};
        const nomRecherche = (joueur.nom || "").toLowerCase().trim();
        const prenomRecherche = (joueur.prenom || "").toLowerCase().trim();
        const e1 = (m.equipe1 || "").toLowerCase();
        const e2 = (m.equipe2 || "").toLowerCase();

        const dansE1 = (nomRecherche && e1.includes(nomRecherche)) || (prenomRecherche && e1.includes(prenomRecherche));
        const dansE2 = (nomRecherche && e2.includes(nomRecherche)) || (prenomRecherche && e2.includes(prenomRecherche));

    function formaterDateFR(dateStr) {
        if (!dateStr) return '';
        if (typeof dateStr === 'string' && dateStr.includes('/')) {
            const parts = dateStr.split('/');
            if (parts.length === 3 && parts[2].length === 4) {
                const moisFR = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
                const mIndex = parseInt(parts[1], 10) - 1;
                if (mIndex >= 0 && mIndex < 12) {
                    return `${parseInt(parts[0], 10)} ${moisFR[mIndex]} ${parts[2]}`;
                }
            }
        }
        return dateStr;
    }

    function calcPct(valeur, total) {
        if (!total || total === 0) return '0%';
        return Math.round((valeur / total) * 100) + '%';
    }

    function genererLigneTableau(nom, total, grandTotal, pos, neg) {
        const pctCat = calcPct(total, grandTotal);
        const pctPos = calcPct(pos, total);
        const pctNeg = calcPct(neg, total);
        return `
            <tr>
                <td><strong>${nom}</strong></td>
                <td>${total}</td>
                <td>${pctCat}</td>
                <td style="color:#10B981;">${pos} (${pctPos})</td>
                <td style="color:#EF4444;">${neg} (${pctNeg})</td>
            </tr>
        `;
    }

    window.filtrerMatchsParRecherche = function() {
        const queryInput = document.getElementById('matchSearchInput');
        const query = queryInput ? queryInput.value.toLowerCase().trim() : "";
        const selectElement = document.getElementById('matchSelect');
        selectElement.innerHTML = "";

        const matchsEnrichis = window.obtenirMatchsEnrichis();
        
        const matchsDuJoueur = matchsEnrichis.filter(m => estMatchDuJoueur(m));

        const matchsFiltres = matchsDuJoueur.filter(match => {
            if (!query) return true;
            const comp = (match.competition || "").toLowerCase();
            const equipe1 = (match.equipe1 || "").toLowerCase();
            const equipe2 = (match.equipe2 || "").toLowerCase();
            const lieu = (match.lieu || "").toLowerCase();
            const dateStr = (match.date || "").toLowerCase();
            return comp.includes(query) || equipe1.includes(query) || equipe2.includes(query) || lieu.includes(query) || dateStr.includes(query);
        });

        if (matchsFiltres.length === 0) {
            selectElement.innerHTML = `<option value="">Aucune partie trouvée pour ce joueur</option>`;
            document.getElementById('fullMatchTitleDisplay').textContent = "Aucune partie disponible";
            const actionsBar = document.getElementById('matchActionsBar');
            if (actionsBar) actionsBar.style.display = 'none';
            document.getElementById('statsParPartieContenu').innerHTML = `<div class="card-item"><div class="item-sub">Aucune donnée disponible pour ce joueur.</div></div>`;
            return;
        }

        matchsFiltres.forEach(match => {
            const option = document.createElement('option');
            option.value = match.idUnique;
            
            const dateFormatted = formaterDateFR(match.date);
            const libelleEquipes = (match.equipe1 && match.equipe2) ? `${match.equipe1} vs ${match.equipe2}` : (match.titre || 'Partie');
            const e1Score = match.scoreEquipe1;
            const e2Score = match.scoreEquipe2;
            
            let indicateur = '';
            const vainqueur = determinerVainqueur(e1Score, e2Score);
            const equipeJoueur = getEquipeJoueur(match);

            if (vainqueur !== 0) {
                if (vainqueur === equipeJoueur) indicateur = ' 🟢 (Victoire)';
                else indicateur = ' 🔴 (Défaite)';
            } else {
                indicateur = ' ⚪ (Nul)';
            }
            
            const scoreStr = (e1Score !== undefined && e2Score !== undefined) ? ` [${e1Score} - ${e2Score}]${indicateur}` : '';
            
            option.textContent = `${match.competition || 'Match'} : ${libelleEquipes} (${dateFormatted})${scoreStr}`;
            selectElement.appendChild(option);
        });

        afficherStatsPartie(matchsFiltres[0].idUnique);
    };

            <div class="card-item">
                <div class="item-title">📊 Répartition moyenne des échanges</div>
                <div class="side-bar-container">
                    <div class="side-labels">
                        <span style="color: var(--accent-color, #17b890);">🟢 Coup Droit : ${pctCD}%</span>
                        <span style="color: #3b82f6;">🔵 Revers : ${pctRev}%</span>
                    </div>
                    <div class="side-bar-track">
                        <div class="side-bar-forehand" style="width: ${pctCD}%;"></div>
                        <div class="side-bar-backhand" style="width: ${pctRev}%;"></div>
                    </div>
                </div>
            </div>

            <div class="card-item">
                <div class="item-title">📥 Réceptions Totales</div>
                <table class="stat-table">
                    <thead>
                        <tr>
                            <th>Type</th>
                            <th>Tot</th>
                            <th>%</th>
                            <th>Pos</th>
                            <th>Neg</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${genererLigneTableau('Aire', st.aireTotal || 0, totalReceptionsGlobal, st.airePositif || 0, st.aireNegatif || 0)}
                        ${genererLigneTableau('Bote', st.boteTotal || 0, totalReceptionsGlobal, st.botePositif || 0, st.boteNegatif || 0)}
                        ${genererLigneTableau('Bote corrido', st.boteCorridoTotal || 0, totalReceptionsGlobal, st.boteCorridoPositif || 0, st.boteCorridoNegatif || 0)}
                        ${genererLigneTableau('Bote pronto', st.boteProntoTotal || 0, totalReceptionsGlobal, st.boteProntoPositif || 0, st.boteProntoNegatif || 0)}
                        ${genererLigneTableau('Erebote', st.ereboteTotal || 0, totalReceptionsGlobal, st.erebotePositif || 0, st.ereboteNegatif || 0)}
                        ${genererLigneTableau('Pumpa', st.pumpa || 0, totalReceptionsGlobal, st.pumpaPositif || 0, st.pumpaNegatif || 0)}
                    </tbody>
                </table>
            </div>

            <div class="card-item">
                <div class="item-title">⚡ Frappes Totales</div>
                <table class="stat-table">
                    <thead>
                        <tr>
                            <th>Type</th>
                            <th>Tot</th>
                            <th>%</th>
                            <th>Pos</th>
                            <th>Neutre</th>
                            <th>Neg</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${genererLigneTableauFrappes('Classique', st.frappesClassiquesTotal || 0, totalFrappesGlobal, st.frappesClassiquesPos || 0, st.frappesClassiquesNeutre || 0, st.frappesClassiquesNeg || 0)}
                        ${genererLigneTableauFrappes('Attaque', st.frappesAttaqueTotal || 0, totalFrappesGlobal, st.frappesAttaquePos || 0, st.frappesAttaqueNeutre || 0, st.frappesAttaqueNeg || 0)}
                        ${genererLigneTableauFrappes('Picada', st.picadaTotal || 0, totalFrappesGlobal, st.picadaPos || 0, st.picadaNeutre || 0, st.picadaNeg || 0)}
                        ${genererLigneTableauFrappes('Dejada', st.dejadaTotal || 0, totalFrappesGlobal, st.dejadaPos || 0, st.dejadaNeutre || 0, st.dejadaNeg || 0)}
                        ${genererLigneTableauFrappes('Txik Txak', st.txikTxakTotal || 0, totalFrappesGlobal, st.txikTxakPos || 0, st.txikTxakNeutre || 0, st.txikTxakNeg || 0)}
                        ${genererLigneTableauFrappes('Txula', st.txulaTotal || 0, totalFrappesGlobal, st.txulaPos || 0, st.txulaNeutre || 0, st.txulaNeg || 0)}
                        ${genererLigneTableauFrappes('Cortada', st.cortadaTotal || 0, totalFrappesGlobal, st.cortadaPos || 0, st.cortadaNeutre || 0, st.cortadaNeg || 0)}
                        ${genererLigneTableauFrappes('Gauche gauche', st.gaucheGaucheTotal || 0, totalFrappesGlobal, st.gaucheGauchePos || 0, st.gaucheGaucheNeutre || 0, st.gaucheGaucheNeg || 0)}
                        ${genererLigneTableauFrappes('Gauche droite', st.gaucheDroiteTotal || 0, totalFrappesGlobal, st.gaucheDroitePos || 0, st.gaucheDroiteNeutre || 0, st.gaucheDroiteNeg || 0)}
                        ${genererLigneTableauFrappes('2 Murs', st.deuxMursTotal || 0, totalFrappesGlobal, st.deuxMursPos || 0, st.deuxMursNeutre || 0, st.deuxMursNeg || 0)}
                    </tbody>
                </table>
            </div>
        `;
    }

    window.initialiserPageStats = function() {
        window.filtrerMatchsParRecherche();
        afficherStatsTotales();
    };

    document.addEventListener("DOMContentLoaded", () => {
        setTimeout(() => {
            if (document.getElementById('matchSelect') && document.getElementById('matchSelect').children.length === 0) {
                window.initialiserPageStats();
            }
        }, 800);
    });
</script>

</body>
</html>
