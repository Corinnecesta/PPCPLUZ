<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cesta Punta - Fiche Joueur & Statistiques</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <style>
        .section-title { font-size: 0.85rem; color: var(--accent-color); text-transform: uppercase; font-weight: 700; margin-bottom: 12px; letter-spacing: 0.5px; }
        .profile-card { background: var(--card-bg); border: 2px solid var(--card-border); border-radius: 16px; padding: 18px 15px; text-align: center; margin-bottom: 15px; box-shadow: 0 4px 12px rgba(23, 184, 144, 0.2); transition: all 0.3s; }
        .profile-photo { width: 85px; height: 85px; border-radius: 50%; object-fit: cover; object-position: center; display: block; margin: 0 auto 10px auto; border: 2px solid var(--accent-color); background: rgba(0,0,0,0.2); }
        .profile-name { font-size: 1.15rem; font-weight: 800; margin-bottom: 2px; color: var(--container-text); }
        .profile-club { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 8px; }
        
        .profile-details-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin: 10px 0 10px 0;
            padding: 8px 4px;
            background: rgba(15, 76, 92, 0.2);
            border: 1px solid var(--card-border);
            border-radius: 12px;
        }
        .detail-item { display: flex; flex-direction: column; align-items: center; }
        .detail-label { font-size: 0.6rem; color: var(--text-muted); text-transform: uppercase; font-weight: 600; }
        .detail-value { font-size: 0.75rem; color: var(--container-text); font-weight: 700; margin-top: 2px; }

        .badge { background: var(--card-hover-bg); border: 1px solid var(--card-border); color: var(--accent-color); padding: 4px 14px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; display: inline-block; }

        .global-stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-bottom: 12px;
            padding: 10px 6px;
            background: var(--card-bg);
            border: 2px solid var(--card-border);
            border-radius: 14px;
            box-shadow: 0 4px 12px rgba(23, 184, 144, 0.2);
            text-align: center;
        }
        .global-stat-item { display: flex; flex-direction: column; align-items: center; }
        .global-stat-label { font-size: 0.58rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700; }
        .global-stat-value { font-size: 0.85rem; color: var(--container-text); font-weight: 800; margin-top: 3px; }

        .sub-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .sub-tab-btn { background: var(--card-bg); border: 2px solid var(--card-border); border-radius: 10px; padding: 10px; font-size: 0.8rem; font-weight: 600; color: var(--text-muted); cursor: pointer; text-align: center; transition: all 0.25s; }
        .sub-tab-btn.active { background: var(--btn-gradient); border-color: var(--accent-color); color: var(--container-text); }

        /* Grille pour afficher les compétitions 2 par 2 côte à côte */
        .competitions-grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 12px;
        }

        /* Style pour chaque bloc de compétition */
        .competition-accordion-item {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            overflow: hidden;
            transition: border-color 0.2s;
        }
        .competition-accordion-header {
            padding: 8px 10px;
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--accent-color);
            background: rgba(15, 76, 92, 0.15);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
            text-align: left;
        }
        .competition-accordion-header:hover {
            background: rgba(15, 76, 92, 0.3);
        }

        /* Conteneur des matchs qui s'ouvre en pleine largeur en dessous des blocs */
        .competition-full-content {
            display: none;
            background: var(--card-bg);
            border: 1px solid var(--accent-color);
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 12px;
        }
        .competition-full-content.open {
            display: block;
        }

        .card-item { background: var(--card-bg); border: 2px solid var(--card-border); border-radius: 12px; padding: 10px 12px; margin-bottom: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); transition: all 0.2s ease; }
        .card-item:hover { border-color: var(--accent-color); background: var(--card-hover-bg); }
        .card-item.match-item-btn { border-width: 2px; }
        .card-item.match-item-btn.active { border-color: var(--accent-color); background: var(--card-hover-bg); }

        .item-title { font-weight: bold; font-size: 0.85rem; color: var(--container-text); margin-bottom: 6px; }

        .stat-table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 0.7rem; }
        .stat-table th, .stat-table td { text-align: left; padding: 5px 3px; border-bottom: 1px solid rgba(255,255,255,0.06); }
        .stat-table th { color: var(--accent-color); font-weight: 700; text-transform: uppercase; font-size: 0.65rem; letter-spacing: 0.3px; }
        
        .text-green { color: #10B981 !important; font-weight: 700; }
        .text-red { color: #EF4444 !important; font-weight: 700; }

        .side-bar-container { margin-top: 8px; margin-bottom: 4px; }
        .side-labels { display: flex; justify-content: space-between; font-size: 0.75rem; font-weight: 600; margin-bottom: 4px; }
        .side-bar-track { display: flex; height: 12px; width: 100%; border-radius: 6px; overflow: hidden; background: rgba(255,255,255,0.1); }
        .side-bar-forehand { background: var(--accent-color, #17b890); transition: width 0.3s ease; }
        .side-bar-backhand { background: #3b82f6; transition: width 0.3s ease; }

        .full-match-title-box {
            background: var(--card-bg);
            border: 1px solid var(--accent-color);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 8px;
            font-size: 0.85rem;
            font-weight: bold;
            color: var(--accent-color);
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .match-actions-bar { display: flex; gap: 8px; margin-bottom: 12px; }
        .btn-action-edit, .btn-action-delete { flex: 1; padding: 8px; border-radius: 8px; font-size: 0.75rem; font-weight: 600; cursor: pointer; border: none; transition: opacity 0.2s; }
        .btn-action-edit { background-color: #f59e0b; color: #fff; }
        .btn-action-delete { background-color: #ef4444; color: #fff; }

        .edit-form-card { background: var(--card-bg); border: 2px solid var(--accent-color); border-radius: 12px; padding: 14px; margin-bottom: 12px; max-height: 70vh; overflow-y: auto; }
        .edit-form-card h4 { margin: 0 0 10px 0; color: var(--accent-color); font-size: 0.9rem; border-bottom: 1px solid var(--card-border); padding-bottom: 6px; }
        .edit-form-card h5 { margin: 12px 0 6px 0; color: var(--container-text); font-size: 0.8rem; text-transform: uppercase; background: rgba(15, 76, 92, 0.3); padding: 4px 8px; border-radius: 6px; }
        .edit-form-card label { display: block; font-size: 0.72rem; color: var(--text-muted); margin-bottom: 3px; }
        .edit-form-card input { width: 100%; background: var(--card-hover-bg); border: 1px solid var(--card-border); color: var(--container-text); padding: 7px 10px; border-radius: 6px; font-size: 0.8rem; margin-bottom: 8px; box-sizing: border-box; }
        .edit-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .edit-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
        .edit-grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
        .edit-form-buttons { display: flex; gap: 8px; margin-top: 15px; position: sticky; bottom: 0; background: var(--card-bg); padding-top: 10px; }
        .btn-save { background: #10b981; color: white; border: none; padding: 10px; border-radius: 6px; font-size: 0.8rem; font-weight: 600; cursor: pointer; flex: 1; }
        .btn-cancel { background: #6b7280; color: white; border: none; padding: 10px; border-radius: 6px; font-size: 0.8rem; font-weight: 600; cursor: pointer; }

        .home-btn {
            width: 38px;
            height: 38px;
            background: var(--card-bg);
            border: 2px solid var(--card-border);
            color: var(--container-text);
            border-radius: 50%;
            font-size: 1rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .home-btn:hover {
            background: var(--card-hover-bg);
            border-color: var(--accent-color);
        }
        .header-actions {
            display: flex;
            gap: 6px;
            align-items: center;
        }
    </style>
</head>
<body>

<div class="mobile-container">
    <div class="top-header">
        <img src="logoce.png" alt="Logo Cesta Punta" class="logo-img">
        <div class="header-actions">
            <a href="accueil.html" class="home-btn" title="Retour à l'accueil">🏠</a>
            <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()" title="Changer de thème">🌙</button>
            <a href="parametres.html" class="profile-btn" title="Mon Compte">👤</a>
        </div>
    </div>

    <hr class="separator">

    <!-- En-tête Profil Joueur -->
    <div id="playerProfileContainer">
        <div style="text-align: center; color: var(--text-muted); padding: 20px;">Chargement du profil...</div>
    </div>

    <!-- Bloc récapitulatif global -->
    <div class="global-stats-grid" id="globalStatsSummary">
        <div class="global-stat-item">
            <span class="global-stat-label">Matchs</span>
            <span class="global-stat-value" id="valTotalMatchs">0</span>
        </div>
        <div class="global-stat-item">
            <span class="global-stat-label">Victoires</span>
            <span class="global-stat-value text-green" id="valTotalVictoires">0</span>
        </div>
        <div class="global-stat-item">
            <span class="global-stat-label">Défaites</span>
            <span class="global-stat-value text-red" id="valTotalDefaites">0</span>
        </div>
        <div class="global-stat-item">
            <span class="global-stat-label">% Réussite</span>
            <span class="global-stat-value" id="valPctReussite">0%</span>
        </div>
    </div>

    <!-- Sélecteur Vue Par partie / Totales -->
    <div class="sub-tabs">
        <div class="sub-tab-btn active" id="subTabPartie" onclick="switchSubTab('partie')">Par partie</div>
        <div class="sub-tab-btn" id="subTabTotales" onclick="switchSubTab('totales')">Totales</div>
    </div>

    <!-- Vue Par Partie : Compétitions côte à côte (2 par ligne) -->
    <div id="viewPartie">
        <div class="competitions-grid-container" id="competitionsGridContainer"></div>
        <div id="competitionDetailsArea"></div>

        <div class="match-actions-bar" id="matchActionsBar" style="display: none; margin-top: 15px;">
            <button class="btn-action-edit" onclick="ouvrirFormulaireEdition()">✏ Modifier</button>
            <button class="btn-action-delete" onclick="supprimerPartieActive()">🗑️ Supprimer</button>
        </div>

        <div id="editFormContainer" style="display: none;"></div>

        <div id="detailsPartieContainer" style="margin-top: 15px;">
            <div style="text-align: center; color: var(--text-muted); padding: 20px;">Sélectionnez une partie pour voir le détail.</div>
        </div>
    </div>

    <!-- Vue Totales -->
    <div id="viewTotales" style="display: none;">
        <div id="detailsTotalesContainer">
            <div style="text-align: center; color: var(--text-muted); padding: 20px;">Calcul des statistiques globales...</div>
        </div>
    </div>
</div>

<script src="joueurs-data.js"></script>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, getDoc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBTujsGZneEGx1_V27zgRNf9-qM9zFFHQA",
        authDomain: "ppcestapunta64500.firebaseapp.com",
        projectId: "ppcestapunta64500",
        storageBucket: "ppcestapunta64500.firebasestorage.app",
        messagingSenderId: "80945272911",
        appId: "1:80945272911:web:154437e054b190e7ebb23a",
        measurementId: "G-SCYGWMW7VF"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const urlParams = new URLSearchParams(window.location.search);
    const playerId = urlParams.get('id') || "autre";
    const matchIdParam = urlParams.get('idMatch');

    const htmlElement = document.documentElement;
    const themeToggleBtn = document.getElementById('themeToggleBtn');

    const savedTheme = localStorage.getItem('cesta_theme');
    if (savedTheme) {
        htmlElement.setAttribute('data-theme', savedTheme);
        updateButtonIcon(savedTheme);
    }

    window.toggleTheme = function() {
        const currentTheme = htmlElement.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        htmlElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('cesta_theme', newTheme);
        updateButtonIcon(newTheme);
    }

    function updateButtonIcon(theme) {
        themeToggleBtn.innerHTML = (theme === 'light') ? '☀️' : '🌙';
    }

    window.switchSubTab = function(mode) {
        document.getElementById('subTabPartie').classList.remove('active');
        document.getElementById('subTabTotales').classList.remove('active');
        document.getElementById('viewPartie').style.display = 'none';
        document.getElementById('viewTotales').style.display = 'none';

        if (mode === 'partie') {
            document.getElementById('subTabPartie').classList.add('active');
            document.getElementById('viewPartie').style.display = 'block';
        } else {
            document.getElementById('subTabTotales').classList.add('active');
            document.getElementById('viewTotales').style.display = 'block';
            calculerEtAfficherTotales();
        }
    }

    function calculerAge(dateNaissanceStr) {
        if (!dateNaissanceStr) return "N/C";
        const parties = dateNaissanceStr.split('/');
        if (parties.length !== 3) return "N/C";
        const naissance = new Date(parties[2], parties[1] - 1, parties[0]);
        const aujourdHui = new Date();
        let age = aujourdHui.getFullYear() - naissance.getFullYear();
        const m = aujourdHui.getMonth() - naissance.getMonth();
        if (m < 0 || (m === 0 && aujourdHui.getDate() - naissance.getDate())) age--;
        return age + " ans";
    }

    function formaterDateFR(dateStr) {
        if (!dateStr) return '';
        if (typeof dateStr === 'string' && dateStr.includes('/')) {
            const parts = dateStr.split('/');
            if (parts.length === 3 && parts[2].length === 4) {
                const moisFR = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
                const mIndex = parseInt(parts[1], 10) - 1;
                if (mIndex >= 0 && mIndex < 12) {
                    return `${parseInt(parts[0], 10)} ${moisFR[mIndex]} ${parts[2]}`;
                }
            }
        }
        return dateStr;
    }

    function parseDateMatch(dateStr) {
        if (!dateStr) return new Date(0);
        const cleanStr = dateStr.replace(/-/g, '/');
        const parts = cleanStr.split('/');
        if (parts.length === 3) {
            return new Date(parts[2], parts[1] - 1, parts[0]);
        }
        return new Date(0);
    }

    function determinerVainqueur(s1, s2) {
        if (s1 === undefined || s2 === undefined) return 0;
        let str1 = String(s1).trim();
        let str2 = String(s2).trim();

        let sets1 = str1.split(/[\/\s-]+/).map(Number).filter(n => !isNaN(n));
        let sets2 = str2.split(/[\/\s-]+/).map(Number).filter(n => !isNaN(n));

        if (sets1.length > 0 && sets2.length > 0) {
            let wins1 = 0;
            let wins2 = 0;
            for (let i = 0; i < Math.min(sets1.length, sets2.length); i++) {
                if (sets1[i] > sets2[i]) wins1++;
                else if (sets2[i] > sets1[i]) wins2++;
            }
            if (wins1 > wins2) return 1;
            if (wins2 > wins1) return 2;

            let sum1 = sets1.reduce((a, b) => a + b, 0);
            let sum2 = sets2.reduce((a, b) => a + b, 0);
            if (sum1 > sum2) return 1;
            if (sum2 > sum1) return 2;
        }

        let num1 = parseFloat(str1);
        let num2 = parseFloat(str2);
        if (!isNaN(num1) && !isNaN(num2)) {
            if (num1 > num2) return 1;
            if (num2 > num1) return 2;
        }
        return 0;
    }

    function estMatchDuJoueur(m) {
        if (m.statsParJoueur && m.statsParJoueur[playerId]) return true;
        if (m.statsJoueurs && m.statsJoueurs[playerId]) return true;
        
        const nomRecherche = (joueur?.nom || "").toLowerCase().trim(); 
        const prenomRecherche = (joueur?.prenom || "").toLowerCase().trim();
        const e1 = (m.equipe1 || "").toLowerCase();
        const e2 = (m.equipe2 || "").toLowerCase();
        
        return (nomRecherche && (e1.includes(nomRecherche) || e2.includes(nomRecherche))) ||
               (prenomRecherche && (e1.includes(prenomRecherche) || e2.includes(prenomRecherche)));
    }

    function getEquipeJoueur(m) {
        const nomRecherche = (joueur?.nom || "").toLowerCase().trim();
        const prenomRecherche = (joueur?.prenom || "").toLowerCase().trim();
        const e1 = (m.equipe1 || "").toLowerCase();
        const e2 = (m.equipe2 || "").toLowerCase();

        const dansE1 = (nomRecherche && e1.includes(nomRecherche)) || (prenomRecherche && e1.includes(prenomRecherche));
        const dansE2 = (nomRecherche && e2.includes(nomRecherche)) || (prenomRecherche && e2.includes(prenomRecherche));

        if (dansE1 && !dansE2) return 1;
        if (dansE2 && !dansE1) return 2;
        return 1;
    }

    let joueur = null;
    let listeMatchsJoueur = [];
    let statsParMatchGlobal = {};
    let matchActifId = null;

    async function initialiserPageJoueur() {
        try {
            const docRef = doc(db, "joueurs", playerId);
            const docSnap = await getDoc(docRef);

            if (docSnap.exists()) {
                joueur = { id: docSnap.id, ...docSnap.data() };
            } else {
                const joueursSnap = await getDocs(collection(db, "joueurs"));
                let joueurTrouve = null;
                joueursSnap.forEach((docSnap) => {
                    const data = docSnap.data();
                    const docId = docSnap.id.toLowerCase();
                    const paramId = playerId.toLowerCase();
                    const nomJoueur = (data.nom || "").toLowerCase();
                    const prenomJoueur = (data.prenom || "").toLowerCase();

                    if (docId === paramId || nomJoueur.includes(paramId) || prenomJoueur.includes(paramId)) {
                        joueurTrouve = { id: docSnap.id, ...data };
                    }
                });

                if (joueurTrouve) {
                    joueur = joueurTrouve;
                } else if (typeof joueursData !== 'undefined') {
                    joueur = joueursData.find(j => String(j.id).toLowerCase() === String(playerId).toLowerCase());
                }
            }

            if (!joueur) {
                joueur = { id: playerId, prenom: "Joueur", nom: "Inconnu", club: "Cesta Punta", photo: "logoce.png" };
            }

            document.getElementById('playerProfileContainer').innerHTML = `
                <div class="profile-card">
                    <img src="${joueur.photo || 'logoce.png'}" alt="${joueur.nom}" class="profile-photo" onerror="this.src='logoce.png'">
                    <div class="profile-name">${joueur.prenom || ''} ${joueur.nom || ''}</div>
                    <div class="profile-club">${joueur.club || joueur.pays || ''}</div>
                    <div class="profile-details-grid">
                        <div class="detail-item"><span class="detail-label">Naissance</span><span class="detail-value">${joueur.dateNaissance || "N/C"}</span></div>
                        <div class="detail-item"><span class="detail-label">Âge</span><span class="detail-value">${calculerAge(joueur.dateNaissance)}</span></div>
                        <div class="detail-item"><span class="detail-label">Taille</span><span class="detail-value">${joueur.taille || "N/C"}</span></div>
                        <div class="detail-item"><span class="detail-label">Poids</span><span class="detail-value">${joueur.poids || "N/C"}</span></div>
                    </div>
                    <div class="badge">Poste : ${joueur.specialite || joueur.poste || "N/C"}</div>
                </div>
            `;

            const matchsSnap = await getDocs(collection(db, "matchs"));
            listeMatchsJoueur = [];
            statsParMatchGlobal = {};

            let tousLesMatchsBruts = [];
            matchsSnap.forEach((docSnap) => {
                tousLesMatchsBruts.push({ id: docSnap.id, ...docSnap.data() });
            });

            const matchsDuJoueur = tousLesMatchsBruts.filter(m => estMatchDuJoueur(m));

            let totalMatchs = matchsDuJoueur.length;
            let totalVictoires = 0;
            let totalDefaites = 0;

            matchsDuJoueur.forEach((matchData) => {
                const matchId = matchData.id;
                const dicoStats = matchData.statsParJoueur || matchData.statsJoueurs || {};
                let statsTrouvees = dicoStats[playerId];

                if (!statsTrouvees && joueur.nom) {
                    const nomRecherche = joueur.nom.toLowerCase().trim();
                    for (const key in dicoStats) {
                        if (key.toLowerCase().includes(nomRecherche)) {
                            statsTrouvees = dicoStats[key];
                            break;
                        }
                    }
                }

                listeMatchsJoueur.push(matchData);
                statsParMatchGlobal[matchId] = statsTrouvees || matchData.stats || {};

                const score1 = matchData.scoreEquipe1 !== undefined ? matchData.scoreEquipe1 : (matchData.equipe1Score ?? matchData.score1 ?? 0);
                const score2 = matchData.scoreEquipe2 !== undefined ? matchData.scoreEquipe2 : (matchData.equipe2Score ?? matchData.score2 ?? 0);
                
                const vainqueur = determinerVainqueur(score1, score2);
                const equipeJoueur = getEquipeJoueur(matchData);

                if (vainqueur !== 0) {
                    if (vainqueur === equipeJoueur) totalVictoires++;
                    else totalDefaites++;
                }
            });

            listeMatchsJoueur.sort((a, b) => parseDateMatch(b.date) - parseDateMatch(a.date));

            const pctReussite = totalMatchs > 0 ? Math.round((totalVictoires / totalMatchs) * 100) : 0;
            document.getElementById('valTotalMatchs').textContent = totalMatchs;
            document.getElementById('valTotalVictoires').textContent = totalVictoires;
            document.getElementById('valTotalDefaites').textContent = totalDefaites;
            document.getElementById('valPctReussite').textContent = pctReussite + "%";

            construireGrilleCompetitions();

        } catch (error) {
            console.error("Erreur lors de l'initialisation :", error);
        }
    }

    window.changerPartieSelectionnee = function(matchId) {
        matchActifId = matchId;
        document.querySelectorAll('.match-item-btn').forEach(b => b.classList.remove('active'));
        const btnCible = document.getElementById(`match_btn_${matchId}`);
        if (btnCible) btnCible.classList.add('active');
        
        afficherStatsMatch(matchId);
    }

    window.toggleCompetitionBox = function(compKey) {
        document.querySelectorAll('.competition-full-content').forEach(el => {
            if (el.id !== `comp_full_content_${compKey}`) el.classList.remove('open');
        });

        const cible = document.getElementById(`comp_full_content_${compKey}`);
        if (cible) {
            cible.classList.toggle('open');
            if (cible.classList.contains('open')) {
                cible.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }
    };

    function construireGrilleCompetitions() {
        const gridContainer = document.getElementById('competitionsGridContainer');
        const detailsArea = document.getElementById('competitionDetailsArea');
        gridContainer.innerHTML = '';
        detailsArea.innerHTML = '';

        const ordreCompetitions = [
            "Winter Series",
            "Gant d'Or de Biarritz",
            "Cesta Pau Cup",
            "Internationnaux de St Jean de Luz",
            "Internationaux de St Jean de Luz",
            "Jaï Alaï League",
            "Jai Alai League",
            "Championnat de France",
            "Championnat du Pays Basque",
            "All Star",
            "All Stars",
            "Summer League",
            "Pôle",
            "Championnat du Monde"
        ];

        const groupCompetitions = {};
        ordreCompetitions.forEach(comp => {
            groupCompetitions[comp] = [];
        });

        listeMatchsJoueur.forEach(match => {
            const comp = match.competition || match.titre || "Autres compétitions";
            if (!groupCompetitions[comp]) {
                groupCompetitions[comp] = [];
            }
            groupCompetitions[comp].push(match);
        });

        Object.keys(groupCompetitions).forEach(comp => {
            groupCompetitions[comp].sort((a, b) => parseDateMatch(b.date) - parseDateMatch(a.date));
        });

        let competitionsTriees = [...ordreCompetitions];
        Object.keys(groupCompetitions).forEach(comp => {
            if (!competitionsTriees.includes(comp)) {
                competitionsTriees.push(comp);
            }
        });

        competitionsTriees.forEach((comp) => {
            const matchesComp = groupCompetitions[comp] || [];
            const safeKey = comp.replace(/[^a-zA-Z0-9]/g, '_');

            const itemDiv = document.createElement('div');
            itemDiv.className = 'competition-accordion-item';

            const headerDiv = document.createElement('div');
            headerDiv.className = 'competition-accordion-header';
            headerDiv.innerHTML = `<span>🏆 ${comp}</span><span style="background: rgba(255,255,255,0.1); padding: 2px 6px; border-radius: 6px; font-size: 0.65rem;">${matchesComp.length}</span>`;
            headerDiv.onclick = () => toggleCompetitionBox(safeKey);

            itemDiv.appendChild(headerDiv);
            gridContainer.appendChild(itemDiv);

            // Tous les blocs restent fermés par défaut
            const fullContentDiv = document.createElement('div');
            fullContentDiv.id = `comp_full_content_${safeKey}`;
            fullContentDiv.className = `competition-full-content`;

            if (matchesComp.length === 0) {
                fullContentDiv.innerHTML = `<div style="text-align: center; color: var(--text-muted); padding: 10px; font-size: 0.75rem;">Aucun match dans cette compétition.</div>`;
            } else {
                matchesComp.forEach((match) => {
                    const dateFormatted = formaterDateFR(match.date);
                    const libelleEquipes = (match.equipe1 && match.equipe2) ? `${match.equipe1} vs ${match.equipe2}` : 'Partie';
                    const e1Score = match.scoreEquipe1 !== undefined ? match.scoreEquipe1 : (match.equipe1Score ?? match.score1 ?? 0);
                    const e2Score = match.scoreEquipe2 !== undefined ? match.scoreEquipe2 : (match.equipe2Score ?? match.score2 ?? 0);

                    let indicateur = '';
                    const vainqueur = determinerVainqueur(e1Score, e2Score);
                    const equipeJoueur = getEquipeJoueur(match);

                    if (vainqueur !== 0) {
                        indicateur = (vainqueur === equipeJoueur) ? ' 🟢' : ' 🔴';
                    }

                    const scoreStr = (e1Score !== '' && e2Score !== '') ? ` [${e1Score} - ${e2Score}]${indicateur}` : '';

                    const matchCardBtn = document.createElement('div');
                    matchCardBtn.id = `match_btn_${match.id}`;
                    matchCardBtn.className = 'card-item match-item-btn';
                    matchCardBtn.style.cursor = 'pointer';
                    matchCardBtn.innerHTML = `
                        <div style="font-size: 0.8rem; font-weight: bold; color: var(--container-text);">
                            ${libelleEquipes} ${scoreStr}
                        </div>
                        <div style="font-size: 0.72rem; color: var(--text-muted); margin-top: 2px;">
                            📅 ${dateFormatted} ${match.lieu ? '• 📍 ' + match.lieu : ''}
                        </div>
                    `;
                    matchCardBtn.onclick = () => changerPartieSelectionnee(match.id);
                    fullContentDiv.appendChild(matchCardBtn);
                });
            }

            detailsArea.appendChild(fullContentDiv);
        });

        // Ouverture uniquement si un paramètre d'URL spécifique est présent (ex: lien direct vers un match)
        if (matchIdParam) {
            matchActifId = matchIdParam;
            const matchCibleObj = listeMatchsJoueur.find(m => m.id === matchIdParam);
            if (matchCibleObj) {
                const compCible = matchCibleObj.competition || matchCibleObj.titre || "Autres compétitions";
                const safeKey = compCible.replace(/[^a-zA-Z0-9]/g, '_');
                const contentEl = document.getElementById(`comp_full_content_${safeKey}`);
                if (contentEl) {
                    contentEl.classList.add('open');
                }
            }
            changerPartieSelectionnee(matchIdParam);
        }
    };

    function calcPct(valeur, total) {
        if (!total || total === 0) return '0%';
        return Math.round((valeur / total) * 100) + '%';
    }

    function genererLigneTableau(nom, total, grandTotal, pos, neg) {
        return `<tr><td><strong>${nom}</strong></td><td>${total}</td><td>${calcPct(total, grandTotal)}</td><td style="color:#10B981;">${pos} (${calcPct(pos, total)})</td><td style="color:#EF4444;">${neg} (${calcPct(neg, total)})</td></tr>`;
    }

    function genererLigneTableauFrappes(nom, total, grandTotal, pos, neutre, neg) {
        return `<tr><td><strong>${nom}</strong></td><td>${total}</td><td>${calcPct(total, grandTotal)}</td><td style="color:#10B981;">${pos} (${calcPct(pos, total)})</td><td style="color:#F59E0B;">${neutre} (${calcPct(neutre, total)})</td><td style="color:#EF4444;">${neg} (${calcPct(neg, total)})</td></tr>`;
    }

    function afficherStatsMatch(matchId) {
        window.fermerFormulaireEdition();
        const match = listeMatchsJoueur.find(m => m.id === matchId);
        if (!match) return;

        const role = localStorage.getItem('cesta_user_role');
        const actionsBar = document.getElementById('matchActionsBar');
        if (actionsBar) actionsBar.style.display = (role === 'admin') ? 'flex' : 'none';

        const stats = statsParMatchGlobal[matchId] || {};
        const nomJoueurStr = `${joueur.prenom || ""} ${joueur.nom || ""}`.trim();

        const score1 = match.scoreEquipe1 !== undefined ? match.scoreEquipe1 : (match.equipe1Score ?? match.score1 ?? 0);
        const score2 = match.scoreEquipe2 !== undefined ? match.scoreEquipe2 : (match.equipe2Score ?? match.score2 ?? 0);
        
        let equipe1Nom = match.equipe1 || "Équipe 1";
        let equipe2Nom = match.equipe2 || "Équipe 2";
        let color1 = 'inherit', color2 = 'inherit';
        const vainqueur = determinerVainqueur(score1, score2);

        if (vainqueur === 1) { color1 = '#10B981'; color2 = '#EF4444'; equipe1Nom = `🏆 ${equipe1Nom}`; }
        else if (vainqueur === 2) { color1 = '#EF4444'; color2 = '#10B981'; equipe2Nom = `🏆 ${equipe2Nom}`; }

        const pelotesJouees = Number(stats.pelotesJouees || 0);
        const totalPartiePelotes = Number(stats.pelotesTotales || 100); 
        const pointsGagnes = Number(stats.ptsGagnes || stats.pointsGagnes || 0);
        const totalPartieGagnes = Number(stats.ptsGagnesTotaux || 50);
        const pointsPerdus = Number(stats.ptsPerdus || stats.pointsPerdus || 0);
        const totalPartiePerdus = Number(stats.ptsPerdusTotaux || 50);

        const butsTotal = Number(stats.butsTotal || 0);
        const butsArriere = Number(stats.butsSurArriere || 0);
        const butsAvant = Number(stats.butsSurAvant || 0);
        const ace = Number(stats.butsAce || 0);
        const pasa = Number(stats.butsPasa || 0);
        const falta = Number(stats.butsFalta || 0);

        const coupDroitPct = Number(stats.receptionsCoupDroitPct || stats.coupDroitPct || 50);
        const reversPct = 100 - coupDroitPct;

        const aireTot = Number(stats.aireTotal || 0), airePos = Number(stats.airePositif || 0), aireNeg = Number(stats.aireNegatif || 0);
        const boteTot = Number(stats.boteTotal || 0), botePos = Number(stats.botePositif || 0), boteNeg = Number(stats.boteNegatif || 0);
        const boteCorridoTot = Number(stats.boteCorridoTotal || 0), boteCorridoPos = Number(stats.boteCorridoPositif || 0), boteCorridoNeg = Number(stats.boteCorridoNegatif || 0);
        const boteProntoTot = Number(stats.boteProntoTotal || 0), boteProntoPos = Number(stats.boteProntoPositif || 0), boteProntoNeg = Number(stats.boteProntoNegatif || 0);
        const ereboteTot = Number(stats.ereboteTotal || 0), erebotePos = Number(stats.erebotePositif || 0), ereboteNeg = Number(stats.ereboteNegatif || 0);
        const pumpaTot = Number(stats.pumpa || stats.pumpaTotal || 0), pumpaPos = Number(stats.pumpaPositif || 0), pumpaNeg = Number(stats.pumpaNegatif || 0);

        const totalReceptionsGlobal = aireTot + boteTot + boteCorridoTot + boteProntoTot + ereboteTot + pumpaTot;

        const typesFrappes = [
            { nom: "Classique", total: Number(stats.frappesClassiquesTotal || 0), pos: Number(stats.frappesClassiquesPos || 0), neutre: Number(stats.frappesClassiquesNeutre || 0), neg: Number(stats.frappesClassiquesNeg || 0) },
            { nom: "Attaque", total: Number(stats.frappesAttaqueTotal || 0), pos: Number(stats.frappesAttaquePos || 0), neutre: Number(stats.frappesAttaqueNeutre || 0), neg: Number(stats.frappesAttaqueNeg || 0) },
            { nom: "Picada", total: Number(stats.picadaTotal || 0), pos: Number(stats.picadaPos || 0), neutre: Number(stats.picadaNeutre || 0), neg: Number(stats.picadaNeg || 0) },
            { nom: "Dejada", total: Number(stats.dejadaTotal || 0), pos: Number(stats.dejadaPos || 0), neutre: Number(stats.dejadaNeutre || 0), neg: Number(stats.dejadaNeg || 0) },
            { nom: "Txik Txak", total: Number(stats.txikTxakTotal || 0), pos: Number(stats.txikTxakPos || 0), neutre: Number(stats.txikTxakNeutre || 0), neg: Number(stats.txikTxakNeg || 0) },
            { nom: "Txula", total: Number(stats.txulaTotal || 0), pos: Number(stats.txulaPos || 0), neutre: Number(stats.txulaNeutre || 0), neg: Number(stats.txulaNeg || 0) },
            { nom: "Cortada", total: Number(stats.cortadaTotal || 0), pos: Number(stats.cortadaPos || 0), neutre: Number(stats.cortadaNeutre || 0), neg: Number(stats.cortadaNeg || 0) },
            { nom: "Gauche gauche", total: Number(stats.gaucheGaucheTotal || 0), pos: Number(stats.gaucheGauchePos || 0), neutre: Number(stats.gaucheGaucheNeutre || 0), neg: Number(stats.gaucheGaucheNeg || 0) },
            { nom: "Gauche droite", total: Number(stats.gaucheDroiteTotal || 0), pos: Number(stats.gaucheDroitePos || 0), neutre: Number(stats.gaucheDroiteNeutre || 0), neg: Number(stats.gaucheDroiteNeg || 0) },
            { nom: "2 Murs", total: Number(stats.deuxMursTotal || 0), pos: Number(stats.deuxMursPos || 0), neutre: Number(stats.deuxMursNeutre || 0), neg: Number(stats.deuxMursNeg || 0) }
        ];

        const totalFrappesGlobal = typesFrappes.reduce((acc, f) => acc + f.total, 0);

                    <span style="background: var(--card-bg); padding: 4px 12px; border-radius: 8px; border: 1px solid var(--accent-color); display: inline-flex; flex-direction: column; align-items: center;">
                        <span style="color: #10B981; font-weight: bold;">${score1}</span>
                        <span style="color: #EF4444; font-weight: bold;">${score2}</span>
                    </span>
                    <span style="color: ${color2}; flex: 1; text-align: right;">${equipe2Nom}</span>
                </div>
            </div>

            <div class="card-item">
                <div class="item-title">🥎 Pelotes & Points (${nomJoueurStr})</div>
                <table class="stat-table">
                    <thead><tr><th>Statistique</th><th>Joueur</th><th>Total</th><th>%</th></tr></thead>
                    <tbody>
                        <tr><td><strong>Pelotes jouées</strong></td><td>${pelotesJouees}</td><td>${totalPartiePelotes}</td><td><strong>${calcPct(pelotesJouees, totalPartiePelotes)}</strong></td></tr>
                        <tr><td><strong>Points gagnés</strong></td><td style="color:#10B981;">${pointsGagnes}</td><td>${totalPartieGagnes}</td><td style="color:#10B981;"><strong>${calcPct(pointsGagnes, totalPartieGagnes)}</strong></td></tr>
                        <tr><td><strong>Points perdus</strong></td><td style="color:#EF4444;">${pointsPerdus}</td><td>${totalPartiePerdus}</td><td style="color:#EF4444;"><strong>${calcPct(pointsPerdus, totalPartiePerdus)}</strong></td></tr>
                    </tbody>
                </table>
            </div>

            <div class="card-item">
                <div class="item-title">🎯 Buts</div>
                <table class="stat-table">
                    <thead><tr><th>Total</th><th>Arrière</th><th>Avant</th><th>Ace</th><th>Pasa</th><th>Falta</th></tr></thead>
                    <tbody>
                        <tr><td><strong>${butsTotal}</strong></td><td>${butsArriere}</td><td>${butsAvant}</td><td style="color:#10B981;">${ace}</td><td style="color:#F59E0B;">${pasa}</td><td style="color:#EF4444;">${falta}</td></tr>

                </table>
            </div>

            <div class="card-item">
                <div class="item-title">📊 Répartition des échanges</div>
                <div class="side-bar-container">
                    <div class="side-labels"><span style="color: var(--accent-color);">🟢 Coup Droit : ${coupDroitPct}%</span><span style="color: #3b82f6;">🔵 Revers : ${reversPct}%</span></div>

                    </div>
                </div>
            </div>

            <div class="card-item">
                <div class="item-title">📥 Réceptions</div>
                <table class="stat-table">
                    <thead><tr><th>Type</th><th>Tot</th><th>%</th><th>Pos</th><th>Neg</th></tr></thead>
                    <tbody>
                        ${genererLigneTableau('Aire', aireTot, totalReceptionsGlobal, airePos, aireNeg)}
                        ${genererLigneTableau('Bote', boteTot, totalReceptionsGlobal, botePos, boteNeg)}
                        ${genererLigneTableau('Bote corrido', boteCorridoTot, totalReceptionsGlobal, boteCorridoPos, boteCorridoNeg)}
                        ${genererLigneTableau('Bote pronto', boteProntoTot, totalReceptionsGlobal, boteProntoPos, boteProntoNeg)}
                        ${genererLigneTableau('Erebote', ereboteTot, totalReceptionsGlobal, erebotePos, ereboteNeg)}
                        ${genererLigneTableau('Pumpa', pumpaTot, totalReceptionsGlobal, pumpaPos, pumpaNeg)}

            <div class="card-item">

                    <tbody>${htmlFrappesRows}</tbody>
                </table>
            </div>
        `;
    }

            alert("Accès refusé.");
            return;
        }

        const match = listeMatchsJoueur.find(m => m.id === matchId);
        if (!match) return;

        const nouveauStatsJoueur = {

            ptsGagnes: Number(document.getElementById('editPtsGagnes').value || 0),
            ptsGagnesTotaux: Number(document.getElementById('editPtsGagnesTotaux').value || 50),

            aireTotal: Number(document.getElementById('editAireTotal').value || 0),
            airePositif: Number(document.getElementById('editAirePos').value || 0),
            aireNegatif: Number(document.getElementById('editAireNeg').value || 0),

            botePositif: Number(document.getElementById('editBotePos').value || 0),
            boteNegatif: Number(document.getElementById('editBoteNeg').value || 0),
            boteCorridoTotal: Number(document.getElementById('editBoteCorridoTotal').value || 0),
            boteCorridoPositif: Number(document.getElementById('editBoteCorridoPos').value || 0),
            boteCorridoNegatif: Number(document.getElementById('editBoteCorridoNeg').value || 0),
            boteProntoTotal: Number(document.getElementById('editBoteProntoTotal').value || 0),
            boteProntoPositif: Number(document.getElementById('editBoteProntoPos').value || 0),
            boteProntoNegatif: Number(document.getElementById('editBoteProntoNeg').value || 0),
            ereboteTotal: Number(document.getElementById('editEreboteTotal').value || 0),
            erebotePositif: Number(document.getElementById('editErebotePos').value || 0),
            ereboteNegatif: Number(document.getElementById('editEreboteNeg').value || 0),
            pumpa: Number(document.getElementById('editPumpaTotal').value || 0),
            pumpaPositif: Number(document.getElementById('editPumpaPos').value || 0),
            pumpaNegatif: Number(document.getElementById('editPumpaNeg').value || 0),

            frappesClassiquesTotal: Number(document.getElementById('editFrappesClassiquesTotal').value || 0),
            frappesClassiquesPos: Number(document.getElementById('editFrappesClassiquesPos').value || 0),
            frappesClassiquesNeutre: Number(document.getElementById('editFrappesClassiquesNeutre').value || 0),
            frappesClassiquesNeg: Number(document.getElementById('editFrappesClassiquesNeg').value || 0),
            frappesAttaqueTotal: Number(document.getElementById('editFrappesAttaqueTotal').value || 0),
            frappesAttaquePos: Number(document.getElementById('editFrappesAttaquePos').value || 0),
            frappesAttaqueNeutre: Number(document.getElementById('editFrappesAttaqueNeutre').value || 0),
            frappesAttaqueNeg: Number(document.getElementById('editFrappesAttaqueNeg').value || 0),
            picadaTotal: Number(document.getElementById('editPicadaTotal').value || 0),
            picadaPos: Number(document.getElementById('editPicadaPos').value || 0),
            picadaNeutre: Number(document.getElementById('editPicadaNeutre').value || 0),
            picadaNeg: Number(document.getElementById('editPicadaNeg').value || 0),
            dejadaTotal: Number(document.getElementById('editDejadaTotal').value || 0),
            dejadaPos: Number(document.getElementById('editDejadaPos').value || 0),
            dejadaNeutre: Number(document.getElementById('editDejadaNeutre').value || 0),
            dejadaNeg: Number(document.getElementById('editDejadaNeg').value || 0),
            txikTxakTotal: Number(document.getElementById('editTxikTxakTotal').value || 0),

            txikTxakNeutre: Number(document.getElementById('editTxikTxakNeutre').value || 0),

            txulaTotal: Number(document.getElementById('editTxulaTotal').value || 0),

            const matchRef = doc(db, "matchs", matchId);

                statsParJoueur: match.statsParJoueur
            });
            
            alert("Toutes les statistiques ont été enregistrées avec succès !");

    window.supprimerPartieActive = async function() {
        if (localStorage.getItem('cesta_user_role') !== 'admin') return;
        const matchId = matchActifId;
        if (confirm("Voulez-vous supprimer cette partie ?")) {
            await deleteDoc(doc(db, "matchs", matchId));
            initialiserPageJoueur();
        }
    };

    function calculerEtAfficherTotales() {
        let tp = 0, tpt = 0, tg = 0, tgt = 0, tpv = 0, tpvt = 0, bTot = 0, cdSum = 0;
        let aireTot = 0, airePos = 0, aireNeg = 0;
        let boteTot = 0, botePos = 0, boteNeg = 0;
        let boteCorridoTot = 0, boteCorridoPos = 0, boteCorridoNeg = 0;
        let boteProntoTot = 0, boteProntoPos = 0, boteProntoNeg = 0;
        let ereboteTot = 0, erebotePos = 0, ereboteNeg = 0;
        let pumpaTot = 0, pumpaPos = 0, pumpaNeg = 0;

        const cumulFrappes = {
            "Classique": { total: 0, pos: 0, neutre: 0, neg: 0 },
            "Attaque": { total: 0, pos: 0, neutre: 0, neg: 0 },
            "Picada": { total: 0, pos: 0, neutre: 0, neg: 0 },
            "Dejada": { total: 0, pos: 0, neutre: 0, neg: 0 },
            "Txik Txak": { total: 0, pos: 0, neutre: 0, neg: 0 },
            "Txula": { total: 0, pos: 0, neutre: 0, neg: 0 },
            "Cortada": { total: 0, pos: 0, neutre: 0, neg: 0 },
            "Gauche gauche": { total: 0, pos: 0, neutre: 0, neg: 0 },
            "Gauche droite": { total: 0, pos: 0, neutre: 0, neg: 0 },
            "2 Murs": { total: 0, pos: 0, neutre: 0, neg: 0 }
        };

        const nb = listeMatchsJoueur.length;

        listeMatchsJoueur.forEach(m => {
            const st = statsParMatchGlobal[m.id] || {};
            tp += Number(st.pelotesJouees || 0);
            tpt += Number(st.pelotesTotales || 100);
            tg += Number(st.ptsGagnes || st.pointsGagnes || 0);
            tgt += Number(st.ptsGagnesTotaux || 50);
            tpv += Number(st.ptsPerdus || st.pointsPerdus || 0);
            tpvt += Number(st.ptsPerdusTotaux || 50);
            bTot += Number(st.butsTotal || 0);
            cdSum += Number(st.receptionsCoupDroitPct || st.coupDroitPct || 50);

            aireTot += Number(st.aireTotal || 0); 
            airePos += Number(st.airePositif || st.airePos || 0); 
            aireNeg += Number(st.aireNegatif || st.aireNeg || 0);

            boteTot += Number(st.boteTotal || 0); 
            botePos += Number(st.botePositif || st.botePos || 0); 
            boteNeg += Number(st.boteNegatif || st.boteNeg || 0);

            boteCorridoTot += Number(st.boteCorridoTotal || 0); 
            boteCorridoPos += Number(st.boteCorridoPositif || st.boteCorridoPos || 0); 
            boteCorridoNeg += Number(st.boteCorridoNegatif || st.boteCorridoNeg || 0);

            boteProntoTot += Number(st.boteProntoTotal || 0); 
            boteProntoPos += Number(st.boteProntoPositif || st.boteProntoPos || 0); 
            boteProntoNeg += Number(st.boteProntoNegatif || st.boteProntoNeg || 0);

            ereboteTot += Number(st.ereboteTotal || 0); 
            erebotePos += Number(st.erebotePositif || st.erebotePos || 0); 
            ereboteNeg += Number(st.ereboteNegatif || st.ereboteNeg || 0);

            pumpaTot += Number(st.pumpaTotal || st.pumpa || 0); 
            pumpaPos += Number(st.pumpaPositif || st.pumpaPos || 0); 
            pumpaNeg += Number(st.pumpaNegatif || st.pumpaNeg || 0);

            cumulFrappes["Classique"].total += Number(st.frappesClassiquesTotal || 0); cumulFrappes["Classique"].pos += Number(st.frappesClassiquesPos || 0); cumulFrappes["Classique"].neutre += Number(st.frappesClassiquesNeutre || 0); cumulFrappes["Classique"].neg += Number(st.frappesClassiquesNeg || 0);
            cumulFrappes["Attaque"].total += Number(st.frappesAttaqueTotal || 0); cumulFrappes["Attaque"].pos += Number(st.frappesAttaquePos || 0); cumulFrappes["Attaque"].neutre += Number(st.frappesAttaqueNeutre || 0); cumulFrappes["Attaque"].neg += Number(st.frappesAttaqueNeg || 0);
            cumulFrappes["Picada"].total += Number(st.picadaTotal || 0); cumulFrappes["Picada"].pos += Number(st.picadaPos || 0); cumulFrappes["Picada"].neutre += Number(st.picadaNeutre || 0); cumulFrappes["Picada"].neg += Number(st.picadaNeg || 0);
            cumulFrappes["Dejada"].total += Number(st.dejadaTotal || 0); cumulFrappes["Dejada"].pos += Number(st.dejadaPos || 0); cumulFrappes["Dejada"].neutre += Number(st.dejadaNeutre || 0); cumulFrappes["Dejada"].neg += Number(st.dejadaNeg || 0);
            cumulFrappes["Txik Txak"].total += Number(st.txikTxakTotal || 0); cumulFrappes["Txik Txak"].pos += Number(st.txikTxakPos || 0); cumulFrappes["Txik Txak"].neutre += Number(st.txikTxakNeutre || 0); cumulFrappes["Txik Txak"].neg += Number(st.txikTxakNeg || 0);
            cumulFrappes["Txula"].total += Number(st.txulaTotal || 0); cumulFrappes["Txula"].pos += Number(st.txulaPos || 0); cumulFrappes["Txula"].neutre += Number(st.txulaNeutre || 0); cumulFrappes["Txula"].neg += Number(st.txulaNeg || 0);
            cumulFrappes["Cortada"].total += Number(st.cortadaTotal || 0); cumulFrappes["Cortada"].pos += Number(st.cortadaPos || 0); cumulFrappes["Cortada"].neutre += Number(st.cortadaNeutre || 0); cumulFrappes["Cortada"].neg += Number(st.cortadaNeg || 0);
            cumulFrappes["Gauche gauche"].total += Number(st.gaucheGaucheTotal || 0); cumulFrappes["Gauche gauche"].pos += Number(st.gaucheGauchePos || 0); cumulFrappes["Gauche gauche"].neutre += Number(st.gaucheGaucheNeutre || 0); cumulFrappes["Gauche gauche"].neg += Number(st.gaucheGaucheNeg || 0);
            cumulFrappes["Gauche droite"].total += Number(st.gaucheDroiteTotal || 0); cumulFrappes["Gauche droite"].pos += Number(st.gaucheDroitePos || 0); cumulFrappes["Gauche droite"].neutre += Number(st.gaucheDroiteNeutre || 0); cumulFrappes["Gauche droite"].neg += Number(st.gaucheDroiteNeg || 0);
            cumulFrappes["2 Murs"].total += Number(st.deuxMursTotal || 0); cumulFrappes["2 Murs"].pos += Number(st.deuxMursPos || 0); cumulFrappes["2 Murs"].neutre += Number(st.deuxMursNeutre || 0); cumulFrappes["2 Murs"].neg += Number(st.deuxMursNeg || 0);
        });

        const avgCd = nb > 0 ? Math.round(cdSum / nb) : 50;
        const totalReceptionsGlobal = aireTot + boteTot + boteCorridoTot + boteProntoTot + ereboteTot + pumpaTot;
        const totalFrappesGlobal = Object.values(cumulFrappes).reduce((acc, f) => acc + f.total, 0);

        let htmlFrappesRows = Object.keys(cumulFrappes).map(nom => {
            let f = cumulFrappes[nom];
            return genererLigneTableauFrappes(nom, f.total, totalFrappesGlobal, f.pos, f.neutre, f.neg);
        }).join('');

        const containerTotales = document.getElementById('detailsTotalesContainer');
        if (!containerTotales) return;

        containerTotales.innerHTML = `
            <div class="full-match-title-box">Cumul global pour ${joueur.prenom} ${joueur.nom} (${nb} parties)</div>
            
            <div class="card-item">
                <div class="item-title">🥎 Pelotes & Points (Cumul)</div>
                <table class="stat-table">
                    <thead><tr><th>Statistique</th><th>Joueur</th><th>Total</th><th>%</th></tr></thead>
                    <tbody>
                        <tr><td><strong>Pelotes jouées</strong></td><td>${tp}</td><td>${tpt}</td><td><strong>${calcPct(tp, tpt)}</strong></td></tr>
                        <tr><td><strong>Points gagnés</strong></td><td style="color:#10B981;">${tg}</td><td>${tgt}</td><td style="color:#10B981;"><strong>${calcPct(tg, tgt)}</strong></td></tr>
                        <tr><td><strong>Points perdus</strong></td><td style="color:#EF4444;">${tpv}</td><td>${tpvt}</td><td style="color:#EF4444;"><strong>${calcPct(tpv, tpvt)}</strong></td></tr>
                    </tbody>
                </table>
            </div>

            <div class="card-item">
                <div class="item-title">🎯 Buts (Cumul) : <strong>${bTot}</strong></div>
            </div>

            <div class="card-item">
                <div class="item-title">📊 Répartition moyenne</div>
                <div class="side-labels"><span style="color: var(--accent-color);">🟢 Coup Droit : ${avgCd}%</span><span style="color: #3b82f6;">🔵 Revers : ${100 - avgCd}%</span></div>
                <div class="side-bar-container" style="margin-top:6px;">
                    <div class="side-bar-track">
                        <div class="side-bar-forehand" style="width: ${avgCd}%;"></div>
                        <div class="side-bar-backhand" style="width: ${100 - avgCd}%;"></div>
                    </div>
                </div>
            </div>

            <div class="card-item">
                <div class="item-title">📥 Réceptions (Cumul)</div>
                <table class="stat-table">
                    <thead><tr><th>Type</th><th>Tot</th><th>%</th><th>Pos</th><th>Neg</th></tr></thead>
                    <tbody>
                        ${genererLigneTableau('Aire', aireTot, totalReceptionsGlobal, airePos, aireNeg)}
                        ${genererLigneTableau('Bote', boteTot, totalReceptionsGlobal, botePos, boteNeg)}
                        ${genererLigneTableau('Bote corrido', boteCorridoTot, totalReceptionsGlobal, boteCorridoPos, boteCorridoNeg)}
                        ${genererLigneTableau('Bote pronto', boteProntoTot, totalReceptionsGlobal, boteProntoPos, boteProntoNeg)}
                        ${genererLigneTableau('Erebote', ereboteTot, totalReceptionsGlobal, erebotePos, ereboteNeg)}
                        ${genererLigneTableau('Pumpa', pumpaTot, totalReceptionsGlobal, pumpaPos, pumpaNeg)}
                    </tbody>
                </table>
            </div>

            <div class="card-item">
                <div class="item-title">⚡ Frappes (Cumul)</div>
                <table class="stat-table">
                    <thead><tr><th>Type</th><th>Tot</th><th>%</th><th>Pos</th><th>Neutre</th><th>Neg</th></tr></thead>
                    <tbody>${htmlFrappesRows}</tbody>
                </table>
            </div>
        `;
    }

    initialiserPageJoueur();
</script>
