<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparaison des Joueurs - PPC Estapunta</title>
    
    <!-- Polices -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Fichier de styles global -->

    <style>
        /* Conteneur principal étroit */
        .mobile-container {
            max-width: 520px !important;
            width: 100%;
            margin: 0 auto;
            padding: 10px;
            box-sizing: border-box;
        }

        .section-title { font-size: 0.82rem; color: var(--accent-color); text-transform: uppercase; font-weight: 700; margin-bottom: 8px; letter-spacing: 0.5px; }

        /* Écran de restriction d'accès */
        .access-guard-card {
            background: var(--card-bg);
            border: 2px solid var(--card-border);
            border-radius: 16px;
            padding: 24px 16px;
            text-align: center;
            margin-top: 20px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .access-guard-icon {
            font-size: 1.8rem;
            color: var(--accent-color);
        }
        .access-guard-title {
            font-size: 0.92rem;
            font-weight: 700;
            color: var(--container-text);
        }
        .access-guard-desc {
            font-size: 0.76rem;
            color: var(--text-muted);
            line-height: 1.35;
            max-width: 320px;
        }
        .access-guard-btn {
            margin-top: 4px;
            display: inline-block;
            padding: 8px 14px;
            border-radius: 10px;
            background: var(--accent-color);
            color: #000;
            font-weight: 700;
            font-size: 0.76rem;
            text-decoration: none;
        }

        /* Conteneur de filtres sur 2 lignes */
        .filters-wrapper {
            display: flex;
            flex-direction: column;
            gap: 5px;
            max-width: 440px;
            margin-left: auto;
            margin-right: auto;
            margin-bottom: 12px;
        }
        .filter-container { display: flex; gap: 5px; background: var(--card-bg); padding: 4px; border-radius: 12px; border: 2px solid var(--card-border); box-shadow: 0 4px 12px rgba(23, 184, 144, 0.2); }
        .filter-btn { flex: 1; padding: 5px 4px; text-align: center; font-size: 0.7rem; font-weight: 600; border-radius: 8px; border: none; background: transparent; color: var(--container-text); cursor: pointer; transition: all 0.25s; }
        .filter-btn.active { background: var(--accent-color); color: #000; box-shadow: 0 2px 8px rgba(23, 184, 144, 0.4); }

        /* Grille en 2 colonnes conservée, avec espacements resserrés */
        .players-list { 
            display: grid; 
            grid-template-columns: repeat(2, minmax(0, 1fr)); 
            gap: 9px; 
            align-items: stretch; 
        }

        /* Carte compactée en hauteur */
        .player-card { 
            background: var(--card-bg); 
            border: 1.5px solid var(--card-border); 
            border-radius: 12px; 
            padding: 10px 9px; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            height: 100%; 
            width: 100%;
            box-sizing: border-box;
            color: var(--container-text); 
            box-shadow: 0 4px 10px rgba(23, 184, 144, 0.14); 
            transition: all 0.22s ease; 
            text-decoration: none;
            cursor: pointer; 
        }
        .player-card:hover { border-color: var(--accent-color); background: var(--card-hover-bg); transform: translateY(-2px); text-decoration: none; color: var(--container-text); }
        
        .player-card-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 7px; gap: 6px; }
        .player-info-left { display: flex; align-items: flex-start; gap: 7px; overflow: hidden; flex: 1; min-width: 0; }
        
        .player-photo { 
            width: 50px; 
            height: 50px; 
            border-radius: 6px; 
            object-fit: cover; 
            border: 1.5px solid var(--accent-color); 
            background: rgba(0,0,0,0.2); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            color: var(--accent-color); 
            font-weight: bold; 
            flex-shrink: 0; 
            font-size: 0.8rem; 
        }

        .player-details-vertical { 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
            width: 100%;
            min-width: 0;
            gap: 2px;
        }
        .player-name-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 3px;
        }
        .player-name { font-weight: 700; font-size: 0.74rem; color: var(--container-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.15; }
        .player-source-tag {
            font-size: 0.48rem;
            font-weight: 700;
            text-transform: uppercase;
            padding: 1px 4px;
            border-radius: 4px;
            flex-shrink: 0;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            background: rgba(23, 184, 144, 0.14);
        }
        .player-source-tag.autre {
            border-color: var(--text-muted);
            color: var(--text-muted);
            background: rgba(148, 163, 184, 0.12);
        }
        .player-club { font-size: 0.52rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.15; }
        
        .player-bottom-row {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 4px;
            margin-top: 2px;
        }
        .player-poste { font-size: 0.6rem; color: var(--accent-color); font-weight: 700; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.1; }
        
        .note-badge { font-size: 1.25rem; font-weight: 800; color: var(--accent-color); line-height: 1; flex-shrink: 0; text-align: right; }
        .note-badge span { font-size: 0.52rem; color: var(--text-muted); font-weight: normal; }

        /* Bandeau bilan resserré */
        .stats-grid-mini { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; text-align: center; background: rgba(0, 0, 0, 0.22); padding: 5px 4px; border-radius: 7px; border: 1px solid var(--card-border); margin-bottom: 6px; font-size: 0.68rem; }
        .stats-grid-mini span { display: block; line-height: 1.15; }
        .stats-label { color: var(--text-muted); font-size: 0.5rem; margin-bottom: 1px; text-transform: uppercase; }

        /* Lignes de statistiques avec espacement réduit */
        .metrics-details { font-size: 0.64rem; color: var(--container-text); display: flex; flex-direction: column; gap: 0; }
        .metric-row { display: flex; justify-content: space-between; align-items: center; padding: 3px 2px; border-bottom: 1px solid rgba(255, 255, 255, 0.06); gap: 4px; min-height: 20px; }
        .metric-row:last-child { border-bottom: none; }
        .metric-label { color: var(--text-muted); font-weight: 600; font-size: 0.61rem; line-height: 1.15; }
        .metric-values { text-align: right; line-height: 1.2; display: inline-flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: 3px; font-size: 0.63rem; }
        .stat-pill {
            display: inline-block;
            padding: 0.5px 4px;
            border-radius: 5px;
            font-weight: 700;
            font-size: 0.59rem;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            line-height: 1.2;
        }
        .stat-pill-pos {
            color: #34d399;
            background: rgba(52, 211, 153, 0.12);
            border-color: rgba(52, 211, 153, 0.28);
        }
        .stat-pill-neg {
            color: #f87171;
            background: rgba(248, 113, 113, 0.12);
            border-color: rgba(248, 113, 113, 0.28);
        }
        .stat-sep {
            color: var(--text-muted);
            font-weight: 500;
            font-size: 0.58rem;
        }

        .metric-row-stacked {
            flex-direction: column;
            align-items: flex-start;
            padding: 3px 2px;
        }
        .metric-row-stacked .metric-values {
            width: 100%;
            justify-content: flex-end;
            margin-top: 1px;
        }

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBTujsGZneEGx1_V27zgRNf9-qM9zFFHQA",
        authDomain: "ppcestapunta64500.firebaseapp.com",
        projectId: "ppcestapunta64500",
        storageBucket: "ppcestapunta64500.firebasestorage.app",
        messagingSenderId: "80945272911",
        appId: "1:80945272911:web:154437e054b190e7ebb23a",
        measurementId: "G-SCYGWMW7VF"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    window.matchsCloudCharges = [];
    window.joueursFirebaseCharges = [];

    // Gestion du thème sombre/clair
    const savedTheme = localStorage.getItem('cesta_theme') || 'dark';
    const htmlElement = document.documentElement;
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    htmlElement.setAttribute('data-theme', savedTheme);
    updateButtonIcon(savedTheme);

    window.toggleTheme = function() {
        const currentTheme = htmlElement.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        htmlElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('cesta_theme', newTheme);
        updateButtonIcon(newTheme);
    }

    function updateButtonIcon(theme) {
        if (theme === 'light') {
            themeToggleBtn.innerHTML = '☀';
        } else {
            themeToggleBtn.innerHTML = '🌙';
        }
    }

    function genererCartesJoueurs() {
        if (typeof joueursData === 'undefined') return;

        const gridAvants = document.getElementById('grid-avants');
        const gridArrieres = document.getElementById('grid-arrieres');
        
        if (!gridAvants || !gridArrieres) return;

        gridAvants.innerHTML = '';
        gridArrieres.innerHTML = '';

        joueursData.forEach(joueur => {
            const joueurId = joueur.id || joueur.firebaseId || joueur.docId;

            // Ignorer l'affichage si le joueur est à la retraite (statut == "retraite" ou retraite == true)
            if (joueur.statut === "retraite" || joueur.retraite === true) {
                return;
            }

            const joueursLocauxRaw = localStorage.getItem('joueurs_locaux') || localStorage.getItem('joueurs') || '[]';
            let idsLocaux = [];
            try {
                const parsed = JSON.parse(joueursLocauxRaw);
                idsLocaux = Array.isArray(parsed) ? parsed.map(item => String(typeof item === 'object' ? (item.id || item.firebaseId || item.docId) : item)) : [];
            } catch(e) {
                idsLocaux = [];
            }

            const estEnLocal = idsLocaux.includes(String(joueurId)) || localStorage.getItem(`joueur_${joueurId}`) !== null;
            
            if (!estEnLocal && idsLocaux.length > 0) {
                return;
            }

            const posteLower = (joueur.poste || joueur.specialite || "").toLowerCase();
            const estAvant = posteLower.includes('avant');
            const initiales = `${joueur.prenom ? joueur.prenom.charAt(0) : ''}${joueur.nom ? joueur.nom.charAt(0) : ''}`;
            const posteTexte = joueur.poste || joueur.specialite || 'Joueur';
            const clubTexte = joueur.club || 'Indépendant';

            const carteHTML = `
            <a href="detail-joueur.html?id=${joueurId}" class="player-card" data-id="${joueurId}" data-est-avant="${estAvant}">
                <div class="player-card-header">
                    <img src="ICP.png" alt="Logo ICP" class="logo-icp">
                    <div class="player-info-left">
                        ${joueur.photo ? `<img src="${joueur.photo}" alt="${joueur.nom}" class="player-photo" onerror="this.onerror=null; this.src='logoce.png';">` : `<div class="player-photo">${initiales}</div>`}
                        <div class="player-details-vertical">
                            <div class="player-name-row"><div class="player-name">${joueur.prenom} ${joueur.nom}</div></div>
                            <div class="player-club">${clubTexte}</div>
                            <div class="player-bottom-row">
                                <div class="player-poste">${posteTexte}</div>
                                <span class="note-badge note-100">0<span>/100</span></span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Statistiques clés -->
                <div class="stats-grid-mini">
                    <div>
                        <span class="stats-label">Parties</span>
                        <span class="nb-matchs font-bold text-white" style="font-size: 0.8rem;">0</span>
                    </div>
                    <div>
                        <span class="stats-label">Victoires</span>
                        <span class="nb-victoires font-bold" style="color: #34d399; font-size: 0.8rem;">0</span>
                    </div>
                    <div>
                        <span class="stats-label">Défaites</span>
                        <span class="nb-defaites font-bold" style="color: #f87171; font-size: 0.8rem;">0</span>
                    </div>
                </div>

                <!-- Détails métriques avec pastilles de couleurs comme dans cartes_2.html et les 3 dernières lignes -->
                <div class="metrics-details">
                    <div class="metric-row">
                        <span class="metric-label">Pelotes (Moy/Tot/%):</span>
                        <span class="metric-values">
                            <strong class="pelotes-moy">0</strong>
                            <span class="stat-sep">(</span><span class="stat-pill pelotes-tot">0</span><span class="stat-sep">)</span>
                            <span class="stat-pill stat-pill-pos pelotes-pct">0%</span>

    async function chargerDonneesEtCalculer() {
        genererCartesJoueurs();
        try {
            // Charger les matchs depuis Firebase
            const querySnapshot = await getDocs(collection(db, "matchs"));
            querySnapshot.forEach((docSnap) => {
                const data = docSnap.data();
                window.matchsCloudCharges.push({
                    id: docSnap.id,

                    equipe1: data.equipe1 || "",
                    equipe2: data.equipe2 || "",
                    scoreEquipe1: data.scoreEquipe1 !== undefined ? data.scoreEquipe1 : data.equipe1Score,
                    scoreEquipe2: data.scoreEquipe2 !== undefined ? data.scoreEquipe2 : data.equipe2Score,
                    joueurId: data.joueurId || null,
                    statsParJoueur: data.statsParJoueur || null,
                    stats: data.stats || data
                });

            // Charger les autres joueurs depuis une collection Firebase "joueurs" si elle existe
            const joueursSnap = await getDocs(collection(db, "joueurs"));

        }

        calculerToutesLesStatsJoueurs();
    }

    function determinerVainqueur(s1, s2) {
        if (s1 === undefined || s2 === undefined) return 0;
        let str1 = String(s1).trim();
        let str2 = String(s2).trim();

        let sets1 = str1.split(/[\/\s-]+/).map(Number).filter(n => !isNaN(n));
        let sets2 = str2.split(/[\/\s-]+/).map(Number).filter(n => !isNaN(n));

        if (sets1.length > 0 && sets2.length > 0) {
            let wins1 = 0, wins2 = 0;
            for (let i = 0; i < Math.min(sets1.length, sets2.length); i++) {
                if (sets1[i] > sets2[i]) wins1++;
                else if (sets2[i] > sets1[i]) wins2++;
            }
            if (wins1 > wins2) return 1;
            if (wins2 > wins1) return 2;
            let sum1 = sets1.reduce((a, b) => a + b, 0);
            let sum2 = sets2.reduce((a, b) => a + b, 0);
            if (sum1 > sum2) return 1;
            if (sum2 > sum1) return 2;
        }

        let num1 = parseFloat(str1);
        let num2 = parseFloat(str2);
        if (!isNaN(num1) && !isNaN(num2)) {
            if (num1 > num2) return 1;
            if (num2 > num1) return 2;
        }
        return 0;
    }

    function obtenirMatchsEnrichisPourJoueur(jId, jObj) {
        const listeMatchs = window.matchsCloudCharges || [];
        const currentIdStr = String(jId).trim().toLowerCase();
        const nomJoueur = (jObj.nom || "").trim().toLowerCase();
        const prenomJoueur = (jObj.prenom || "").trim().toLowerCase();

        return listeMatchs.map(match => {
            let sourceBrute = {};
            if (match.statsParJoueur) {
                let foundKey = Object.keys(match.statsParJoueur).find(k => {
                    const keyLower = String(k).trim().toLowerCase();
                    return keyLower === currentIdStr || keyLower === nomJoueur || keyLower === prenomJoueur;
                });
                if (foundKey) sourceBrute = match.statsParJoueur[foundKey];
            }
            if (!Object.keys(sourceBrute).length) {
                sourceBrute = { ...(match.stats || {}), ...match };
            }

            const e1 = (match.equipe1 || "").toLowerCase();
            const e2 = (match.equipe2 || "").toLowerCase();
            const estConcerne = (match.statsParJoueur && Object.keys(match.statsParJoueur).some(k => String(k).toLowerCase() === currentIdStr || String(k).toLowerCase() === nomJoueur)) ||
                                (match.joueurId && String(match.joueurId).toLowerCase() === currentIdStr) ||
                                (nomJoueur && (e1.includes(nomJoueur) || e2.includes(nomJoueur))) ||
                                (prenomJoueur && (e1.includes(prenomJoueur) || e2.includes(prenomJoueur)));

            if (!estConcerne) return null;

            let eqJoueur = 1;
            if ((nomJoueur && e2.includes(nomJoueur)) || (prenomJoueur && e2.includes(prenomJoueur))) {
                eqJoueur = 2;
            }

            const s1 = match.scoreEquipe1 !== undefined ? match.scoreEquipe1 : match.equipe1Score;
            const s2 = match.scoreEquipe2 !== undefined ? match.scoreEquipe2 : match.equipe2Score;
            const vainqueur = determinerVainqueur(s1, s2);
            let resultat = 'N'; 
            if (vainqueur !== 0) {
                resultat = (vainqueur === eqJoueur) ? 'V' : 'D';
            }

            const aireTot = Number(sourceBrute.aireTotal || 0);
            const airePos = Number(sourceBrute.airePositif || 0);
            const aireNeg = Number(sourceBrute.aireNegatif || 0);
            const boteTot = Number(sourceBrute.boteTotal || 0);
            const botePos = Number(sourceBrute.botePositif || 0);
            const boteNeg = Number(sourceBrute.boteNegatif || 0);
            const boteCorridoTot = Number(sourceBrute.boteCorridoTotal || 0);
            const boteCorridoPos = Number(sourceBrute.boteCorridoPositif || 0);
            const boteCorridoNeg = Number(sourceBrute.boteCorridoNegatif || 0);
            const boteProntoTot = Number(sourceBrute.boteProntoTotal || 0);
            const boteProntoPos = Number(sourceBrute.boteProntoPositif || 0);
            const boteProntoNeg = Number(sourceBrute.boteProntoNegatif || 0);
            const ereboteTot = Number(sourceBrute.ereboteTotal || 0);
            const erebotePos = Number(sourceBrute.erebotePositif || 0);
            const ereboteNeg = Number(sourceBrute.ereboteNegatif || 0);
            const pumpaTot = Number(sourceBrute.pumpa || sourceBrute.pumpaTotal || 0);
            const pumpaPos = Number(sourceBrute.pumpaPositif || 0);
            const pumpaNeg = Number(sourceBrute.pumpaNegatif || 0);

            const recTot = aireTot + boteTot + boteCorridoTot + boteProntoTot + ereboteTot + pumpaTot;
            const recPos = airePos + botePos + boteCorridoPos + boteProntoPos + erebotePos + pumpaPos;
            const recNeg = aireNeg + boteNeg + boteCorridoNeg + boteProntoNeg + ereboteNeg + pumpaNeg;

            const typesFrappesKeys = [
                ['frappesClassiquesTotal', 'frappesClassiquesPos', 'frappesClassiquesNeg'],
                ['frappesAttaqueTotal', 'frappesAttaquePos', 'frappesAttaqueNeg'],
                ['picadaTotal', 'picadaPos', 'picadaNeg'],
                ['dejadaTotal', 'dejadaPos', 'dejadaNeg'],
                ['txikTxakTotal', 'txikTxakPos', 'txikTxakNeg'],
                ['txulaTotal', 'txulaPos', 'txulaNeg'],
                ['cortadaTotal', 'cortadaPos', 'cortadaNeg'],
                ['gaucheGaucheTotal', 'gaucheGauchePos', 'gaucheGaucheNeg'],
                ['gaucheDroiteTotal', 'gaucheDroitePos', 'gaucheDroiteNeg'],
                ['deuxMursTotal', 'deuxMursPos', 'deuxMursNeg']
            ];

            let fTot = 0, fPos = 0, fNeg = 0;
            typesFrappesKeys.forEach(([tKey, pKey, nKey]) => {
                fTot += Number(sourceBrute[tKey] || 0);
                fPos += Number(sourceBrute[pKey] || 0);
                fNeg += Number(sourceBrute[nKey] || 0);
            });

            const attaquesTot = Number(sourceBrute.frappesAttaqueTotal || sourceBrute.attaquesTotal || 0);
            const attaquesPos = Number(sourceBrute.frappesAttaquePos || sourceBrute.attaquesPositif || 0);
            const attaquesNeg = Number(sourceBrute.frappesAttaqueNeg || sourceBrute.attaquesNegatif || 0);
            const attaquesNeuRaw = sourceBrute.frappesAttaqueNeutre ?? sourceBrute.attaquesNeutre;
            const attaquesNeu = attaquesNeuRaw !== undefined ? Number(attaquesNeuRaw) : Math.max(0, attaquesTot - attaquesPos - attaquesNeg);

            const classiquesTot = Number(sourceBrute.frappesClassiquesTotal || sourceBrute.classiquesTotal || 0);
            const classiquesPos = Number(sourceBrute.frappesClassiquesPos || sourceBrute.classiquesPositif || 0);
            const classiquesNeg = Number(sourceBrute.frappesClassiquesNeg || sourceBrute.classiquesNegatif || 0);
            const classiquesNeuRaw = sourceBrute.frappesClassiquesNeutre ?? sourceBrute.classiquesNeutre;
            const classiquesNeu = classiquesNeuRaw !== undefined ? Number(classiquesNeuRaw) : Math.max(0, classiquesTot - classiquesPos - classiquesNeg);

            return {
                resultat,
                stats: {
                    pelotesJouees: Number(sourceBrute.pelotesJouees || sourceBrute.pelotes || 0),
                    pelotesTotales: Number(sourceBrute.pelotesTotales || 100),
                    ptsGagnes: Number(sourceBrute.ptsGagnes || sourceBrute.pointsGagnes || 0),
                    ptsGagnesTotaux: Number(sourceBrute.ptsGagnesTotaux || 50),
                    ptsPerdus: Number(sourceBrute.ptsPerdus || sourceBrute.pointsPerdus || 0),
                    ptsPerdusTotaux: Number(sourceBrute.ptsPerdusTotaux || 50),
                    butsTotal: Number(sourceBrute.butsTotal || sourceBrute.buts || 0),
                    butsSurArriere: Number(sourceBrute.butsSurArriere || 0),
                    butsSurAvant: Number(sourceBrute.butsSurAvant || 0),
                    recTotal: recTot,
                    recPositif: recPos,
                    recNegatif: recNeg,
                    frappesTotal: fTot,
                    frappesPositif: fPos,
                    frappesNegatif: fNeg,
                    attaquesTotal: attaquesTot,
                    attaquesNeutre: attaquesNeu,
                    attaquesPositif: attaquesPos,
                    attaquesNegatif: attaquesNeg,
                    classiquesTotal: classiquesTot,
                    classiquesNeutre: classiquesNeu,
                    classiquesPositif: classiquesPos,
                    classiquesNegatif: classiquesNeg,
                    ptsAmenesRecAdvNeg: Number(
                        sourceBrute.ptsAmenesRecAdvNeg ??
                        sourceBrute.pointsAmenesRecAdversesNegatives ??
                        sourceBrute.ptsAmenesRecNeg ??
                        sourceBrute.recAdversesNegatives ??
                        sourceBrute.receptionsAdversesNegatives ??
                        sourceBrute.ptsAmenes ??
                        0
                    ),
                    ptsAmenesRecAdvNegTotal: Number(
                        sourceBrute.ptsAmenesRecAdvNegTotal ??
                        sourceBrute.ptsAmenesTotal ??
                        0
                    )
                }
            };
        }).filter(Boolean);
    }

    function calculerToutesLesStatsJoueurs() {
        if (typeof joueursData === 'undefined') return;

        const listAvants = [];
        const listArrieres = [];

        joueursData.forEach(joueur => {
            const joueurId = joueur.id || joueur.firebaseId || joueur.docId;
            const card = document.querySelector(`[data-id="${joueurId}"]`);
            if (!card) return;

            const posteLower = (joueur.poste || joueur.specialite || "").toLowerCase();
            const estAvant = posteLower.includes('avant');

            const matchsJoueur = obtenirMatchsEnrichisPourJoueur(joueurId, joueur);
            const nbMatchs = matchsJoueur.length;
            
            let nbVictoires = matchsJoueur.filter(m => m.resultat === 'V').length;
            let nbDefaites = matchsJoueur.filter(m => m.resultat === 'D').length;

            let totalPelotesJouees = 0, totalPelotesMax = 0;
            let totalPtsGagnes = 0, totalPtsGagnesMax = 0;
            let totalPtsPerdus = 0, totalPtsPerdusMax = 0;
            let totalButs = 0, butsArriere = 0, butsAvant = 0;
            let sumRecTot = 0, sumRecPos = 0, sumRecNeg = 0;
            let sumFrappesTot = 0, sumFrappesPos = 0, sumFrappesNeg = 0;
            let sumAttaquesTot = 0, sumAttaquesNeu = 0, sumAttaquesPos = 0, sumAttaquesNeg = 0;
            let sumClassiquesTot = 0, sumClassiquesNeu = 0, sumClassiquesPos = 0, sumClassiquesNeg = 0;
            let sumPtsAmenesRecAdvNeg = 0, sumPtsAmenesRecAdvNegTotal = 0;

            matchsJoueur.forEach(m => {
                const s = m.stats;
                totalPelotesJouees += s.pelotesJouees;
                totalPelotesMax += s.pelotesTotales;
                totalPtsGagnes += s.ptsGagnes;
                totalPtsGagnesMax += s.ptsGagnesTotaux;
                totalPtsPerdus += s.ptsPerdus;
                totalPtsPerdusMax += s.ptsPerdusTotaux;
                
                totalButs += s.butsTotal;
                butsArriere += s.butsSurArriere;
                butsAvant += s.butsSurAvant;

                sumRecTot += s.recTotal;
                sumRecPos += s.recPositif;
                sumRecNeg += s.recNegatif;

                sumFrappesTot += s.frappesTotal;
                sumFrappesPos += s.frappesPositif;
                sumFrappesNeg += s.frappesNegatif;

                sumAttaquesTot += s.attaquesTotal;
                sumAttaquesNeu += s.attaquesNeutre;
                sumAttaquesPos += s.attaquesPositif;
                sumAttaquesNeg += s.attaquesNegatif;

                sumClassiquesTot += s.classiquesTotal;
                sumClassiquesNeu += s.classiquesNeutre;
                sumClassiquesPos += s.classiquesPositif;
                sumClassiquesNeg += s.classiquesNegatif;

                sumPtsAmenesRecAdvNeg += s.ptsAmenesRecAdvNeg;
                sumPtsAmenesRecAdvNegTotal += s.ptsAmenesRecAdvNegTotal;
            });

            const moyPelotes = nbMatchs > 0 ? Math.round(totalPelotesJouees / nbMatchs) : "0";
            const pctPelotes = totalPelotesMax > 0 ? Math.round((totalPelotesJouees / totalPelotesMax) * 100) : 0;

            const moyGagnes = nbMatchs > 0 ? Math.round(totalPtsGagnes / nbMatchs) : "0";
            const pctGagnes = totalPtsGagnesMax > 0 ? Math.round((totalPtsGagnes / totalPtsGagnesMax) * 100) : 0;

            const moyPerdus = nbMatchs > 0 ? Math.round(totalPtsPerdus / nbMatchs) : "0";
            const pctPerdus = totalPtsPerdusMax > 0 ? Math.round((totalPtsPerdus / totalPtsPerdusMax) * 100) : 0;

            const moyButs = nbMatchs > 0 ? Math.round(totalButs / nbMatchs) : "0";
            const pctArriere = totalButs > 0 ? Math.round((butsArriere / totalButs) * 100) : 0;
            const pctAvant = totalButs > 0 ? Math.round((butsAvant / totalButs) * 100) : 0;
            
            const moyFrappes = nbMatchs > 0 ? Math.round(sumFrappesTot / nbMatchs) : "0";
            const pctFrappesPos = sumFrappesTot > 0 ? Math.round((sumFrappesPos / sumFrappesTot) * 100) : 0;

            const moyRec = nbMatchs > 0 ? Math.round(sumRecTot / nbMatchs) : "0";
            const pctRecPos = sumRecTot > 0 ? Math.round((sumRecPos / sumRecTot) * 100) : 0;

            // Calcul de la note brute de base
            let noteBrute = nbMatchs > 0 ? Math.round((nbVictoires / nbMatchs) * 60 + pctGagnes * 0.4 + 15) : 0;
            
            // Bonus spécifique appliqué uniquement aux arrières (+8 points)
            const bonusArriere = !estAvant ? 8 : 0;
            let note100 = nbMatchs > 0 ? Math.min(100, Math.max(40, noteBrute + bonusArriere)) : 0;

            card.querySelector('.note-100').innerHTML = `${note100}<span>/100</span>`;
            card.querySelector('.nb-matchs').textContent = nbMatchs;
            card.querySelector('.nb-victoires').textContent = nbVictoires;
            card.querySelector('.nb-defaites').textContent = nbDefaites;

            card.querySelector('.pelotes-moy').textContent = moyPelotes;
            card.querySelector('.pelotes-tot').textContent = totalPelotesJouees;
            card.querySelector('.pelotes-pct').textContent = `${pctPelotes}%`;

            card.querySelector('.gagnes-moy').textContent = moyGagnes;
            card.querySelector('.gagnes-tot').textContent = totalPtsGagnes;
            card.querySelector('.gagnes-pct').textContent = `${pctGagnes}%`;

            card.querySelector('.perdus-moy').textContent = moyPerdus;
            card.querySelector('.perdus-tot').textContent = totalPtsPerdus;
            card.querySelector('.perdus-pct').textContent = `${pctPerdus}%`;

            if (estAvant) {
                card.querySelector('.buts-moy').textContent = moyButs;
                card.querySelector('.buts-arr-pct').textContent = `${pctArriere}%`;
                card.querySelector('.buts-av-pct').textContent = `${pctAvant}%`;
            }

            card.querySelector('.frappes-moy').textContent = moyFrappes;
            card.querySelector('.frappes-pos').textContent = sumFrappesPos;
            card.querySelector('.frappes-neg').textContent = sumFrappesNeg;
            card.querySelector('.frappes-pct').textContent = `${pctFrappesPos}%`;

            card.querySelector('.rec-moy').textContent = moyRec;
            card.querySelector('.rec-pos').textContent = sumRecPos;
            card.querySelector('.rec-neg').textContent = sumRecNeg;
            card.querySelector('.rec-pct').textContent = `${pctRecPos}%`;

            const moyParPartie = (val) => nbMatchs > 0 ? String(Math.round(val / nbMatchs)) : "0";

            card.querySelector('.cla-moy').textContent = moyParPartie(sumClassiquesTot);
            card.querySelector('.cla-neu-moy').textContent = moyParPartie(sumClassiquesNeu);
            card.querySelector('.cla-pos-moy').textContent = moyParPartie(sumClassiquesPos);
            card.querySelector('.cla-neg-moy').textContent = moyParPartie(sumClassiquesNeg);

            card.querySelector('.att-moy').textContent = moyParPartie(sumAttaquesTot);
            card.querySelector('.att-neu-moy').textContent = moyParPartie(sumAttaquesNeu);
            card.querySelector('.att-pos-moy').textContent = moyParPartie(sumAttaquesPos);
            card.querySelector('.att-neg-moy').textContent = moyParPartie(sumAttaquesNeg);

            const denomAmenes = sumPtsAmenesRecAdvNegTotal > 0 ? sumPtsAmenesRecAdvNegTotal : totalPtsGagnes;
            const pctPtsAmenesRecAdvNeg = denomAmenes > 0 ? Math.round((sumPtsAmenesRecAdvNeg / denomAmenes) * 100) : 0;
            card.querySelector('.pts-amenes-rec-adv-neg-moy').textContent = moyParPartie(sumPtsAmenesRecAdvNeg);
            card.querySelector('.pts-amenes-rec-adv-neg-pct').textContent = `${pctPtsAmenesRecAdvNeg}%`;

            if (estAvant) {
                listAvants.push({ card, note: note100 });
            } else {
                listArrieres.push({ card, note: note100 });
            }
        });

        // Tri des listes par note décroissante
        listAvants.sort((a, b) => b.note - a.note);
        listArrieres.sort((a, b) => b.note - a.note);

        const gridAvants = document.getElementById('grid-avants');
        const gridArrieres = document.getElementById('grid-arrieres');

        if (gridAvants) {
            listAvants.forEach(item => gridAvants.appendChild(item.card));
        }
        if (gridArrieres) {
            listArrieres.forEach(item => gridArrieres.appendChild(item.card));
        }
    }

    window.filterPlayers = function(type) {
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        const activeBtn = document.getElementById(`btn-${type}`);
        if (activeBtn) activeBtn.classList.add('active');

        const sectionAvants = document.getElementById('section-avants');
        const sectionArrieres = document.getElementById('section-arrieres');
        const sectionClassementPole = document.getElementById('section-classement-pole');
        const sectionClassementTous = document.getElementById('section-classement-tous');

        if(sectionAvants) sectionAvants.style.display = 'none';
        if(sectionArrieres) sectionArrieres.style.display = 'none';
        if(sectionClassementPole) sectionClassementPole.style.display = 'none';
        if(sectionClassementTous) sectionClassementTous.style.display = 'none';

        if (type === 'all') {
            if(sectionAvants) sectionAvants.style.display = 'block';
            if(sectionArrieres) sectionArrieres.style.display = 'block';
        } else if (type === 'avants') {
            if(sectionAvants) sectionAvants.style.display = 'block';
        } else if (type === 'arrieres') {
            if(sectionArrieres) sectionArrieres.style.display = 'block';
        } else if (type === 'classement-pole') {
            if(sectionClassementPole) sectionClassementPole.style.display = 'block';
            genererClassementPole();
        } else if (type === 'classement-tous') {
            if(sectionClassementTous) sectionClassementTous.style.display = 'block';
            genererClassementTous();
        }
    };

    function genererClassementPole() {
        const rankingPoleAvants = document.getElementById('ranking-pole-avants');
        const rankingPoleArrieres = document.getElementById('ranking-pole-arrieres');
        if (!rankingPoleAvants || !rankingPoleArrieres) return;

        const cardsAvants = Array.from(document.querySelectorAll('#grid-avants .player-card'));
        const cardsArrieres = Array.from(document.querySelectorAll('#grid-arrieres .player-card'));

        const buildHTML = (cards) => {
            if (cards.length === 0) return '<div style="font-size: 0.8rem; color: var(--text-muted); padding: 8px;">Aucun joueur.</div>';
            return cards.map((card, idx) => {
                const name = card.querySelector('.player-name')?.textContent || '';
                const club = card.querySelector('.player-club')?.textContent || '';
                const note = card.querySelector('.note-badge')?.innerText || '0/100';
                const matches = card.querySelector('.nb-matchs')?.textContent || '0';
                const victoires = card.querySelector('.nb-victoires')?.textContent || '0';
                const medaille = idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : `${idx + 1}.`;

                return `
                    <div style="display: flex; align-items: center; justify-content: space-between; background: var(--card-bg); border: 1px solid var(--card-border); padding: 10px 14px; border-radius: 10px;">
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <span style="font-weight: bold; font-size: 1.1rem; width: 24px; text-align: center;">${medaille}</span>
                            <div>
                                <div style="font-weight: bold; font-size: 0.85rem; color: var(--container-text);">${name}</div>
                                <div style="font-size: 0.65rem; color: var(--text-muted);">${club} • ${matches} match(s) (${victoires}V)</div>
                            </div>
                        </div>
                        <div style="font-size: 1.2rem; font-weight: 800; color: var(--accent-color);">${note}</div>
                    </div>
                `;
            }).join('');
        };

        rankingPoleAvants.innerHTML = buildHTML(cardsAvants);
        rankingPoleArrieres.innerHTML = buildHTML(cardsArrieres);
    }

    function genererClassementTous() {
        const rankingTousAvants = document.getElementById('ranking-tous-avants');
        const rankingTousArrieres = document.getElementById('ranking-tous-arrieres');
        if (!rankingTousAvants || !rankingTousArrieres) return;

        const allCards = Array.from(document.querySelectorAll('.player-card'));
        const parsedCards = allCards.map(card => {
            const name = card.querySelector('.player-name')?.textContent || '';
            const club = card.querySelector('.player-club')?.textContent || '';
            const estAvant = card.getAttribute('data-est-avant') === 'true';
            const noteStr = card.querySelector('.note-badge')?.innerText || '0/100';
            const noteVal = parseInt(noteStr) || 0;
            const matches = card.querySelector('.nb-matchs')?.textContent || '0';
            const victoires = card.querySelector('.nb-victoires')?.textContent || '0';
            return { id: card.getAttribute('data-id'), name, club, estAvant, noteVal, noteStr, matches, victoires, estDuPole: true };
        });

        (window.joueursFirebaseCharges || []).forEach(jFb => {
            if (jFb.statut === "retraite" || jFb.retraite === true) return;

            const nomComplet = `${jFb.prenom || ''} ${jFb.nom || ''}`.trim();
            if (!nomComplet) return;

            const nomNormalise = nomComplet.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, '');

            const existeDeja = parsedCards.some(p => {
                const pNorm = p.name.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, '');
                return p.id === jFb.id || pNorm === nomNormalise || (pNorm.includes('thibault') && nomNormalise.includes('thibault'));
            });

            if (!existeDeja) {
                const posteL = (jFb.poste || jFb.specialite || "").toLowerCase();
                const estAvantFb = posteL.includes('avant');
                
                const matchsFb = obtenirMatchsEnrichisPourJoueur(jFb.id, jFb);
                const nbMatchs = matchsFb.length;
                const nbVictoires = matchsFb.filter(m => m.resultat === 'V').length;
                
                let totalPtsGagnes = 0, totalPtsGagnesMax = 0;
                matchsFb.forEach(m => {
                    totalPtsGagnes += m.stats.ptsGagnes;
                    totalPtsGagnesMax += m.stats.ptsGagnesTotaux;
                });
                const pctGagnes = totalPtsGagnesMax > 0 ? Math.round((totalPtsGagnes / totalPtsGagnesMax) * 100) : 0;
                
                let noteBruteFb = nbMatchs > 0 ? Math.round((nbVictoires / nbMatchs) * 60 + pctGagnes * 0.4 + 15) : 0;
                const bonusArriereFb = !estAvantFb ? 8 : 0;
                const noteVal = nbMatchs > 0 ? Math.min(100, Math.max(40, noteBruteFb + bonusArriereFb)) : 0;
                
                parsedCards.push({
                    id: jFb.id,
                    name: nomComplet,
                    club: jFb.club || 'Firebase',
                    estAvant: estAvantFb,
                    noteVal: noteVal,
                    noteStr: `${noteVal}/100`,
                    matches: String(nbMatchs),
                    victoires: String(nbVictoires),
                    estDuPole: false
                });
            }
        });

        const avants = parsedCards.filter(p => p.estAvant).sort((a, b) => b.noteVal - a.noteVal);
        const arrieres = parsedCards.filter(p => !p.estAvant).sort((a, b) => b.noteVal - a.noteVal);

        const buildHTML = (list) => {
            if (list.length === 0) return '<div style="font-size: 0.8rem; color: var(--text-muted); padding: 8px;">Aucun joueur.</div>';
            return list.map((p, idx) => {
                const medaille = idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : `${idx + 1}.`;
                const nameStyle = p.estDuPole ? 'color: var(--accent-color); font-weight: bold;' : 'color: var(--container-text); font-weight: bold;';

                return `
                    <div style="display: flex; align-items: center; justify-content: space-between; background: var(--card-bg); border: 1px solid var(--card-border); padding: 10px 14px; border-radius: 10px;">
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <span style="font-weight: bold; font-size: 1.1rem; width: 24px; text-align: center;">${medaille}</span>
                            <div>
                                <div style="font-size: 0.85rem; ${nameStyle}">${p.name} ${p.estDuPole ? '<span style="font-size: 0.6rem; background: rgba(23, 184, 144, 0.15); padding: 1px 5px; border-radius: 4px; margin-left: 4px; border: 1px solid var(--accent-color);">Pôle</span>' : ''}</div>
                                <div style="font-size: 0.65rem; color: var(--text-muted);">${p.club} • ${p.matches} match(s) (${p.victoires}V)</div>
                            </div>
                        </div>
                        <div style="font-size: 1.2rem; font-weight: 800; color: var(--accent-color);">${p.noteStr}</div>
                    </div>
                `;
            }).join('');
        };

        rankingTousAvants.innerHTML = buildHTML(avants);
        rankingTousArrieres.innerHTML = buildHTML(arrieres);
    }
</script>
