<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cesta Punta - Calendrier & Entraînements</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <style>
        .section-title { font-size: 0.85rem; color: var(--accent-color); text-transform: uppercase; font-weight: 700; margin-bottom: 12px; letter-spacing: 0.5px; }
        
        .top-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .header-actions { display: flex; gap: 8px; align-items: center; }
        
        .home-btn, .theme-toggle-btn, .profile-btn { 
            text-decoration: none; 
            font-size: 1.1rem; 
            background: var(--card-bg); 
            border: 1px solid var(--card-border); 
            width: 38px; 
            height: 38px; 
            border-radius: 50%; 
            cursor: pointer; 
            color: var(--container-text); 
            display: inline-flex; 
            align-items: center; 
            justify-content: center; 
        }

        /* BOUTON DÉCLENCHEUR DU FORMULAIRE */
        .btn-toggle-form {
            background: linear-gradient(90deg, #047857 0%, #0d9488 45%, #14b8a6 100%);
            border: 2px solid #06b6d4;
            color: #ffffff;
            padding: 12px;
            border-radius: 14px;
            font-size: 0.85rem;
            font-weight: 800;
            cursor: pointer;
            width: 100%;
            box-sizing: border-box;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-bottom: 12px;
            box-shadow: 0 4px 14px rgba(6, 182, 212, 0.3);
            transition: all 0.2s;
        }
        .btn-toggle-form:hover {
            opacity: 0.95;
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(6, 182, 212, 0.45);
        }

        /* BLOC FORMULAIRE ÉVÉNEMENT ADMIN (Masqué par défaut) */
        .add-event-card {
            background: var(--card-bg);
            border: 2px solid var(--card-border);
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 16px;
            box-shadow: 0 4px 12px rgba(23, 184, 144, 0.2);
            display: none;
        }

        .add-event-title {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--container-text);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .form-group { margin-bottom: 10px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
        .form-label { font-size: 0.65rem; color: var(--text-muted); margin-bottom: 3px; display: block; }
        
        .form-input {
            width: 100%;
            background: rgba(15, 76, 92, 0.2);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 8px 10px;
            color: var(--container-text);
            font-size: 0.8rem;
            box-sizing: border-box;
            outline: none;
        }
        .form-input:focus { border-color: var(--accent-color); }

        .btn-save-event {
            width: 100%;
            background: linear-gradient(135deg, #0f4c5c 0%, #17b890 100%);
            border: 1px solid var(--accent-color);
            color: #ffffff;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.82rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-save-event:hover { opacity: 0.9; transform: translateY(-1px); }

        /* CALENDRIER */
        .calendar-container { background: var(--card-bg); border: 2px solid var(--card-border); border-radius: 16px; padding: 14px; margin-bottom: 16px; box-shadow: 0 4px 12px rgba(23, 184, 144, 0.2); }
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-weight: bold; color: var(--container-text); font-size: 0.9rem; }
        .cal-nav-btn { background: rgba(15, 76, 92, 0.3); border: 1px solid var(--card-border); color: var(--accent-color); padding: 4px 10px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
        .calendar-day-name { font-size: 0.65rem; color: var(--text-muted); font-weight: bold; padding-bottom: 4px; }
        .calendar-day { background: rgba(15, 76, 92, 0.1); border: 1px solid var(--card-border); border-radius: 6px; padding: 6px 2px; font-size: 0.75rem; color: var(--container-text); cursor: pointer; min-height: 36px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; transition: all 0.2s; }
        .calendar-day:hover { border-color: var(--accent-color); background: var(--card-hover-bg); }
        .calendar-day.empty { background: transparent; border: none; cursor: default; }
        
        .calendar-day.has-technique { border-color: #facc15; background: rgba(250, 204, 21, 0.25); font-weight: bold; color: #fde047; }
        .calendar-day.has-physique-co { border-color: #a855f7; background: rgba(168, 85, 247, 0.25); font-weight: bold; color: #e9d5ff; }
        .calendar-day.has-physique { border-color: #a855f7; background: rgba(168, 85, 247, 0.25); font-weight: bold; color: #e9d5ff; }
        .calendar-day.has-perso { border-color: #ef4444; background: rgba(239, 68, 68, 0.2); font-weight: bold; color: #fca5a5; }
        .calendar-day.has-match { border-color: var(--accent-color); background: rgba(23, 184, 144, 0.25); font-weight: bold; color: var(--accent-color); }
        .calendar-day.has-info { border-color: #ef4444; background: rgba(239, 68, 68, 0.15); font-weight: bold; color: #ef4444; }

        .calendar-day.selected { border: 2px solid #ffffff !important; }

        .event-dots-container { display: flex; gap: 3px; justify-content: center; align-items: center; margin-top: 3px; flex-wrap: wrap; max-width: 28px; }
        .multi-dot { width: 5px; height: 5px; border-radius: 50%; }
        .multi-dot.match { background-color: var(--accent-color); }
        .multi-dot.info { background-color: #ef4444; }
        .multi-dot.technique { background-color: #facc15; }
        .multi-dot.physique-co { background-color: #a855f7; }
        .multi-dot.physique { background-color: #a855f7; }
        .multi-dot.perso { background-color: #ef4444; }
        
        .event-count-badge { font-size: 0.55rem; background: rgba(255, 255, 255, 0.2); padding: 1px 3px; border-radius: 4px; margin-top: 2px; font-weight: bold; }

        .match-preview-box { background: rgba(15, 76, 92, 0.3); border: 1px solid var(--accent-color); border-radius: 12px; padding: 12px; margin-bottom: 16px; font-size: 0.78rem; display: none; }
        .match-preview-box.active { display: block; }

        .card-item { background: var(--card-bg); border: 2px solid var(--card-border); border-radius: 12px; padding: 12px; margin-bottom: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
        .card-item.card-info { border-color: #ef4444; }

        .item-title { font-weight: bold; font-size: 0.85rem; color: var(--container-text); margin-bottom: 2px; }
        .item-sub { font-size: 0.72rem; color: var(--text-muted); }

        .convoques-box {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px dashed rgba(255, 255, 255, 0.15);
        }
        .convoques-title {
            font-size: 0.72rem;
            font-weight: bold;
            color: var(--accent-color);
            margin-bottom: 4px;
        }
        .convoque-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.7rem;
            padding: 2px 0;
            color: var(--container-text);
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }
        .badge-present { color: #34d399; font-weight: bold; }
        .badge-absent { color: #fb7185; font-weight: bold; }
        .badge-attente { color: var(--text-muted); }

        /* BOUTONS DE PRÉSENCE */
        .presence-actions {
            margin-top: 10px;
            display: flex;
            gap: 8px;
        }
        .btn-present {
            flex: 1;
            background: rgba(52, 211, 153, 0.2);
            border: 1px solid #34d399;
            color: #34d399;
            padding: 8px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-present:hover { background: rgba(52, 211, 153, 0.35); }
        
        .btn-absent {
            flex: 1;
            background: rgba(251, 113, 133, 0.2);
            border: 1px solid #fb7185;
            color: #fb7185;
            padding: 8px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-absent:hover { background: rgba(251, 113, 133, 0.35); }

        .program-btn { 
            background: linear-gradient(90deg, #047857 0%, #0d9488 45%, #14b8a6 100%); 
            border: 2px solid #06b6d4; 
            color: #ffffff; 
            padding: 12px; 
            border-radius: 14px; 
            font-size: 0.85rem; 
            font-weight: 800; 
            cursor: pointer; 
            width: 100%; 
            box-sizing: border-box; 
            text-align: center; 
            display: block; 
            text-decoration: none; 
            margin-bottom: 12px; 
            box-shadow: 0 4px 14px rgba(6, 182, 212, 0.3); 
        }
        .program-btn:hover {
            opacity: 0.95;
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(6, 182, 212, 0.45);
        }
    </style>
</head>
<body>

<div class="mobile-container">
    <div class="top-header">
        <img src="logoce.png" alt="Logo Cesta Punta" class="logo-img" style="height: 35px;">
        <div class="header-actions">
            <a href="accueil.html" class="home-btn" title="Retour Accueil">🏠</a>
            <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()" title="Changer de thème">🌙</button>
            <a href="parametres.html" class="profile-btn" title="Mon Compte">👤</a>
        </div>
    </div>

    <hr class="separator" style="margin-bottom: 15px;">

    <!-- Boutons d'actions réservés aux admins / entraîneurs -->
    <div id="adminActionSection" style="display: none;">
        <a href="nouveau-entrainement.html" class="program-btn">+ Programmer un entraînement</a>

        <button onclick="toggleEventForm()" class="btn-toggle-form">
            <span>📅</span> + Ajouter un événement / partie
        </button>

        <div id="addEventCardAdmin" class="add-event-card">
            <div class="add-event-title">➕ Nouvel événement ou partie</div>
            
            <div class="form-group">
                <input type="text" id="eventTitleInput" class="form-input" placeholder="Titre (ex: Championnat du Pays Basque...)">
            </div>

            <div class="form-row">
                <div>
                    <span class="form-label">Date de début</span>
                    <input type="date" id="eventStartDateInput" class="form-input">
                </div>
                <div>
                    <span class="form-label">Date de fin (optionnel)</span>
                    <input type="date" id="eventEndDateInput" class="form-input">
                </div>
            </div>

            <div class="form-row">
                <div>
                    <span class="form-label">Heure de début (optionnel)</span>
                    <input type="time" id="eventStartTimeInput" class="form-input">
                </div>
                <div>
                    <span class="form-label">Heure de fin (optionnel)</span>
                    <input type="time" id="eventEndTimeInput" class="form-input">
                </div>
            </div>

            <div class="form-group">
                <input type="text" id="eventLieuInput" class="form-input" placeholder="Lieu (ex: St Jean de Luz)">
            </div>

            <div class="form-group">
                <input type="text" id="eventDescriptionInput" class="form-input" placeholder="Détail / Affiche (ex: Garcia-Basque / Garat-laborde)">
            </div>

            <button class="btn-save-event" onclick="ajouterEvenementAdmin()">Enregistrer dans le calendrier</button>
        </div>
    </div>

    <div class="section-title">Calendrier Collectif</div>

    <div class="calendar-container">
        <div class="calendar-header">
            <button class="cal-nav-btn" onclick="changerMois(-1)">◀</button>
            <span id="calendarMonthYearTitle">Mois Année</span>
            <button class="cal-nav-btn" onclick="changerMois(1)">▶</button>
        </div>
        
        <div class="calendar-grid" id="calendarGrid"></div>
    </div>

    <div id="matchPreviewBox" class="match-preview-box">
        <div class="section-title" id="selectedDateTitle" style="margin-bottom:8px;">Sessions du jour</div>
        <div id="matchPreviewContent" style="color: var(--container-text);">Sélectionnez un jour.</div>
    </div>
</div>

<script src="joueurs-data.js"></script>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, addDoc, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBTujsGZneEGx1_V27zgRNf9-qM9zFFHQA",
        authDomain: "ppcestapunta64500.firebaseapp.com",
        projectId: "ppcestapunta64500",
        storageBucket: "ppcestapunta64500.firebasestorage.app",
        messagingSenderId: "80945272911",
        appId: "1:80945272911:web:154437e054b190e7ebb23a",
        measurementId: "G-SCYGWMW7VF"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Remise à zéro immédiate du badge dynamique d'entraînements sur l'accueil au chargement de la page
    localStorage.setItem('dernier_clic_entrainements', Date.now());

    const htmlElement = document.documentElement;
    const themeToggleBtn = document.getElementById('themeToggleBtn');

    const savedTheme = localStorage.getItem('cesta_theme');
    if (savedTheme) {
        htmlElement.setAttribute('data-theme', savedTheme);
        updateButtonIcon(savedTheme);
    }

    window.toggleTheme = function() {
        const currentTheme = htmlElement.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        htmlElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('cesta_theme', newTheme);
        updateButtonIcon(newTheme);
    }

    function updateButtonIcon(theme) {
        themeToggleBtn.innerHTML = (theme === 'light') ? '☀️' : '🌙';
    }

    document.addEventListener("DOMContentLoaded", () => {
        const role = localStorage.getItem('cesta_user_role');
        const adminSection = document.getElementById('adminActionSection');
        
        if (role === 'admin' || role === 'entraineur') {
            if (adminSection) adminSection.style.display = 'block';
        } else {
            if (adminSection) adminSection.style.display = 'none';
        }
        chargerCalendrierFirebase();
    });

    window.toggleEventForm = function() {
        const card = document.getElementById('addEventCardAdmin');
        if (card) {
            card.style.display = (card.style.display === 'block') ? 'none' : 'block';
        }
    };

    let currentDate = new Date();
    let selectedDateStr = new Date().toISOString().split('T')[0];
    let calendrierCloudEvents = [];

    async function chargerCalendrierFirebase() {
        try {
            const entrainementsSnap = await getDocs(collection(db, "entrainements"));
            calendrierCloudEvents = [];
            entrainementsSnap.forEach((docSnap) => {
                calendrierCloudEvents.push({ id: docSnap.id, ...docSnap.data() });
            });

            renderCalendar();
            selectCalendarDate(selectedDateStr);
        } catch (error) {
            console.error("Erreur chargement Firebase :", error);
        }
    }

    // FONCTION DE RÉPONSE ANTI-DOUBLON AVEC MOTIF OBLIGATOIRE SI ABSENT
    window.repondreEntrainement = async function(entrainementId, statutChoisi) {
        // Récupération sécurisée du nom de l'utilisateur connecté
        let currentUser = localStorage.getItem('cesta_username') || localStorage.getItem('cesta_user_email');
        
        if (!currentUser || currentUser === "Membre") {
            currentUser = prompt("Veuillez entrer votre Prénom et Nom pour enregistrer votre réponse :");
            if (!currentUser || currentUser.trim() === "") {
                alert("Action annulée : nom requis.");
                return;
            }
            currentUser = currentUser.trim();
            localStorage.setItem('cesta_username', currentUser);
        }

        if (!entrainementId) {
            alert("Erreur : ID de l'événement manquant.");
            return;
        }

        let motifAbsence = "";
        if (statutChoisi === 'absent') {
            while (true) {
                motifAbsence = prompt("Veuillez indiquer le motif de votre absence (obligatoire) :");
                if (motifAbsence === null) {
                    return; // Annulation
                }
                if (motifAbsence.trim() !== "") {
                    motifAbsence = motifAbsence.trim();
                    break;
                }
                alert("Le motif est obligatoire pour signaler une absence.");
            }
        }

        try {
            const docRef = doc(db, "entrainements", entrainementId);
            const docSnap = await getDoc(docRef);

            if (!docSnap.exists()) {
                alert("Entraînement introuvable dans la base de données.");
                return;
            }

            const data = docSnap.data();
            let convoques = data.convoques || [];

            // Nettoyage de toutes les anciennes entrées de cet utilisateur pour éviter les doublons
            convoques = convoques.filter(c => {
                const nomEnregistre = (c.nom || "").trim().toLowerCase();
                const utilisateurActuel = currentUser.trim().toLowerCase();
                return nomEnregistre !== utilisateurActuel;
            });

            // Ajout de la nouvelle réponse unique
            convoques.push({
                nom: currentUser,
                statut: statutChoisi,
                motif: motifAbsence
            });

            await updateDoc(docRef, {
                convoques: convoques
            });

            alert("Votre réponse a bien été enregistrée !");
            chargerCalendrierFirebase();

        } catch (error) {
            console.error("Erreur lors de la mise à jour de la convocation :", error);
            alert("Erreur lors de l'enregistrement : " + error.message);
        }
    };

    window.ajouterEvenementAdmin = async function() {
        const titre = document.getElementById('eventTitleInput').value.trim();
        const startDate = document.getElementById('eventStartDateInput').value;
        const endDate = document.getElementById('eventEndDateInput').value;
        const heureDebut = document.getElementById('eventStartTimeInput').value;
        const heureFin = document.getElementById('eventEndTimeInput').value;
        const lieu = document.getElementById('eventLieuInput').value.trim();
        const description = document.getElementById('eventDescriptionInput').value.trim();

        if (!titre || !startDate) {
            alert("Veuillez remplir au moins le titre et la date de début.");
            return;
        }

        try {
            await addDoc(collection(db, "entrainements"), {
                type: "info",
                titre: titre,
                startDate: startDate,
                endDate: endDate || startDate,
                heureDebut: heureDebut || "",
                heureFin: heureFin || "",
                lieu: lieu || "St Jean de Luz",
                description: description || "",
                createur: "Admin",
                createdAt: new Date().toISOString()
            });

            await addDoc(collection(db, "notifications_log"), {
                titre: `📅 Nouvel événement : ${titre}`,
                corps: `Prévu le ${startDate} (${lieu || "St Jean de Luz"})`,
                timestamp: new Date().toISOString(),
                url: "./entrainements.html"
            });

            alert("Événement enregistré et notification envoyée !");
            
            document.getElementById('eventTitleInput').value = "";
            document.getElementById('eventStartDateInput').value = "";
            document.getElementById('eventEndDateInput').value = "";
            document.getElementById('eventStartTimeInput').value = "";
            document.getElementById('eventEndTimeInput').value = "";
            document.getElementById('eventLieuInput').value = "";
            document.getElementById('eventDescriptionInput').value = "";
            document.getElementById('addEventCardAdmin').style.display = 'none';

            chargerCalendrierFirebase();
        } catch (e) {
            console.error("Erreur lors de l'enregistrement :", e);
            alert("Erreur lors de l'enregistrement dans Firebase.");
        }
    };

    function estDansLaPlage(dateStr, event) {
        const start = event.startDate || event.date;
        const end = event.endDate || start;
        if (!start) return false;
        return dateStr >= start && dateStr <= end;
    }

    function getTypeOfEvent(event) {
        const typeStr = (event.type || "").toLowerCase();
        const titleStr = (event.titre || event.title || "").toLowerCase();

        if (typeStr === 'info' || typeStr === 'perso' || titleStr.includes('partie') || titleStr.includes('championnat')) {
            return 'info';
        }
        if (typeStr.includes('physique') && (typeStr.includes('co' ) || typeStr.includes('collectif'))) {
            return 'physique-co';
        }
        if (typeStr.includes('physique') || titleStr.includes('physique') || titleStr.includes('muscu')) {
            return 'physique';
        }
        return 'technique';
    }

    function renderCalendar() {
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();
        const moisNoms = ["Janvier", "Février", "Mars", "Avril", "Mai", "Juin", "Juillet", "Août", "Septembre", "Octobre", "Novembre", "Décembre"];
        document.getElementById('calendarMonthYearTitle').innerText = `${moisNoms[month]} ${year}`;

        const firstDayIndex = (new Date(year, month, 1).getDay() + 6) % 7;
        const totalDays = new Date(year, month + 1, 0).getDate();
        const grid = document.getElementById('calendarGrid');
        grid.innerHTML = `
            <div class="calendar-day-name">Lun</div><div class="calendar-day-name">Mar</div><div class="calendar-day-name">Mer</div><div class="calendar-day-name">Jeu</div><div class="calendar-day-name">Ven</div><div class="calendar-day-name">Sam</div><div class="calendar-day-name">Dim</div>
        `;

        for (let i = 0; i < firstDayIndex; i++) {
            grid.innerHTML += `<div class="calendar-day empty"></div>`;
        }

        for (let day = 1; day <= totalDays; day++) {
            const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
            const matchingEvents = calendrierCloudEvents.filter(e => estDansLaPlage(dateStr, e));
            
            let matchClass = '';
            let dotsHtml = '';

            if (matchingEvents.length > 0) {
                const hasInfo = matchingEvents.some(e => getTypeOfEvent(e) === 'info');
                const hasPhysique = matchingEvents.some(e => getTypeOfEvent(e).includes('physique'));
                const hasTechnique = matchingEvents.some(e => getTypeOfEvent(e).includes('technique'));

                if (hasInfo) matchClass = 'has-info';
                else if (hasPhysique) matchClass = 'has-physique';
                else if (hasTechnique) matchClass = 'has-technique';

                dotsHtml = `<div class="event-dots-container">`;
                matchingEvents.forEach(ev => {
                    const t = getTypeOfEvent(ev);
                    let dotClass = 'technique';
                    if (t === 'info') dotClass = 'info';
                    else if (t.includes('physique')) dotClass = 'physique';
                    
                    dotsHtml += `<div class="multi-dot ${dotClass}"></div>`;
                });
                dotsHtml += `</div>`;
                
                if (matchingEvents.length > 2) {
                    dotsHtml += `<span class="event-count-badge">${matchingEvents.length}</span>`;
                }
            }

            if (dateStr === selectedDateStr) matchClass += ' selected';

            grid.innerHTML += `
                <div class="calendar-day ${matchClass}" onclick="selectCalendarDate('${dateStr}')">
                    ${day} ${dotsHtml}
                </div>
            `;
        }
    }

    window.changerMois = function(direction) {
        currentDate.setMonth(currentDate.getMonth() + direction);
        renderCalendar();
    }

    window.selectCalendarDate = function(dateStr) {
        selectedDateStr = dateStr;
        const parts = dateStr.split('-');
        
        const matchingEvents = calendrierCloudEvents.filter(e => estDansLaPlage(dateStr, e));
        
        matchingEvents.sort((a, b) => {
            const dateA = a.startDate || a.date || "";
            const dateB = b.startDate || b.date || "";
            if (dateA !== dateB) {
                return dateB.localeCompare(dateA);
            }
            const heureA = a.heureDebut || "00:00";
            const heureB = b.heureDebut || "00:00";
            return heureB.localeCompare(heureA);
        });

        document.getElementById('selectedDateTitle').innerText = `SESSIONS DU ${parts[2]}/${parts[1]}/${parts[0]}`;

        renderCalendar();

        const previewBox = document.getElementById('matchPreviewBox');
        const previewContent = document.getElementById('matchPreviewContent');

        if (matchingEvents.length > 0) {
            let htmlText = "";
            matchingEvents.forEach(ev => {
                const isInfo = ev.type === 'info' || getTypeOfEvent(ev) === 'info';
                const titreTexte = ev.titre || ev.title || "";
                const lieuTxt = ev.lieu ? ` • 📍 ${ev.lieu}` : '';
                const heureTxt = ev.heureDebut ? `🕒 ${ev.heureDebut}` : '';
                
                let infoBasTxt = "";
                if (heureTxt && lieuTxt) {
                    infoBasTxt = `${heureTxt} ${lieuTxt}`;
                } else {
                    infoBasTxt = `${heureTxt}${ev.lieu ? '📍 ' + ev.lieu : ''}`;
                }

                const descTxt = ev.description ? `<div style="font-size: 0.8rem; font-weight: bold; color: var(--container-text); margin-top: 4px; margin-bottom: 4px;">${ev.description}</div>` : '';

                let convoquesHtml = "";
                if (ev.convoques && Array.isArray(ev.convoques) && ev.convoques.length > 0) {
                    convoquesHtml += `
                        <div class="convoques-box">
                            <div class="convoques-title">👥 Convocations & Statuts :</div>
                    `;
                    ev.convoques.forEach(c => {
                        const statut = c.statut ? c.statut.toLowerCase().trim() : "en_attente";
                        let statutBadge = `<span class="badge-attente">⏳ En attente</span>`;
                        if (statut === 'present') {
                            statutBadge = `<span class="badge-present">✅ Présent</span>`;
                        } else if (statut === 'absent') {
                            const motifTxt = c.motif ? ` (${c.motif})` : '';
                            statutBadge = `<span class="badge-absent">❌ Absent${motifTxt}</span>`;
                        }

                        convoquesHtml += `
                            <div class="convoque-row">
                                <span>${c.nom || "Joueur"}</span>
                                <span>${statutBadge}</span>
                            </div>
                        `;
                    });
                    convoquesHtml += `</div>`;
                }

                // Boutons d'action robustes avec transmission de l'ID Firebase de l'événement
                let presenceButtonsHtml = `
                    <div class="presence-actions">
                        <button class="btn-present" onclick="repondreEntrainement('${ev.id}', 'present')">✅ Je serai présent</button>
                        <button class="btn-absent" onclick="repondreEntrainement('${ev.id}', 'absent')">❌ Absent</button>
                    </div>
                `;

                if (isInfo) {
                    htmlText += `
                        <div class="card-item card-info">
                            <div class="item-title">📌 ${titreTexte}</div>
                            ${descTxt}
                            <div class="item-sub">${infoBasTxt}</div>
                            ${convoquesHtml}
                            ${presenceButtonsHtml}
                        </div>
                    `;
                } else {
                    htmlText += `
                        <div class="card-item">
                            <div class="item-title">${titreTexte}</div>
                            ${descTxt}
                            <div class="item-sub">${infoBasTxt}</div>
                            ${convoquesHtml}
                            ${presenceButtonsHtml}
                        </div>
                    `;
                }
            });
            previewContent.innerHTML = htmlText;
            previewBox.classList.add('active');
        } else {
            previewContent.innerHTML = `<div style="font-size: 0.78rem; color: var(--text-muted);">Aucun événement prévu ce jour-là.</div>`;
            previewBox.classList.add('active');
        }
    }
</script>

</body>
</html>
