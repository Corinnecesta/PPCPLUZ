<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cesta Punta - Historique des Matchs</title>
    
    <!-- Polices -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Fichier de styles global -->
    <link rel="stylesheet" href="style.css">

    <style>
        /* Styles spécifiques à la page Historique */
        .section-title { font-size: 0.85rem; color: var(--accent-color); text-transform: uppercase; font-weight: 700; margin-bottom: 12px; letter-spacing: 0.5px; }

        .search-bar { background: var(--card-bg); border: 2px solid var(--card-border); border-radius: 16px; padding: 10px 15px; display: flex; align-items: center; gap: 10px; margin-bottom: 4px; color: var(--accent-color); font-size: 0.85rem; box-shadow: 0 4px 12px rgba(23, 184, 144, 0.2); transition: all 0.3s; }
        .search-bar input { background: transparent; border: none; color: var(--container-text); outline: none; width: 100%; font-size: 0.85rem; }
        .search-bar input::placeholder { color: var(--text-muted); }

        .match-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 8px; }
        .match-history-card { background: var(--card-bg); border: 2px solid var(--card-border); border-radius: 16px; padding: 14px; box-shadow: 0 4px 12px rgba(23, 184, 144, 0.2); transition: all 0.25s ease; }
        .match-history-card:hover { border-color: var(--accent-color); background: var(--card-hover-bg); transform: translateY(-2px); }
        
        .match-header-row { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
        .match-date { font-size: 0.7rem; color: var(--text-muted); margin-bottom: 3px; }
        .match-opponents { font-weight: bold; font-size: 0.9rem; color: var(--container-text); }
        
        .score-pill { background: var(--card-hover-bg); border: 1px solid var(--card-border); padding: 4px 10px; border-radius: 8px; font-weight: 800; font-size: 0.8rem; text-align: center; }
        .score-pill.win { border-color: #10b981; color: #34d399; }
        .score-pill.loss { border-color: #f43f5e; color: #fb7185; }

        .match-details-box { background: var(--card-hover-bg); border: 1px solid var(--card-border); border-radius: 10px; padding: 8px 10px; font-size: 0.75rem; color: var(--text-muted); display: flex; justify-content: space-between; align-items: center; }
        .match-sets { color: var(--accent-color); font-weight: 600; }
    </style>
</head>
<body>

<div class="mobile-container">
    <div class="top-header">
        <img src="logoce.png" alt="Logo Cesta Punta" class="logo-img">
        <div class="header-actions">
            <!-- Bouton retour accueil avec icône maison -->
            <a href="accueil.html" class="home-btn" title="Retour Accueil">🏠</a>
            <!-- Bouton de bascule de thème -->
            <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()" title="Changer de thème">🌙</button>
            <!-- Bouton profil / compte -->
            <a href="parametres.html" class="profile-btn" title="Mon Compte">👤</a>
        </div>
    </div>

    <!-- Trait de séparation -->
    <hr class="separator">

    <div class="section-title">Historique des rencontres</div>

    <div class="search-bar">
        <span>🔍</span>
        <input type="text" id="searchMatchInput" placeholder="Filtrer par joueur, lieu..." onkeyup="filterMatchs()">
    </div>

    <div class="match-list" id="matchsContainer"></div>
</div>

<script src="matchs-data.js"></script>
<script>
    // Lecture et synchronisation automatique du thème au chargement
    const savedTheme = localStorage.getItem('cesta_theme') || 'dark';
    const htmlElement = document.documentElement;
    const themeToggleBtn = document.getElementById('themeToggleBtn');

    htmlElement.setAttribute('data-theme', savedTheme);
    updateButtonIcon(savedTheme);

    // Fonction de bascule de thème
    function toggleTheme() {
        const currentTheme = htmlElement.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        
        htmlElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('cesta_theme', newTheme);
        updateButtonIcon(newTheme);
    }

    function updateButtonIcon(theme) {
        if (theme === 'light') {
            themeToggleBtn.innerHTML = '☀️';
        } else {
            themeToggleBtn.innerHTML = '🌙';
        }
    }

    function renderMatchs(list) {
        const container = document.getElementById('matchsContainer');
        container.innerHTML = '';

        if (list.length === 0) {
            container.innerHTML = '<div style="text-align: center; color: var(--text-muted); padding: 20px; font-size: 0.85rem;">Aucun match trouvé</div>';
            return;
        }

        list.forEach(m => {
            const isWin = m.gagnant === 'rouge';
            const card = document.createElement('div');
            card.className = 'match-history-card';
            card.innerHTML = `
                <div class="match-header-row">
                    <div>
                        <div class="match-date">${m.date} • ${m.lieu}</div>
                        <div class="match-opponents">${m.joueurRouge} vs ${m.joueurBleu}</div>
                    </div>
                    <div class="score-pill ${isWin ? 'win' : 'loss'}">${m.resultatTexte}</div>
                </div>
                <div class="match-details-box">
                    <span>${m.format}</span>
                    <span class="match-sets">${m.scoreDetail}</span>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function filterMatchs() {
        const query = document.getElementById('searchMatchInput').value.toLowerCase();
        const filtered = matchsData.filter(m => 
            m.lieu.toLowerCase().includes(query) || 
            m.joueurRouge.toLowerCase().includes(query) || 
            m.joueurBleu.toLowerCase().includes(query)
        );
        renderMatchs(filtered);
    }

    renderMatchs(matchsData);
</script>

</body>
</html>
